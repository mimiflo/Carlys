# Publication des images vers GHCR — ce qui rend `deploy.sh <env> <sha>` possible.
#
# `images-ci` PROUVE que les trois images se construisent et démarrent ; il ne
# les publie nulle part. Tant que rien ne les publie, le déploiement par SHA
# décrit dans infrastructure/deployment/README.md n'a pas d'images à tirer :
# ce workflow est la moitié manquante, et lui seul écrit dans le registre.
#
# Séparation assumée entre les deux portes : `images-ci` est le GARDE-FOU (il
# exerce la garde légale et démarre réellement les images), celui-ci est la
# PUBLICATION. Les deux tournent sur la même poussée, donc les images sont
# bâties deux fois. On l'accepte : fusionner les rôles ferait dépendre la
# vérification du droit d'écrire dans le registre, et un workflow qui publie
# doit pouvoir rester simple et lisible. Le surcoût est borné par les mêmes
# filtres `paths` et par le cache de couches GHA.
name: images-publish

# ── Où publier, et pourquoi pas seulement `main` ──────────────────────────────
#
# La question est réelle : un build d'image coûte plusieurs minutes et chaque
# SHA occupe de la place dans GHCR. Le réflexe serait de ne publier que depuis
# `main`. On ne le fait pas, pour la même raison qui a fait nommer les deux
# branches dans `images-ci` : CE DÉPÔT N'AVANCE PAS PAR `main`. Il avance par
# poussées directes sur claude/carlys-fitness-foundation-lqv2hl. Publier depuis
# `main` seulement, ici, reviendrait à ne jamais rien publier — donc à ne
# jamais pouvoir déployer la recette, alors que la recette est précisément
# l'environnement qui doit recevoir n'importe quel commit sans attendre une
# fusion.
#
# La contrepartie est mesurée : les filtres `paths` ci-dessous (rien ne tourne
# si aucune entrée de build n'a bougé) et la règle de rétention que rappelle
# le guide de mise en route (les vieux tags `sha-…` se purgent depuis
# l'onglet Packages ; ils ne s'accumulent pas d'eux-mêmes indéfiniment).
on:
  push:
    branches: [claude/carlys-fitness-foundation-lqv2hl, main]
    # Même liste que `images-ci` : ce sont les entrées réelles des deux
    # Dockerfile. GitHub Actions ignore les ancres YAML — toute entrée ajoutée
    # à `images-ci` doit l'être ici aussi, sans quoi une image publiée
    # cesserait de correspondre à son SHA.
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'docs/legal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/images-publish.yml'
  # Rattrapage manuel : republier un commit dont la publication a été perdue
  # (annulation, panne de runner) sans avoir à pousser un commit vide.
  workflow_dispatch:

# `cancel-in-progress: false`, à REBOURS d'`images-ci`, et c'est délibéré.
# `images-ci` donne un avis sur la tête d'une rafale : annuler les
# intermédiaires ne coûte rien. Ici, chaque exécution annulée laisse un SHA
# SANS IMAGE dans le registre — un trou qui ne se découvre qu'au moment du
# `deploy.sh <env> <ce sha>`, c'est-à-dire au pire moment. Le groupe sérialise
# les exécutions ; le coût est du temps d'attente, pas un registre troué.
concurrency:
  group: images-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publier:
    name: Construction et publication (recette)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      # Le seul droit ajouté : écrire dans GHCR. Aucun secret à créer, le
      # GITHUB_TOKEN de l'exécution suffit — c'est la raison pour laquelle ce
      # workflow ne demande jamais de PAT. Le SERVEUR, lui, en a besoin d'un
      # (lecture seule) : voir /srv/carlys/ghcr.token dans le guide.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── Le SHA court, une seule fois, pour les trois images ────────────────
      # 12 caractères : c'est la longueur que manipulent DEPLOYED, deploy.sh et
      # promote.sh. Le préfixe `sha-` est obligatoire, un tag Docker ne pouvant
      # pas être ambigu avec un digest.
      - name: Étiquettes
        id: etiquettes
        run: |
          sha12="$(echo "${{ github.sha }}" | cut -c1-12)"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          # GHCR n'accepte que des chemins en minuscules ; le dépôt s'appelle
          # « Carlys ». On dérive le propriétaire plutôt que de l'écrire en
          # dur, mais le contrat fixe le résultat attendu : ghcr.io/mimiflo.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Images du commit $sha12"

      # ── L'adresse publique de l'API est INLINÉE dans le bundle admin ───────
      #
      # `NEXT_PUBLIC_API_BASE_URL` n'est pas une variable d'exécution : Next.js
      # la remplace textuellement AU BUILD (apps/admin/src/lib/env.ts), et
      # `api-status.tsx` est un composant `'use client'`. Une image admin
      # construite sans elle embarque donc le défaut `http://localhost:3000`
      # dans le JavaScript envoyé au NAVIGATEUR : le back-office se charge,
      # s'affiche, et n'atteint aucune API. Exactement la classe de panne qui a
      # justifié `images-ci` — une image qui se construit n'est pas une image
      # qui marche —, mais que ni un build ni un démarrage ne peuvent voir.
      #
      # D'où l'échec bruyant plutôt qu'un défaut commode : la variable de dépôt
      # CARLYS_DOMAIN (Settings → Secrets and variables → Actions → Variables)
      # doit exister avant la première publication. Une seule fois, et le
      # message ci-dessous dit quoi faire.
      - name: Le domaine de déploiement est connu
        env:
          CARLYS_DOMAIN: ${{ vars.CARLYS_DOMAIN }}
        run: |
          if [ -z "$CARLYS_DOMAIN" ]; then
            echo "::error title=Variable de dépôt CARLYS_DOMAIN absente::L'image admin fige l'adresse de l'API dans le JavaScript du navigateur (NEXT_PUBLIC_API_BASE_URL est inlinée au build). Sans CARLYS_DOMAIN, l'image publiée pointerait le navigateur vers http://localhost:3000 et le back-office serait muet. Pose-la dans Settings → Secrets and variables → Actions → Variables, nom CARLYS_DOMAIN, valeur le domaine nu (exemple : carlys.app), puis relance ce workflow."
            exit 1
          fi
          echo "Domaine : $CARLYS_DOMAIN"
          echo "API de recette visée par l'image admin : https://api-staging.$CARLYS_DOMAIN"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Les trois images ───────────────────────────────────────────────────
      #
      # Le tag mouvant `staging` ne suit QUE la branche de travail, et il est
      # de pur confort d'affichage : on lit d'un coup d'œil ce qui est le plus
      # récent dans l'onglet Packages. AUCUN déploiement ne s'en sert — la
      # règle du contrat est le déploiement par SHA, pour que la promotion
      # recette → production redéploie exactement les mêmes octets.
      - name: Étiquette mouvante `staging` — seulement sur la branche de travail
        id: mouvant
        run: |
          if [ "${{ github.ref }}" = "refs/heads/claude/carlys-fitness-foundation-lqv2hl" ]; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
            echo "Le tag mouvant \`staging\` suivra ce commit."
          else
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "Référence ${{ github.ref }} : publication par SHA seulement."
          fi

      - name: Image API — exécution
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.etiquettes.outputs.owner }}/carlys-api:sha-${{ steps.etiquettes.outputs.sha12 }}
            ${{ steps.mouvant.outputs.actif == 'oui' && format('{0}/{1}/carlys-api:staging', env.REGISTRY, steps.etiquettes.outputs.owner) || '' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          # Une seule image par plateforme, sans attestation : le registre
          # reste lisible (un tag = un manifeste) et `docker pull` côté serveur
          # n'a pas d'index à traverser.
          provenance: false

      - name: Image API — migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.etiquettes.outputs.owner }}/carlys-api-migrate:sha-${{ steps.etiquettes.outputs.sha12 }}
            ${{ steps.mouvant.outputs.actif == 'oui' && format('{0}/{1}/carlys-api-migrate:staging', env.REGISTRY, steps.etiquettes.outputs.owner) || '' }}
          # Même scope de cache que l'image d'exécution : les deux cibles
          # partagent l'étage `build`, l'essentiel du temps de construction.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api-migrate,mode=max
          provenance: false

      # LEGAL_PLACEHOLDERS=allow est DÉLIBÉRÉ, et strictement réservé à la
      # recette : les textes de docs/legal portent encore des marqueurs
      # « [À COMPLÉTER : … ] », et une image de recette doit pouvoir exister
      # avant qu'ils soient rédigés. L'image de PRODUCTION, elle, est bâtie
      # par images-publish-prod.yml, garde armée : c'est là que le tag `-prod`
      # se gagne, et nulle part ailleurs.
      - name: Image admin — recette (garde légale desserrée)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            LEGAL_PLACEHOLDERS=allow
            NEXT_PUBLIC_API_BASE_URL=https://api-staging.${{ vars.CARLYS_DOMAIN }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.etiquettes.outputs.owner }}/carlys-admin:sha-${{ steps.etiquettes.outputs.sha12 }}
            ${{ steps.mouvant.outputs.actif == 'oui' && format('{0}/{1}/carlys-admin:staging', env.REGISTRY, steps.etiquettes.outputs.owner) || '' }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          provenance: false

      # ── La preuve que deploy.sh trouvera ce qu'il vient chercher ───────────
      # `push: true` a réussi ne dit pas que le TAG se résout : c'est ce que
      # `deploy.sh` fera, et c'est donc ce qu'on vérifie, sur les trois noms.
      - name: Les trois tags se résolvent dans le registre
        run: |
          for image in carlys-api carlys-api-migrate carlys-admin; do
            reference="${{ env.REGISTRY }}/${{ steps.etiquettes.outputs.owner }}/$image:sha-${{ steps.etiquettes.outputs.sha12 }}"
            echo "── $reference"
            docker buildx imagetools inspect "$reference" > /dev/null \
              || { echo "::error::$reference est introuvable dans le registre alors que la publication a été signalée réussie."; exit 1; }
          done
          echo "Les trois images du commit ${{ steps.etiquettes.outputs.sha12 }} sont publiées."

      - name: Récapitulatif
        run: |
          {
            echo "## Images publiées — commit \`${{ steps.etiquettes.outputs.sha12 }}\`"
            echo
            echo "| Image | Tag |"
            echo "| ----- | --- |"
            for image in carlys-api carlys-api-migrate carlys-admin; do
              echo "| \`${{ env.REGISTRY }}/${{ steps.etiquettes.outputs.owner }}/$image\` | \`sha-${{ steps.etiquettes.outputs.sha12 }}\` |"
            done
            echo
            echo "Déploiement en recette, sur le serveur :"
            echo
            echo '```bash'
            echo "sudo /srv/carlys/scripts/deploy.sh staging ${{ steps.etiquettes.outputs.sha12 }}"
            echo '```'
            echo
            echo "L'image admin de ce tag vise \`https://api-staging.${{ vars.CARLYS_DOMAIN }}\` et porte"
            echo "\`LEGAL_PLACEHOLDERS=allow\` : elle n'est PAS déployable en production."
            echo "La production se gagne par le workflow \`images-publish-prod\`."
          } >> "$GITHUB_STEP_SUMMARY"
