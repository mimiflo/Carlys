# Images Docker — la porte qui manquait.
#
# Les `Dockerfile` d'apps/api et apps/admin sont le chemin de déploiement
# documenté (infrastructure/deployment/README.md), mais AUCUN workflow ne les
# construisait : trois régressions bloquantes ont pu s'installer sans qu'une
# seule CI ne rougisse. Ce workflow construit les trois cibles publiées par ce
# README, puis DÉMARRE les images servies — voir les étapes « fumée » : une
# image qui se construit n'est pas une image qui marche.
#
# Un second job, `minio`, fait de même pour les deux images d'infrastructure
# que Carlys construit elle-même depuis les sources de MinIO et de mc, faute
# d'images officielles (infrastructure/minio/README.md).
name: images-ci

# Pourquoi cette porte-ci nomme la branche de travail alors qu'api-ci et
# admin-ci s'en tiennent à `main` : le dépôt n'avance PAS par pull request, il
# avance par poussées directes sur development.
# Un déclencheur limité à `pull_request` + `main` ne s'ouvre donc jamais avant
# une fusion — c'est exactement ce qui a laissé les trois régressions ci-dessus
# vivre si longtemps sans qu'une seule CI ne rougisse. On s'aligne sur
# mobile-recette.yml, qui nomme lui aussi les deux branches.
#
# L'arbitrage est assumé, car il va contre le réflexe : un build d'image coûte
# bien plus cher qu'un job de tests (installation complète des dépendances puis
# compilation, plusieurs minutes, contre quelques dizaines de secondes), et le
# premier mouvement serait donc de le déclencher MOINS souvent, pas plus. Mais
# le prix d'un échec n'est pas symétrique : un test rouge se voit dans la
# minute, tandis qu'une image morte ne se découvre qu'au déploiement, là où la
# corriger coûte le plus cher. Deux garde-fous bornent la facture — les filtres
# `paths` ci-dessous (rien ne tourne si aucune entrée du build n'a bougé) et le
# `cancel-in-progress` plus bas (une seule exécution par rafale de poussées).
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      # Le build de l'image admin rend /privacy et /terms depuis ces fichiers.
      - 'docs/legal/**'
      # Les quatre fichiers de la RACINE que les DEUX Dockerfile recopient
      # explicitement : `COPY pnpm-workspace.yaml package.json pnpm-lock.yaml
      # .npmrc ./`. Le package.json racine porte `packageManager` (donc la
      # version de pnpm que corepack installe dans l'image) et `pnpm.overrides`
      # (donc les versions réellement résolues) ; .npmrc porte le registre et
      # `engine-strict`. Les omettre laissait passer une bosse de version ou un
      # changement de registre : les images changeaient sans réveiller la porte.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      # Les images MinIO et mc (job `minio`), construites depuis leurs
      # sources : leur recette, et le compose du serveur qui en porte les
      # étiquettes — les deux doivent bouger ensemble, et ce job le vérifie.
      - 'infrastructure/minio/**'
      - 'infrastructure/server/compose.yml'
      - '.github/workflows/images-ci.yml'
  push:
    branches: [development, production]
    # GitHub Actions ignore les ancres YAML : la liste ci-dessus est recopiée
    # telle quelle. Toute entrée ajoutée ici doit l'être aux deux endroits.
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'docs/legal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - 'infrastructure/minio/**'
      - 'infrastructure/server/compose.yml'
      - '.github/workflows/images-ci.yml'

# Construire une image coûte plusieurs minutes : les poussées successives d'une
# même référence s'annulent entre elles, seule la dernière est vérifiée.
concurrency:
  group: images-ci-${{ github.ref }}
  cancel-in-progress: true

# Le GITHUB_TOKEN par défaut hérite du réglage du dépôt (Settings → Actions →
# Workflow permissions), invisible depuis ce fichier. Lecture seule explicite :
# ce workflow ne fait que vérifier, il n'écrit rien — et une action tierce
# compromise n'y trouverait pas de jeton en écriture.
permissions:
  contents: read

jobs:
  build:
    name: Construction des images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # L'image de l'API est DÉMARRÉE en fin de job : il lui faut ses deux
    # dépendances d'infrastructure, comme dans api-ci.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carlys
          POSTGRES_PASSWORD: carlys
          POSTGRES_DB: carlys_images
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carlys -d carlys_images"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Les deux cibles de l'API partagent l'étage `build` (installation +
      # compilation, l'essentiel du temps) : les construire dans le MÊME job
      # le fait calculer une seule fois, le cache de couches local servant la
      # seconde. C'est aussi l'ordre du déploiement réel.
      - name: Image API — exécution
        run: docker build -f apps/api/Dockerfile -t carlys-api:ci .

      - name: Image API — migrations
        run: docker build -f apps/api/Dockerfile --target migrate -t carlys-api-migrate:ci .

      # Le conteneur de migration ne DOIT pas jouer de migration ici (aucune
      # bascule de trafic à protéger) : on vérifie seulement que son point
      # d'entrée est bien le CLI Prisma, présent et exécutable.
      - name: Image migrations — le CLI Prisma répond
        run: docker run --rm --entrypoint ./node_modules/.bin/prisma carlys-api-migrate:ci --version

      # --build-arg LEGAL_PLACEHOLDERS=allow est DÉLIBÉRÉ : tant que
      # docs/legal/*.md portent des marqueurs « [À COMPLÉTER : … ] », le build
      # par défaut échoue exprès. La CI vérifie que l'image se construit, pas
      # que les textes légaux sont finis — l'étape suivante s'en charge.
      - name: Image admin
        run: |
          docker build -f apps/admin/Dockerfile \
            --build-arg LEGAL_PLACEHOLDERS=allow -t carlys-admin:ci .

      # La garde légale est une sécurité de production : tant qu'un marqueur
      # subsiste, une image SANS `allow` doit refuser de se construire. Une
      # garde que personne n'exerce finit par ne plus mordre — ici, un build
      # qui RÉUSSIT est un échec du job.
      - name: La garde légale mord toujours
        run: |
          if docker build -f apps/admin/Dockerfile -t carlys-admin:garde . > garde.log 2>&1; then
            echo "::error::L'image admin s'est construite malgré les marqueurs [À COMPLÉTER] :"
            echo "::error::la garde de docs/legal (src/lib/legal-documents.ts) ne protège plus la production."
            exit 1
          fi
          grep -q 'marqueur(s) à compléter' garde.log \
            || { echo "::error::Build échoué, mais pas pour la garde légale :"; tail -40 garde.log; exit 1; }
          echo "Garde légale vérifiée : build refusé et marqueurs listés."

      # L'image admin était CONSTRUITE mais jamais DÉMARRÉE — la moitié
      # manquante, et exactement la classe de défaut qui justifie ce workflow :
      # le blocage le plus coûteux passait le build et livrait une image morte.
      # Un build Next.js `standalone` a en plus ses pièges propres : ni
      # .next/static ni public/ ne sont embarqués par `next build`, les deux se
      # recopient à la main dans le Dockerfile — un oubli ne se voit qu'à
      # l'exécution. Aucun service ajouté : l'admin ne parle ni à PostgreSQL ni
      # à Redis, ses pages publiques sont rendues au build. La fumée admin
      # passe donc AVANT celle de l'API, la moins chère des deux d'abord.
      - name: Fumée — l'image admin démarre et répond
        run: |
          docker run -d --name carlys-admin-smoke --network host carlys-admin:ci
          for _ in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = "200" ]; then
              echo "/ répond."
              # Les deux pages engendrées à partir de docs/legal : elles
              # prouvent que les textes ont bien été embarqués au build et que
              # les recopies de .next/static ont suivi. `-f` fait échouer
              # l'étape sur toute réponse hors 2xx.
              curl -fsS -o /dev/null -w '/privacy → %{http_code}\n' http://127.0.0.1:3001/privacy
              curl -fsS -o /dev/null -w '/terms → %{http_code}\n' http://127.0.0.1:3001/terms
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'image admin n'a pas répondu sur /."
          docker logs carlys-admin-smoke
          exit 1

      # LE test qui manquait. Le blocage le plus coûteux passait le BUILD et
      # donnait une image morte (« Cannot find module '@carlys/shared-config' »,
      # puis « Cannot find module 'zod' ») : seul un démarrage réel distingue
      # une image qui se construit d'une image qui marche.
      #
      # NODE_ENV=production est volontaire : c'est le mode qui refuse les
      # valeurs de développement (env.production.ts), donc celui qui est
      # réellement déployé. Les valeurs ci-dessous sont factices et publiques.
      - name: Fumée — l'image API démarre et répond
        env:
          SMOKE_ENV: >-
            -e NODE_ENV=production
            -e DATABASE_URL=postgresql://carlys:carlys@127.0.0.1:5432/carlys_images
            -e REDIS_URL=redis://127.0.0.1:6379
            -e JWT_ACCESS_SECRET=secret-ci-uniquement-32-caracteres-minimum-x
            -e CORS_ORIGINS=https://admin.carlys.example
            -e PUBLIC_APP_URL=https://admin.carlys.example
            -e SMTP_HOST=smtp.carlys.example
            -e EMAIL_FROM=no-reply@carlys.example
            -e S3_ENDPOINT=https://s3.carlys.example
            -e S3_BUCKET=carlys-media
            -e S3_ACCESS_KEY_ID=carlys-ci
            -e S3_SECRET_ACCESS_KEY=carlys-ci-secret
            -e S3_PUBLIC_BASE_URL=https://media.carlys.example/carlys-media
        run: |
          docker run -d --name carlys-api-smoke --network host $SMOKE_ENV carlys-api:ci
          for _ in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/live)" = "200" ]; then
              echo "/health/live répond."
              curl -s http://127.0.0.1:3000/health/live; echo
              # /health/ready touche PostgreSQL : il prouve en plus que le
              # client Prisma engendré a survécu à la fabrication de l'arbre
              # de production (`pnpm deploy` le perd si on ne le régénère pas).
              curl -fsS http://127.0.0.1:3000/health/ready; echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'image API n'a pas répondu sur /health/live."
          docker logs carlys-api-smoke
          exit 1

      # `|| true` sur chaque ligne : le conteneur de l'étape non atteinte
      # n'existe pas, son absence ne doit pas masquer le journal de l'autre.
      - name: Journaux des conteneurs en cas d'échec
        if: failure()
        run: |
          docker logs carlys-admin-smoke || true
          docker logs carlys-api-smoke || true

      - name: Nettoyage
        if: always()
        run: docker rm -f carlys-admin-smoke carlys-api-smoke || true

  # ── MinIO et mc, construits depuis leurs sources ───────────────────────────
  #
  # Les images officielles ont disparu de Docker Hub, puis de quay.io
  # (infrastructure/minio/README.md) : le serveur tire désormais NOS images,
  # publiées par images-publish, et le développement les construit sur place.
  # Ce job prouve, avant toute publication, qu'elles se construisent, qu'elles
  # sont bien ce qu'elles prétendent être, et qu'elles reproduisent la
  # configuration du serveur — sonde de santé et politiques des deux buckets
  # comprises.
  #
  # Un job à part, en parallèle de `build` : rien de commun avec les images
  # Node. Et buildx avec le cache GHA plutôt qu'un `docker build` nu comme
  # ci-dessus : compiler minio coûte plusieurs minutes, et ce job tourne aussi
  # sur les poussées qui ne touchent que l'API ou l'admin (le filtre `paths`
  # vaut pour tout le workflow) — il doit alors se réduire à un rejeu du cache.
  minio:
    name: Images MinIO et mc (depuis les sources)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # La seule recopie de la recette hors de infrastructure/minio/ : les
      # étiquettes que le serveur tire par défaut. Une recette modifiée sans
      # elles laisserait le serveur sur l'ancienne image, sans rien dire.
      - name: Le compose du serveur référence les images de cette recette
        run: sh infrastructure/minio/construire.sh verifier-compose infrastructure/server/compose.yml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image minio (serveur + mc)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infrastructure/minio
          target: minio
          load: true
          tags: carlys-minio:ci
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
          provenance: false

      # Même étage de construction que ci-dessus : il se relit depuis le
      # cache `minio`, seul l'étage final est propre à `mc`.
      - name: Image mc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infrastructure/minio
          target: mc
          load: true
          tags: carlys-mc:ci
          cache-from: |
            type=gha,scope=mc
            type=gha,scope=minio
          cache-to: type=gha,scope=mc,mode=max
          provenance: false

      # Chaque binaire annonce-t-il le tag ET le commit de versions.env ? Le
      # mc embarqué dans l'image du serveur compte : c'est lui qui répond à la
      # sonde de santé.
      #
      # `sed -n 1p` et non `head -n 1` : head ferme le tube après la première
      # ligne, `docker run` échoue alors sur « broken pipe », et le `pipefail`
      # des étapes GitHub en fait un échec — mesuré en rejouant cette étape.
      - name: Fumée — identité des binaires et licences
        run: |
          . infrastructure/minio/versions.env
          verifier_version() {
            annonce="$(docker run --rm --entrypoint "$2" "$1" --version | sed -n 1p)"
            echo "$1 / $2 : $annonce"
            case "$annonce" in
              *"$3"*"$4"*) ;;
              *) echo "::error::$1 : « $2 --version » n'annonce pas $3 / $4."; exit 1 ;;
            esac
          }
          verifier_version carlys-minio:ci minio "$CARLYS_MINIO_RELEASE" "$CARLYS_MINIO_COMMIT"
          verifier_version carlys-minio:ci mc "$CARLYS_MC_RELEASE" "$CARLYS_MC_COMMIT"
          verifier_version carlys-mc:ci mc "$CARLYS_MC_RELEASE" "$CARLYS_MC_COMMIT"
          docker run --rm --entrypoint cat carlys-minio:ci /licenses/minio/SOURCE /licenses/mc/SOURCE

      # Le serveur tel que les deux compose le lancent, la sonde de santé
      # qu'ils déclarent, puis la configuration que minio-init pose sur le
      # serveur : bucket des médias lisible objet par objet mais PAS listable,
      # bucket privé fermé. Les codes attendus sont ceux mesurés en exploitation
      # (infrastructure/server/compose.yml).
      - name: Fumée — sonde de santé, buckets et politiques
        run: |
          docker run -d --name carlys-minio-smoke --network host \
            -e MINIO_ROOT_USER=carlys-ci -e MINIO_ROOT_PASSWORD=carlys-ci-secret \
            carlys-minio:ci server /data --console-address :9001
          pret=0
          for _ in $(seq 1 30); do
            if docker exec carlys-minio-smoke mc ready local; then pret=1; break; fi
            sleep 2
          done
          if [ "$pret" -ne 1 ]; then
            echo "::error::« mc ready local » (la sonde des compose) ne répond pas après 60 s."
            docker logs carlys-minio-smoke
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/fumee"
          printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::carlys-media/*"]}]}' \
            > "$RUNNER_TEMP/fumee/politique.json"
          printf 'fumee' > "$RUNNER_TEMP/fumee/objet.txt"
          docker run --rm --network host -v "$RUNNER_TEMP/fumee:/fumee:ro" \
            --entrypoint /bin/sh carlys-mc:ci -c '
              set -e
              mc alias set local http://127.0.0.1:9000 carlys-ci carlys-ci-secret
              mc mb --ignore-existing local/carlys-media
              mc anonymous set-json /fumee/politique.json local/carlys-media
              mc mb --ignore-existing local/carlys-private
              mc anonymous set none local/carlys-private
              mc cp /fumee/objet.txt local/carlys-media/fumee.txt > /dev/null
              mc cp /fumee/objet.txt local/carlys-private/fumee.txt > /dev/null
            '

          attendu() {
            obtenu="$(curl -s -o /dev/null -w '%{http_code}' "$1")"
            echo "$1 → $obtenu (attendu : $2)"
            [ "$obtenu" = "$2" ]
          }
          attendu 'http://127.0.0.1:9000/carlys-media/fumee.txt' 200
          attendu 'http://127.0.0.1:9000/carlys-media/?list-type=2' 403
          attendu 'http://127.0.0.1:9000/carlys-private/fumee.txt' 403
          attendu 'http://127.0.0.1:9000/carlys-private/?list-type=2' 403

      - name: Journal de MinIO en cas d'échec
        if: failure()
        run: docker logs carlys-minio-smoke || true

      - name: Nettoyage
        if: always()
        run: docker rm -f carlys-minio-smoke || true
