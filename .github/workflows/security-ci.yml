name: security-ci

# Pourquoi `push:` nomme la branche de travail et pas seulement `main` : le
# dépôt n'avance PAS par pull request, il avance par poussées directes sur
# development. `git log --merges --oneline | wc -l`
# y rend ZÉRO fusion pour TOUTE la branche : une porte limitée à
# `pull_request` + `main` ne s'est donc JAMAIS ouverte pendant le
# développement. Pour une détection de secrets, c'est le pire des retards
# possibles — un jeton poussé est compromis à la seconde où il quitte le
# poste, et l'apprendre après la fusion ne change plus rien à la fuite,
# seulement à la note. On s'aligne sur mobile-recette.yml et
# images-ci.yml, qui nomment déjà les deux branches.
#
# L'arbitrage coûte ici beaucoup moins cher qu'ailleurs : ce workflow n'a aucun
# filtre `paths` (un secret peut apparaître dans n'importe quel fichier, la
# porte doit donc s'ouvrir à chaque poussée), mais ses deux jobs sont légers —
# le scan de tout l'historique se compte en SECONDES, sur quelques milliers de
# fragments et une poignée de mégaoctets. Les trois nombres exacts grossissent
# à chaque commit : les graver ici les périmerait, TruffleHog imprime lui-même
# son bilan (fragments, octets, durée) à la fin du job, et c'est là qu'il faut
# les relire. L'audit, lui, se résume à une installation pnpm. Le `concurrency`
# borne le reste : son `cancel-in-progress` ne garde qu'une exécution par
# rafale de poussées. Le `schedule` hebdomadaire, lui, sert autre chose que les
# poussées : il rattrape les vulnérabilités publiées APRÈS le dernier commit.
on:
  pull_request:
  push:
    branches: [development, production]
  schedule:
    # Chaque lundi à 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

# Le GITHUB_TOKEN par défaut hérite du réglage du dépôt (Settings → Actions →
# Workflow permissions), invisible depuis ce fichier. Lecture seule explicite :
# ce workflow ne fait que vérifier, il n'écrit rien — et une action tierce
# compromise n'y trouverait pas de jeton en écriture.
permissions:
  contents: read

jobs:
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Le dossier du dépôt est MONTÉ dans le conteneur TruffleHog, .git
          # compris. Par défaut, checkout y laisse le GITHUB_TOKEN
          # (`http.https://github.com/.extraheader` dans .git/config, relevé
          # au nettoyage du job 108059432597) : l'image tierce le lisait avec
          # tout l'historique. Le scan ne parle jamais à GitHub, il lit des
          # objets git locaux : le jeton n'a rien à faire là.
          persist-credentials: false

      # Les trois classes de TruffleHog ne disent PAS la même chose :
      #   verified   — le détecteur a joint le fournisseur, la clé est VIVANTE ;
      #   unverified — le détecteur a joint le fournisseur, la clé est MORTE ;
      #   unknown    — la vérification n'a pas pu aboutir (réseau, quota, pas
      #                de vérificateur pour ce détecteur).
      # S'en tenir à `verified,unknown` laissait passer exactement une classe :
      # le secret confirmé mort. Or CLAUDE.md écrit « ne jamais commiter un
      # secret », sans exception pour les jetons révoqués — et pour cause : une
      # clé révoquée reste une identité publiée, souvent réutilisée ailleurs, et
      # sa présence signale l'habitude qui produira la suivante. La révocation
      # répare la fuite, elle n'efface pas le commit.
      #
      # Mesuré avant de durcir, sur un dépôt cobaye où un couple de clés AWS est
      # commité puis retiré de l'arbre (il reste dans l'historique), la
      # vérification aboutissant réellement :
      #   --results=verified,unknown             → code 0, AUCUN résultat ;
      #   --results=verified,unknown,unverified  → code 183, « Found unverified
      #                                            result », détecteur AWS.
      # Épinglé par SHA DE COMMIT, comme toute action tierce de ce dépôt — et
      # ici plus qu'ailleurs : ce workflow lit TOUT l'historique du dépôt
      # (fetch-depth: 0). Il a longtemps pointé `@main`, une branche mouvante :
      # chaque exécution faisait tourner le dernier commit d'un dépôt tiers,
      # quel qu'il soit. Un SHA est immuable ; .github/dependabot.yml propose
      # les montées de version en pull request, où le nouveau SHA se relit.
      #
      # L'ÉPINGLE DE L'ACTION NE SUFFISAIT PAS, et l'audit du 25/09 l'a montré.
      # L'action n'est qu'un script : il lance `docker run
      # ghcr.io/trufflesecurity/trufflehog:${version}`, et `version` vaut
      # `latest` par défaut (action.yml au SHA ci-dessous). Le journal du job
      # 108059432597 le dit sans détour : « Downloaded newer image for
      # …:latest », puis `"trufflehog_version": "3.97.9"`, sous une épingle
      # qui annonçait la 3.97.4. Le binaire qui lisait tout l'historique était
      # donc le dernier publié par un tiers, à chaque exécution : exactement
      # la porte que le paragraphe ci-dessus disait fermée.
      #
      # D'où `version: <tag>@sha256:<empreinte>` : l'action forme
      # `image:tag@digest`, que `docker run` résout par l'EMPREINTE (le tag
      # n'est plus qu'une étiquette lisible). Empreinte de l'index
      # multi-architecture de 3.97.9, relevée dans le registre le 25/09 :
      #   curl -sI -H "Authorization: Bearer <jeton anonyme>" \
      #     -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
      #     https://ghcr.io/v2/trufflesecurity/trufflehog/manifests/3.97.9
      # (en-tête docker-content-digest ; le jeton anonyme se demande à
      # https://ghcr.io/token?scope=repository:trufflesecurity/trufflehog:pull).
      #
      # DEPENDABOT NE VOIT PAS CETTE LIGNE : il suit les `uses:`, pas les
      # entrées d'une action. Cette épingle se monte À LA MAIN, en même temps
      # que celle de l'action, et SECURITY.md le rappelle.
      - name: TruffleHog (tout secret, même révoqué)
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          version: 3.97.9@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db
          extra_args: --results=verified,unknown,unverified

  dependencies:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Même raison qu'au job précédent : `pnpm install` exécute les
          # scripts d'installation de centaines de paquets tiers, et aucun n'a
          # besoin du jeton du dépôt.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Audit (vulnérabilités high et critical)
        run: pnpm audit --audit-level high
