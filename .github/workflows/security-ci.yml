name: security-ci

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # Chaque lundi à 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (secrets vérifiés)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

  dependencies:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Audit (vulnérabilités high et critical)
        run: pnpm audit --audit-level high
