# APK de démonstration : application complète SANS serveur (flavor `demo`).
# Publie l'APK sur la release `demo-latest` (une URL stable de téléchargement).
name: demo-apk

on:
  workflow_dispatch:
  push:
    branches: [claude/carlys-fitness-foundation-lqv2hl, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/demo-apk.yml'
      # Ce workflow est le SEUL de la CI à exécuter ces deux scripts.
      # android_branding.sh porte à lui seul le nom affiché, l'icône et la
      # permission de notification — android/ n'étant pas versionné, ce
      # script EST l'identité de l'application. Sans ces deux lignes, le
      # modifier ne déclenchait rien : la retouche restait sans preuve
      # jusqu'au prochain commit sous apps/mobile/, et personne ne voyait
      # qu'elle cassait le build.
      - 'scripts/android_branding.sh'
      - 'scripts/mobile_platforms.sh'

permissions:
  contents: write

concurrency:
  group: demo-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # Même source unique que mobile-ci et le poste de développement :
      # apps/mobile/.flutter-version — voir mobile-ci.yml pour l'incident
      # du « stable » flottant et le choix de l'étape shell.
      - name: Version Flutter épinglée
        id: pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      # Les paquets Dart et surtout les dépendances Gradle représentent
      # l'essentiel du temps d'un build à froid : on les garde d'une fois
      # sur l'autre, la clé suivant les fichiers de verrouillage.
      - name: Cache des paquets Dart
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-demo-apk
          restore-keys: gradle-${{ runner.os }}-

      # android/ n'est pas versionné : il se régénère à la demande.
      #
      # `flutter create` appelé nu écrasait pubspec.lock — il se termine par un
      # `pub get` implicite qui résout tout à neuf. L'étape `--enforce-lockfile`
      # qui suit validait donc le lock que create venait d'écrire, et n'enforçait
      # plus rien : 28 paquets déplacés par rapport au lock du dépôt plus un
      # ajouté, dont drift 2.34.3→2.34.4 et drift_dev 2.34.5→2.34.6 (le
      # générateur lancé deux étapes plus bas) et xml 6.6.1→7.0.1, un saut de
      # MAJEURE. L'APK publié n'était pas construit sur l'arbre éprouvé par
      # mobile-ci. mobile_platforms.sh crée les dossiers SANS toucher au lock
      # (mesuré : md5 identique avant/après) et retire le test du gabarit —
      # même script que le poste de développement, pour que les deux chemins
      # ne puissent plus diverger.
      - name: Dossiers de plateformes
        run: |
          ../../scripts/mobile_platforms.sh android
          # Identité Carlys : nom affiché, icône (sceau), permission de
          # notification — même script que le poste de développement.
          ../../scripts/android_branding.sh
          # Build Gradle parallèle et réutilisation du cache de tâches.
          {
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      # --enforce-lockfile : même règle que mobile-ci, le lock versionné
      # est contraignant — l'APK publié est construit sur l'arbre éprouvé.
      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      - name: Génération de code (Drift)
        run: dart run build_runner build

      # Garde-fou. `--enforce-lockfile` ne protège que de ce qui arrive AVANT
      # lui ; il n'a rien vu quand `flutter create` réécrivait le lock juste au-
      # dessus. Ce contrôle-ci ferme le trou par l'autre bout : si une étape
      # quelconque de ce job modifie un fichier VERSIONNÉ, le job échoue au lieu
      # de publier un APK construit sur autre chose que l'arbre du dépôt.
      #
      # Sans restriction de chemins, volontairement. Aujourd'hui `flutter create
      # --no-pub` ne touche qu'un seul fichier suivi (pubspec.lock, que
      # mobile_platforms.sh restaure), mais rien ne garantit que la prochaine
      # version du SDK s'en tiendra là : lister les chemins à surveiller, c'est
      # promettre de deviner à l'avance ce qu'un outil tiers ira écrire. Sans
      # chemin, `git diff` couvre tout le dépôt quel que soit le répertoire
      # courant — la portée dépasse donc apps/mobile, ce qui est voulu. Le
      # reste de ce que produit le job — android/, .dart_tool/, les .g.dart —
      # n'est pas versionné, donc invisible pour `git diff` : le contrôle est
      # large sans être bruyant. Vérifié dans les deux sens : code 0 sur un
      # arbre propre après la séquence création → branding → pub get →
      # build_runner, code 1 dès qu'un fichier suivi bouge.
      - name: Garde-fou — l'arbre versionné est intact
        run: |
          if ! git diff --exit-code; then
            echo "::error::une étape de ce job a modifié un fichier versionné :" \
              "l'APK ne serait pas construit sur l'arbre de dépendances éprouvé" \
              "par mobile-ci. Voir le diff ci-dessus."
            exit 1
          fi

      # `--target-platform android-arm64` : une seule architecture au lieu de
      # trois. Le moteur Flutter pèse plusieurs mégaoctets par architecture,
      # c'est de loin le premier poste de poids ET de durée de compilation.
      # Tous les téléphones Android vendus depuis 2019 sont en arm64.
      # `--split-debug-info` sort les symboles de l'APK ; `--obfuscate` les
      # remplace par des noms courts.
      #
      # CARLYS_PUBLIC_WEB_BASE_URL est passée EXPLICITEMENT, même en démo :
      # sans elle, la valeur par défaut du code (localhost:3001) part dans
      # l'APK par accident, et les deux liens légaux des réglages ne mènent
      # nulle part depuis un téléphone. Tant qu'aucune application web n'est
      # déployée, la variable de dépôt du même nom n'existe pas et le repli
      # vaut ce défaut : le choix est alors assumé, pas subi. Poser la
      # variable dans les réglages du dépôt suffira à le corriger.
      - name: Build APK (mode démo, hors ligne)
        run: |
          flutter build apk --release \
            --no-pub \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=CARLYS_FLAVOR=demo \
            --dart-define=CARLYS_API_BASE_URL=http://localhost:3000 \
            --dart-define=CARLYS_PUBLIC_WEB_BASE_URL=${{ vars.CARLYS_PUBLIC_WEB_BASE_URL || 'http://localhost:3001' }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/carlys-demo.apk
          ls -lh build/app/outputs/flutter-apk/carlys-demo.apk

      # Release pré-taguée « demo-latest », écrasée à chaque build :
      # une seule URL stable pour télécharger l'APK depuis un téléphone.
      - name: Publier sur la release demo-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create demo-latest \
            --prerelease \
            --title "Carlys — démo Android (sans serveur)" \
            --notes "APK de visite : données intégrées, aucun serveur requis. Installer puis ouvrir — la session est déjà connectée. Compilé pour arm64 (tous les téléphones récents)." \
            --target "$GITHUB_SHA" || true
          gh release upload demo-latest \
            build/app/outputs/flutter-apk/carlys-demo.apk --clobber
