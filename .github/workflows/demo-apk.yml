# APK de démonstration : application complète SANS serveur (flavor `demo`).
# Publie l'APK sur la release `demo-latest` (une URL stable de téléchargement).
name: demo-apk

on:
  workflow_dispatch:
  push:
    branches: [claude/carlys-fitness-foundation-lqv2hl, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/demo-apk.yml'

permissions:
  contents: write

concurrency:
  group: demo-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # Même source unique que mobile-ci et le poste de développement :
      # apps/mobile/.flutter-version — voir mobile-ci.yml pour l'incident
      # du « stable » flottant et le choix de l'étape shell.
      - name: Version Flutter épinglée
        id: pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      # Les paquets Dart et surtout les dépendances Gradle représentent
      # l'essentiel du temps d'un build à froid : on les garde d'une fois
      # sur l'autre, la clé suivant les fichiers de verrouillage.
      - name: Cache des paquets Dart
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-demo-apk
          restore-keys: gradle-${{ runner.os }}-

      # android/ n'est pas versionné : il se régénère à la demande.
      - name: Dossiers de plateformes
        run: |
          flutter create --org com.carlys --project-name carlys_mobile \
            --platforms android .
          # Identité Carlys : nom affiché, icône (sceau), permission de
          # notification — même script que le poste de développement.
          ../../scripts/android_branding.sh
          # Build Gradle parallèle et réutilisation du cache de tâches.
          {
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      # --enforce-lockfile : même règle que mobile-ci, le lock versionné
      # est contraignant — l'APK publié est construit sur l'arbre éprouvé.
      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      - name: Génération de code (Drift, …)
        run: dart run build_runner build

      # `--target-platform android-arm64` : une seule architecture au lieu de
      # trois. Le moteur Flutter pèse plusieurs mégaoctets par architecture,
      # c'est de loin le premier poste de poids ET de durée de compilation.
      # Tous les téléphones Android vendus depuis 2019 sont en arm64.
      # `--split-debug-info` sort les symboles de l'APK ; `--obfuscate` les
      # remplace par des noms courts.
      - name: Build APK (mode démo, hors ligne)
        run: |
          flutter build apk --release \
            --no-pub \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=CARLYS_FLAVOR=demo \
            --dart-define=CARLYS_API_BASE_URL=http://localhost:3000
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/carlys-demo.apk
          ls -lh build/app/outputs/flutter-apk/carlys-demo.apk

      # Release pré-taguée « demo-latest », écrasée à chaque build :
      # une seule URL stable pour télécharger l'APK depuis un téléphone.
      - name: Publier sur la release demo-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create demo-latest \
            --prerelease \
            --title "Carlys — démo Android (sans serveur)" \
            --notes "APK de visite : données intégrées, aucun serveur requis. Installer puis ouvrir — la session est déjà connectée. Compilé pour arm64 (tous les téléphones récents)." \
            --target "$GITHUB_SHA" || true
          gh release upload demo-latest \
            build/app/outputs/flutter-apk/carlys-demo.apk --clobber
