# Application mobile de RECETTE — l'artefact qui remplace l'APK de démonstration.
#
# Ce que ce workflow change par rapport à `demo-apk` qu'il remplace : la démo
# était une application SANS serveur (`CARLYS_FLAVOR=demo`, API sur
# `localhost:3000`), utile pour faire visiter l'interface, incapable de prouver
# quoi que ce soit du système réel. Ici l'application est bâtie en `staging` et
# vise le VRAI serveur de recette — les mêmes adresses que celles servies par
# `images-publish.yml` pour l'admin : `api-staging.DOMAINE` et
# `app-staging.DOMAINE`.
#
# Le mobile est donc désormais le MIROIR du serveur, pas un chemin parallèle :
#   - `mobile-recette` (ce fichier) suit le code sans rien faire, comme
#     `images-publish.yml` — poussée sur `development` ou `production` ;
#   - la mise en production, elle, se demande à la main et se confirme à la
#     main, comme `images-publish-prod.yml` puis `scripts/server/promote.sh`.
#
# ── Trois artefacts, trois usages qu'il ne faut JAMAIS confondre ──────────────
#
#   1. `.apk` arm64 — INSTALLABLE TOUT DE SUITE, par téléversement direct sur un
#      téléphone. Il est signé avec la clé de DEBUG et c'est sans conséquence :
#      Android accepte parfaitement un APK signé en debug installé hors magasin.
#      Aucun secret n'est requis pour le produire, il est donc TOUJOURS là.
#      C'est le livrable du jour, celui qui sert à éprouver la recette.
#
#   2. `.aab` — le format des MAGASINS, et lui seul. La Play Console REFUSE un
#      bundle signé en debug. Le dépôt ne versionne pas `android/`
#      (`bootstrap_mobile.sh` le régénère), donc aucun keystore ni aucune
#      `signingConfig` n'y survit : la clé ne peut venir que de secrets de
#      dépôt. Tant qu'ils n'existent pas, ce workflow NE PRODUIT PAS d'`.aab`
#      — plutôt rien qu'un binaire dont on ne découvrirait le vice qu'au
#      moment du dépôt sur le magasin. Le récapitulatif dit lequel des deux
#      cas s'applique et, le cas échéant, quels secrets créer.
#
#   3. `.ipa` — iOS, dans un SECOND JOB, sur un runner macOS, et SEULEMENT SI
#      ON LE DEMANDE (variable de dépôt CARLYS_IOS_BUILDS=oui, ou case
#      « ios » de Run workflow) : une minute macOS en coûte dix. Il n'existe
#      pas d'`.ipa` « signé en debug » qui s'installerait quand même — sans
#      certificat ni profil Apple, le job échoue au lieu de livrer du vide.
#
# ── AUCUNE POUSSÉE NE PUBLIE VERS UN MAGASIN ─────────────────────────────────
#
# Les téléversements (piste interne Play, TestFlight) n'ont lieu QUE sur une
# exécution manuelle avec la case « publier » cochée — jamais sur push, même
# quand tous les secrets existent. La présence d'un secret dit qu'on PEUT
# publier, pas qu'on VEUT : décider, c'est cliquer. Sans la case, les
# artefacts signés sont construits et archivés, prêts, et rien ne part.
#
# ── Le filet d'`assertUsable()` a lieu AU LANCEMENT, pas à la compilation ─────
#
# `apps/mobile/lib/app/environment/app_environment.dart` refuse de démarrer en
# `staging` si l'une des deux URL manque ou pointe en local. Ce contrôle-là est
# excellent, mais il ne s'exerce qu'à la première ouverture : un artefact
# produit ici se construit et se télécharge sans rien signaler. D'où la
# consigne répétée dans le récapitulatif — LANCEZ-LE UNE FOIS avant de le
# déposer où que ce soit.
name: mobile-recette

on:
  # « Une recette qui suit le code sans rien faire » : mêmes branches et mêmes
  # filtres `paths` que `demo-apk` qu'il remplace. Les deux scripts listés ne
  # sont exécutés par AUCUN autre workflow — `android_branding.sh` porte à lui
  # seul le nom affiché, l'icône et la permission de notification, et comme
  # `android/` n'est pas versionné, ce script EST l'identité de l'application.
  # Sans ces deux lignes, le modifier ne déclencherait rien et l'on ne verrait
  # qu'il casse le build qu'au prochain commit sous `apps/mobile/`.
  push:
    branches: [development, production]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-recette.yml'
      - 'scripts/android_branding.sh'
      - 'scripts/mobile_platforms.sh'
  # Rattrapage manuel, repris mot pour mot du motif d'`images-publish.yml` :
  # sans l'entrée `sha`, `workflow_dispatch` ne sait viser qu'une BRANCHE, donc
  # sa tête — jamais le commit du milieu d'une rafale, qui est précisément
  # celui que le `concurrency` ci-dessous a annulé.
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit à construire. Laisser VIDE pour la tête de la branche choisie
          ci-dessus — le cas courant. Renseigner un SHA (12 ou 40 caractères)
          pour rattraper un commit dont le build a été annulé ou perdu, par
          exemple celui qui tourne en recette côté serveur
          (/srv/carlys/staging/DEPLOYED).
        required: false
        type: string
      ios:
        description: >-
          Construire AUSSI l'application iOS (.ipa) sur un runner macOS, pour
          cette exécution seulement. Sans effet si la variable de dépôt
          CARLYS_IOS_BUILDS vaut déjà « oui » (elle l'active à chaque poussée).
        required: false
        type: boolean
        default: false
      publier:
        description: >-
          PUBLIER Carlys Staging Beta — déposer ce qui est construit : le
          bundle signé sur la piste interne Play, et l'.ipa sur TestFlight si
          le job iOS tourne (variable CARLYS_IOS_BUILDS ou case « ios »
          ci-dessus). Secrets requis, voir docs/deployment/builds-mobiles.md
          §4.6 et §10 — il en manque un, l'exécution échoue en ROUGE plutôt
          que de réussir sans rien déposer. Sans cette case, poussée comme
          exécution manuelle CONSTRUISENT sans rien publier.
        required: false
        type: boolean
        default: false

# `contents: read` AU NIVEAU DU WORKFLOW : les jobs de build publient via
# `actions/upload-artifact`, qui n'utilise pas le GITHUB_TOKEN. Un seul job
# élève ce droit, localement : `lien-beta`, qui entretient la release `beta`
# (contents: write posé sur LUI, pas ici) pour offrir un lien de
# téléchargement stable de l'APK. Le dépôt étant PRIVÉ, cette release n'est
# lisible que par les comptes ayant accès au dépôt — ce n'est pas une page
# ouverte à tous, et les binaires de recette visent un serveur réel.
permissions:
  contents: read

# `cancel-in-progress: true`, à REBOURS d'`images-publish.yml`, et la
# différence se justifie. Là-bas, une exécution annulée laisse un SHA SANS
# IMAGE dans le registre, trou qu'on ne découvre qu'au `deploy.sh <sha>` — au
# pire moment. Ici, RIEN ne va chercher l'artefact mobile par SHA : ni
# `deploy.sh`, ni `promote.sh`, personne. Ce qu'on installe, c'est la tête de
# la branche. Construire les commits intermédiaires d'une rafale coûterait
# vingt minutes de runner par commit que personne n'installera, et le besoin
# résiduel — reconstruire un commit précis — est exactement ce que l'entrée
# `sha` ci-dessus sert à couvrir.
#
# Une exécution « publier », elle, a son PROPRE groupe. Sans cela, une
# poussée ordinaire sur la même branche annulerait le clic d'un humain en
# plein vol — les téléversements sont les DERNIÈRES étapes de jobs de 40 et
# 60 minutes, l'annulation les emporterait presque toujours, et il ne
# resterait qu'une exécution « cancelled » que personne ne relit. Deux
# « publier » d'affilée, en revanche, s'annulent entre eux : c'est le même
# humain qui a changé d'avis, et le second porte un versionCode plus grand.
concurrency:
  group: mobile-recette-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.publier == true) && 'publier' || 'ci' }}
  cancel-in-progress: true

jobs:
  recette:
    name: Application de recette (Android)
    outputs:
      # Consommés par le job `lien-beta` : le nom de l'artefact porte sha12,
      # et le tag `beta` doit viser le commit RÉELLEMENT construit — sur un
      # rattrapage par « sha », github.sha serait la tête de branche, pas lui.
      sha12: ${{ steps.commit.outputs.sha12 }}
      sha40: ${{ steps.commit.outputs.sha40 }}
      # « oui » quand l'APK porte la clé du dépôt, donc quand il s'installe
      # par-dessus le précédent. Les notes de la release bêta le disent à qui
      # va le télécharger : c'est sur le téléphone, sinon, qu'on l'apprend.
      signature: ${{ steps.signature.outputs.actif }}
    runs-on: ubuntu-latest
    # 40 minutes plutôt que les 30 de `demo-apk` : deux builds Gradle au lieu
    # d'un quand la signature est configurée.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      # fetch-depth: 0 — l'action ne sait pas récupérer un SHA abrégé, et le
      # rattrapage manuel en accepte un de 12 caractères (c'est la longueur
      # qu'affichent DEPLOYED, deploy.sh et promote.sh). On rapatrie donc tout
      # l'historique, puis on résout nous-mêmes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Le commit RÉELLEMENT construit, jamais `github.sha` en aveugle : sur un
      # rattrapage les deux diffèrent, et étiqueter un artefact du SHA d'un
      # autre commit est pire que ne rien produire — on installerait du code
      # qu'on croit connaître.
      - name: Commit construit
        id: commit
        env:
          SHA_DEMANDE: ${{ inputs.sha }}
        run: |
          if [ -n "${SHA_DEMANDE:-}" ]; then
            if ! full="$(git rev-parse --verify --quiet "${SHA_DEMANDE}^{commit}")"; then
              echo "::error title=Commit inconnu::« ${SHA_DEMANDE} » n'est pas un commit de ce dépôt. Reprends le sha affiché par /srv/carlys/staging/DEPLOYED, ou celui de l'exécution d'images-publish qui a fabriqué les images de recette correspondantes."
              exit 1
            fi
            git checkout --detach "$full"
            echo "Rattrapage demandé sur $full"
          else
            full="${{ github.sha }}"
          fi
          echo "sha12=$(echo "$full" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "sha40=$full" >> "$GITHUB_OUTPUT"
          echo "Construction du commit $(echo "$full" | cut -c1-12) : $(git log -1 --format='%s')"

      # ── Les adresses visées par l'application ──────────────────────────────
      #
      # Présence ET forme, contrôle repris d'`images-publish.yml`. La valeur est
      # concaténée telle quelle derrière un schéma et un sous-domaine :
      # `https://api-staging.$CARLYS_DOMAIN`. Le réflexe de qui pose la variable
      # est de copier l'adresse du site, schéma compris — et « https://carlys.app »
      # donne alors littéralement « https://api-staging.https://carlys.app ».
      #
      # Ce que cette chaîne devient ici est pire que côté admin. Elle part dans
      # un `--dart-define`, donc elle est FIGÉE DANS LE BINAIRE : un APK déjà
      # installé sur un téléphone ne se corrige pas depuis les réglages du
      # dépôt, il se reconstruit et se réinstalle. Et `assertUsable()` ne
      # rattrapera rien : « https://api-staging.https://carlys.app » a bien un
      # schéma et un hôte non local, il passe le filet — l'application démarre,
      # puis chaque appel réseau échoue en silence. Le contrôle de forme est
      # donc le SEUL endroit où cette faute peut encore être arrêtée.
      #
      # Contrôle identique à celui d'images-publish.yml et d'images-publish-prod.yml,
      # mot pour mot : GitHub Actions ne partage rien entre deux workflows, la
      # duplication est le seul moyen de les garder alignés. Toute correction
      # ici doit être reportée là-bas, et réciproquement.
      - name: Adresses de recette dérivées de CARLYS_DOMAIN
        id: adresses
        env:
          CARLYS_DOMAIN: ${{ vars.CARLYS_DOMAIN }}
        run: |
          if [ -z "$CARLYS_DOMAIN" ]; then
            echo "::error title=Variable de dépôt CARLYS_DOMAIN absente::L'application mobile fige l'adresse du serveur dans le binaire (--dart-define, lu par app_environment.dart). Sans CARLYS_DOMAIN, il n'y a pas d'adresse de recette à viser et l'application refuserait de démarrer. Pose-la dans Settings → Secrets and variables → Actions → Variables, nom CARLYS_DOMAIN, valeur le domaine nu (exemple : carlys.app), puis relance ce workflow."
            exit 1
          fi

          domaine_bien_forme() {
            # Jeu de caractères d'abord : ce filtre écarte le schéma (« : » et
            # « / »), les espaces, un joker « * », un port, une adresse
            # complète — et il tient sur une valeur multiligne, qu'une
            # expression régulière ancrée ligne à ligne laisserait passer.
            case "$1" in
              ''|*[!A-Za-z0-9.-]*) return 1 ;;
            esac
            [ "${#1}" -le 253 ] || return 1
            # Puis la structure : au moins deux étiquettes, aucune vide, ni
            # commençant ni finissant par un tiret, 63 caractères au plus.
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
          }

          if ! domaine_bien_forme "$CARLYS_DOMAIN"; then
            echo "::error title=CARLYS_DOMAIN mal formée::La valeur « $CARLYS_DOMAIN » n'est pas un nom de domaine nu. Attendu : uniquement le domaine, sans schéma, sans barre oblique, sans port, sans sous-domaine — par exemple « carlys.app ». Ce qui est refusé et pourquoi : « https://carlys.app » produirait l'adresse https://api-staging.https://carlys.app, figée dans le binaire de l'application ; « carlys.app/ » et « carlys.app:443 » produiraient des variantes tout aussi mortes. Corrige la variable dans Settings → Secrets and variables → Actions → Variables, puis relance ce workflow."
            exit 1
          fi

          # Avertissement, pas refus : « api.exemple.fr » est un domaine
          # parfaitement valide, mais s'il est donné ICI il produit
          # api-staging.api.exemple.fr. C'est peut-être voulu — on le signale
          # sans bloquer.
          case "$CARLYS_DOMAIN" in
            api.*|app.*|media.*|api-staging.*|app-staging.*|media-staging.*)
              echo "::warning title=CARLYS_DOMAIN commence par un sous-domaine réservé::« $CARLYS_DOMAIN » commence par un des six préfixes que ce dépôt ajoute lui-même. L'application visera https://api-staging.$CARLYS_DOMAIN. Si ce n'est pas ce que tu veux, mets le domaine nu."
              ;;
          esac

          echo "api=https://api-staging.$CARLYS_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "web=https://app-staging.$CARLYS_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "API visée   : https://api-staging.$CARLYS_DOMAIN"
          echo "Web visé    : https://app-staging.$CARLYS_DOMAIN"

      # Même source unique que mobile-ci et le poste de développement :
      # apps/mobile/.flutter-version — voir mobile-ci.yml pour l'incident du
      # « stable » flottant et le choix de l'étape shell. Lu APRÈS le
      # `checkout --detach` ci-dessus, pour que le SDK soit celui du commit
      # construit et non celui de la tête de branche.
      - name: Version Flutter épinglée
        id: pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      # Les paquets Dart et surtout les dépendances Gradle représentent
      # l'essentiel du temps d'un build à froid : on les garde d'une fois sur
      # l'autre, la clé suivant les fichiers de verrouillage.
      - name: Cache des paquets Dart
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-mobile-recette
          restore-keys: gradle-${{ runner.os }}-

      # android/ n'est pas versionné : il se régénère à la demande.
      #
      # `flutter create` appelé nu écrase pubspec.lock — il se termine par un
      # `pub get` implicite qui résout tout à neuf, et l'étape
      # `--enforce-lockfile` qui suit ne validerait plus que le lock que
      # `create` vient d'écrire. L'artefact publié ne serait pas construit sur
      # l'arbre éprouvé par mobile-ci. `mobile_platforms.sh` crée les dossiers
      # SANS toucher au lock et retire le test du gabarit — même script que le
      # poste de développement, pour que les deux chemins ne divergent pas.
      - name: Dossiers de plateformes
        run: |
          ../../scripts/mobile_platforms.sh android
          # Identité Carlys : nom affiché, icône (sceau), permission de
          # notification — même script que le poste de développement.
          ../../scripts/android_branding.sh
          # Build Gradle parallèle et réutilisation du cache de tâches.
          # `daemon=false` importe ici plus qu'ailleurs : la configuration de
          # signature plus bas est lue dans l'ENVIRONNEMENT du processus
          # Gradle, et un démon survivant d'une invocation à l'autre brouille
          # cette lecture.
          {
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      # --enforce-lockfile : même règle que mobile-ci, le lock versionné est
      # contraignant — l'artefact publié est construit sur l'arbre éprouvé.
      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      - name: Génération de code (Drift)
        run: dart run build_runner build

      # Garde-fou. `--enforce-lockfile` ne protège que de ce qui arrive AVANT
      # lui. Ce contrôle-ci ferme le trou par l'autre bout : si une étape
      # quelconque de ce job modifie un fichier VERSIONNÉ, le job échoue au lieu
      # de livrer un binaire construit sur autre chose que l'arbre du dépôt.
      #
      # Sans restriction de chemins, volontairement : lister les chemins à
      # surveiller, c'est promettre de deviner à l'avance ce qu'un outil tiers
      # ira écrire. `git diff` couvre tout le dépôt quel que soit le répertoire
      # courant — la portée dépasse donc apps/mobile, ce qui est voulu. Le reste
      # de ce que produit le job — android/, .dart_tool/, les .g.dart — n'est
      # pas versionné, donc invisible pour `git diff` : le contrôle est large
      # sans être bruyant.
      #
      # Placé AVANT toute retouche de signature, qui écrit dans android/ : ce
      # dossier n'étant pas suivi, la retouche resterait invisible ici, mais
      # l'ordre garde la lecture évidente — ce qui est vérifié, c'est l'arbre
      # tel que le dépôt le décrit.
      - name: Garde-fou — l'arbre versionné est intact
        run: |
          if ! git diff --exit-code; then
            echo "::error::une étape de ce job a modifié un fichier versionné :" \
              "l'application ne serait pas construite sur l'arbre de dépendances" \
              "éprouvé par mobile-ci. Voir le diff ci-dessus."
            exit 1
          fi

      # ── 1. La signature — AVANT les builds, car elle conditionne les DEUX ──
      #
      # POURQUOI CE BLOC EST ICI ET PLUS APRÈS L'APK. Sans keystore, Gradle
      # signe la release avec une clé de DEBUG qu'il engendre lui-même. Or
      # `android/` n'est pas versionné : `mobile_platforms.sh` le régénère à
      # chaque exécution, donc cette clé est NEUVE à chaque build. Android
      # refuse alors la mise à jour d'une installation par un APK signé
      # autrement — « App not installed as package conflicts with an existing
      # package » —, et il faut désinstaller pour réinstaller, en perdant les
      # données locales. Constaté le 12 septembre 2026 en essayant de mettre à
      # jour la bêta. Le bloc est donc joué avant l'APK : quand les secrets
      # existent, l'APK du lien bêta porte LA MÊME clé d'une exécution à
      # l'autre et se met à jour normalement. C'est l'ordre que
      # mobile-production.yml suivait déjà.
      #
      # Quatre secrets, ENSEMBLE ou pas du tout — même règle que les quatre
      # valeurs Firebase d'app_environment.dart, et pour la même raison : une
      # configuration à moitié posée produit un artefact qui a l'air correct et
      # ne l'est pas. À créer dans Settings → Secrets and variables → Actions →
      # Secrets :
      #
      #   ANDROID_KEYSTORE_BASE64    le keystore (.jks), encodé en base64
      #                              (`base64 -w0 carlys-release.jks`)
      #   ANDROID_KEYSTORE_PASSWORD  mot de passe du keystore
      #   ANDROID_KEY_ALIAS          alias de la clé dans ce keystore
      #   ANDROID_KEY_PASSWORD       mot de passe de la clé
      #
      # Le keystore lui-même ne doit JAMAIS entrer dans le dépôt : le perdre
      # signifie ne plus jamais pouvoir mettre à jour l'application publiée, le
      # divulguer signifie que n'importe qui peut en publier une contrefaçon.
      #
      # SECRETS DE DÉPÔT, et c'est un choix qui a un revers. Un secret de dépôt
      # est lisible par TOUTES les exécutions du dépôt ; un secret d'ENVIRONNEMENT
      # protégé n'est lisible que par le job qui réclame cet environnement, donc
      # qui passe par l'approbation humaine. La clé de production a sa place
      # dans le second cas, pas ici : un build de recette ne doit pas s'arrêter
      # pour demander un OUI. La conséquence pratique se dit franchement : la
      # Play Console impose la MÊME clé de téléversement à toutes les pistes
      # d'une application, piste interne comprise. Si vous n'avez qu'une clé et
      # que vous la voulez gardée derrière l'approbation de production, ne
      # posez PAS ces quatre secrets au niveau du dépôt — ce workflow livrera
      # alors l'APK seul, signé en debug, donc NON MIS À JOUR d'une exécution à
      # l'autre (voir l'en-tête de ce bloc).
      #
      # Aucune valeur n'est affichée nulle part : pas de `set -x`, pas d'`echo`
      # d'une variable de secret. Seule leur PRÉSENCE est journalisée.
      - name: Secrets de signature Android
        id: signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier == true }}
        run: |
          manquants=""
          [ -n "$KEYSTORE_B64" ]      || manquants="$manquants ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || manquants="$manquants ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || manquants="$manquants ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || manquants="$manquants ANDROID_KEY_PASSWORD"

          if [ -z "$manquants" ]; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
            echo "Les quatre secrets de signature sont présents : l'APK ET le bundle"
            echo "porteront cette clé — donc l'APK du lien bêta se met à jour en place."
            exit 0
          fi

          # La case « publier » demandait un dépôt : ne rien pouvoir déposer
          # est alors un ÉCHEC, pas un avertissement — un « publier » qui
          # réussit sans rien publier serait un mensonge de statut.
          if [ "$PUBLIER" = "true" ]; then
            echo "::error title=Publication demandée, signature impossible::La case « publier » demandait un dépôt sur la piste interne Play, mais il manque le(s) secret(s) de signature :$manquants. Sans keystore, aucun .aab ne peut être produit, donc rien ne peut partir. Poser les quatre secrets (docs/deployment/builds-mobiles.md §4), puis relancer avec la case publier."
            exit 1
          fi

          echo "actif=non" >> "$GITHUB_OUTPUT"
          echo "manquants=$manquants" >> "$GITHUB_OUTPUT"
          # Avertissement et non échec : l'APK est livré quand même, il reste
          # installable. Produire un .aab signé en debug serait pire que n'en
          # produire aucun — la Play Console le refuserait, mais seulement au
          # dépôt, après coup.
          #
          # L'avertissement dit maintenant les DEUX conséquences. La seconde
          # est celle qu'on découvrait sur le téléphone, jamais ici : un APK
          # signé par une clé de debug régénérée à chaque exécution est, pour
          # Android, une application DIFFÉRENTE à chaque fois.
          echo "::warning title=Signature absente — bundle non produit et APK non mettable à jour::Secret(s) manquant(s) :$manquants. Deux conséquences. (1) Aucun .aab : signé en debug, la Play Console le refuserait. (2) L'APK est signé avec une clé de debug REGÉNÉRÉE à chaque exécution — Android refusera d'installer cette version par-dessus la précédente (« package conflicts with an existing package ») et il faudra désinstaller d'abord, en perdant les données locales. Poser les quatre secrets (docs/deployment/builds-mobiles.md §4) règle les deux."

      # Le keystore est écrit dans RUNNER_TEMP, hors de l'arbre du dépôt, et
      # disparaît avec le runner. `keytool -list` échoue si la base64 est
      # tronquée, si le mot de passe est faux ou si l'alias n'existe pas : les
      # quatre secrets sont donc éprouvés ICI, en deux secondes, plutôt que
      # découverts à la fin d'un build Gradle de quinze minutes. Sa sortie est
      # jetée — elle ne contient aucun secret, mais on n'en journalise pas plus
      # que nécessaire.
      - name: Déballage et vérification du keystore
        if: steps.signature.outputs.actif == 'oui'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/carlys-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore" 2>/dev/null || {
            echo "::error title=ANDROID_KEYSTORE_BASE64 illisible::La valeur n'est pas du base64 valide. Régénère-la avec « base64 -w0 carlys-release.jks » (sans retour à la ligne) et recolle-la entière dans le secret."
            exit 1
          }
          # `base64 -d` accepte une entrée TRONQUÉE sans broncher (mesuré : une
          # base64 coupée en deux se décode en un fichier partiel, code 0). Le
          # contrôle ci-dessous est donc le seul à voir ce cas-là, et son
          # message nomme les trois causes possibles plutôt que la plus
          # évidente : un collage incomplet du secret est au moins aussi
          # fréquent qu'un mot de passe faux.
          if ! keytool -list -keystore "$keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore illisible — mot de passe ou alias invalide::Le keystore déballé n'a pas pu être ouvert. Trois causes possibles, dans l'ordre de fréquence : (1) ANDROID_KEYSTORE_BASE64 a été collé INCOMPLET — une base64 tronquée se décode sans erreur en un fichier inutilisable, régénère-la avec « base64 -w0 carlys-release.jks » et recolle-la entière ; (2) ANDROID_KEYSTORE_PASSWORD ne correspond pas ; (3) ANDROID_KEY_ALIAS n'existe pas dans ce keystore. Vérifie sur ton poste : « keytool -list -keystore carlys-release.jks -alias <alias> ». Aucun mot de passe n'est affiché ici."
            exit 1
          fi
          echo "Keystore valide, alias trouvé."

      # ── Brancher la clé sur Gradle, sans dépendre du gabarit ───────────────
      #
      # `flutter create` engendre un `buildTypes { release { signingConfig =
      # signingConfigs.getByName("debug") } }`. On n'y touche PAS par
      # remplacement de texte : le gabarit change d'une version de SDK à
      # l'autre, et une expression qui ne trouve plus son ancre échouerait en
      # silence — on livrerait alors le bundle signé en debug que tout ce
      # workflow existe pour éviter.
      #
      # On AJOUTE donc un second bloc `android { }` à la fin du script. Gradle
      # exécute le fichier de haut en bas : la dernière affectation de
      # `signingConfig` gagne, quelle que soit la rédaction du bloc précédent.
      # Aucune ancre, donc rien à casser.
      #
      # Les mots de passe sont lus dans l'ENVIRONNEMENT du processus Gradle :
      # ils ne transitent ni par la ligne de commande (visible dans la liste des
      # processus) ni par un `gradle.properties` écrit sur disque.
      #
      # Les deux syntaxes sont couvertes. Flutter 3.44 engendre du Kotlin DSL
      # (`build.gradle.kts`) ; les gabarits antérieurs engendraient du Groovy.
      # Écrire les deux coûte quinze lignes et évite qu'une montée de SDK ne
      # transforme cette étape en no-op silencieux — c'est justement le piège
      # qu'on refuse deux paragraphes plus haut.
      - name: Configuration de signature (Gradle)
        if: steps.signature.outputs.actif == 'oui'
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'KOTLIN'

          // Ajouté par .github/workflows/mobile-recette.yml — signature de
          // release. Ce bloc est évalué APRÈS celui du gabarit : c'est lui qui
          // fixe la signature finale. Les quatre valeurs viennent de
          // l'environnement, jamais du dépôt.
          android {
              signingConfigs {
                  create("carlysRelease") {
                      storeFile = file(System.getenv("CARLYS_KEYSTORE"))
                      storePassword = System.getenv("CARLYS_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CARLYS_KEY_ALIAS")
                      keyPassword = System.getenv("CARLYS_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("carlysRelease")
                  }
              }
          }
          KOTLIN
          elif [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'GROOVY'

          // Ajouté par .github/workflows/mobile-recette.yml — voir le
          // commentaire de la variante Kotlin DSL.
          android {
              signingConfigs {
                  carlysRelease {
                      storeFile file(System.getenv('CARLYS_KEYSTORE'))
                      storePassword System.getenv('CARLYS_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('CARLYS_KEY_ALIAS')
                      keyPassword System.getenv('CARLYS_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.carlysRelease
                  }
              }
          }
          GROOVY
          else
            echo "::error title=Script Gradle introuvable::Ni android/app/build.gradle.kts ni android/app/build.gradle n'existe après scripts/mobile_platforms.sh. Le bundle ne peut pas être signé, et en produire un non signé n'aurait aucun intérêt."
            exit 1
          fi
          echo "Signature de release branchée sur le keystore fourni."

      # ── 2. L'APK, le livrable du jour ──────────────────────────────────────
      #
      # Construit SANS CONDITION : il ne doit jamais être la victime
      # collatérale d'une signature mal configurée — secrets absents, il sort
      # quand même, simplement signé en debug.
      #
      # Sa SIGNATURE, elle, dépend du bloc ci-dessus. Avec les secrets, la clé
      # du dépôt : l'APK d'aujourd'hui s'installe par-dessus celui d'hier, les
      # données locales restent. Sans les secrets, une clé de debug neuve à
      # chaque exécution : chaque APK est une application différente pour
      # Android, et la mise à jour est refusée. Les variables CARLYS_* ne sont
      # lues que par le bloc `signingConfigs` ajouté plus haut, absent quand la
      # signature ne l'est pas — les passer inconditionnellement est donc sans
      # effet dans ce cas.
      #
      # `--target-platform android-arm64` : une seule architecture au lieu de
      # trois. Le moteur Flutter pèse plusieurs mégaoctets par architecture,
      # c'est de loin le premier poste de poids ET de durée de compilation.
      # Tous les téléphones Android vendus depuis 2019 sont en arm64.
      #
      # `--obfuscate` sans `--split-debug-info` rendrait les traces d'exécution
      # illisibles : les symboles sont donc extraits et livrés AVEC l'artefact,
      # dans le même dossier. Un plantage de recette reste ainsi déchiffrable.
      # `--build-number` = numéro d'exécution de CE workflow (la production,
      # elle, compte à part : son défaut est décalé de +100000 pour rester
      # au-dessus de ce que la recette dépose) :
      # la piste interne Play REFUSE un versionCode déjà téléversé, et le
      # `+1` de pubspec.yaml ne bouge jamais tout seul. Le numéro d'exécution
      # est monotone par construction. L'APK le porte aussi, pour que les deux
      # artefacts d'une même exécution racontent la même version.
      - name: Build APK (recette, arm64)
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          API: ${{ steps.adresses.outputs.api }}
          WEB: ${{ steps.adresses.outputs.web }}
          CARLYS_KEYSTORE: ${{ runner.temp }}/carlys-release.jks
          CARLYS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARLYS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARLYS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNATURE: ${{ steps.signature.outputs.actif }}
          NUMERO: ${{ github.run_number }}
        run: |
          flutter build apk --release \
            --no-pub \
            --build-number="$NUMERO" \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symboles-apk \
            --dart-define=CARLYS_FLAVOR=staging \
            --dart-define=CARLYS_API_BASE_URL="$API" \
            --dart-define=CARLYS_PUBLIC_WEB_BASE_URL="$WEB"

          mkdir -p build/livraison/apk
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/livraison/apk/carlys-recette-$SHA12.apk"
          mv build/symboles-apk build/livraison/apk/symboles

          if [ "$SIGNATURE" = "oui" ]; then
            ETAT_SIGNATURE="clé du dépôt — s'installe PAR-DESSUS la version précédente,
                                        données locales conservées."
          else
            ETAT_SIGNATURE="clé de debug, régénérée à CHAQUE exécution — Android refuse
                                        de l'installer par-dessus la version précédente
                                        (« package conflicts with an existing package »).
                                        Désinstaller d'abord, et perdre les données locales."
          fi
          # Le récapitulatif de l'exécution finit par disparaître ; l'archive
          # téléchargée, non. Elle dit donc elle-même ce qu'elle vise.
          cat > build/livraison/apk/LISEZ-MOI.txt <<FIN
          Carlys — application de RECETTE (Android, arm64)
          commit                      : $SHA12
          CARLYS_FLAVOR               : staging
          CARLYS_API_BASE_URL         : $API
          CARLYS_PUBLIC_WEB_BASE_URL  : $WEB

          Installation : téléverser le .apk sur le téléphone et l'ouvrir
          (autoriser les sources inconnues).

          Signature                   : $ETAT_SIGNATURE

          LANCEZ-LE UNE FOIS avant de le distribuer : le contrôle des adresses
          (assertUsable) a lieu au démarrage, pas à la compilation.

          symboles/ : à conserver pour déchiffrer les traces d'exécution,
          le binaire étant obscurci (--obfuscate).
          FIN
          ls -lh "build/livraison/apk/carlys-recette-$SHA12.apk"

      - name: Artefact — APK installable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlys-recette-apk-${{ steps.commit.outputs.sha12 }}
          # Chemin depuis la RACINE du dépôt : `defaults.run.working-directory`
          # ne s'applique qu'aux étapes `run`, jamais aux actions.
          path: apps/mobile/build/livraison/apk
          if-no-files-found: error

      # `flutter build appbundle` sans `--target-platform` : un bundle contient
      # toutes les architectures, c'est le magasin qui découpe par appareil au
      # téléchargement. C'est la différence de fond avec l'APK arm64 ci-dessus.
      #
      # Le versionCode est `--build-number=$NUMERO`, le numéro d'exécution de
      # CE workflow — la Play Console refuse deux dépôts au même versionCode,
      # et le `+1` de pubspec.yaml ne bouge jamais tout seul. mobile-production
      # compte de son côté : son défaut est décalé de +100000 précisément pour
      # rester au-dessus de tout ce que la recette aura déposé ici. Le
      # versionName visible en magasin, lui, reste le `version:` de
      # pubspec.yaml (0.1.0 tant qu'on ne le monte pas) : la CI ne passe
      # jamais --build-name, une version marketing se décide par un commit.
      - name: Build App Bundle (recette, signé)
        if: steps.signature.outputs.actif == 'oui'
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          API: ${{ steps.adresses.outputs.api }}
          WEB: ${{ steps.adresses.outputs.web }}
          CARLYS_KEYSTORE: ${{ runner.temp }}/carlys-release.jks
          CARLYS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARLYS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARLYS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NUMERO: ${{ github.run_number }}
        run: |
          flutter build appbundle --release \
            --no-pub \
            --build-number="$NUMERO" \
            --obfuscate \
            --split-debug-info=build/symboles-aab \
            --dart-define=CARLYS_FLAVOR=staging \
            --dart-define=CARLYS_API_BASE_URL="$API" \
            --dart-define=CARLYS_PUBLIC_WEB_BASE_URL="$WEB"

          mkdir -p build/livraison/aab
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/livraison/aab/carlys-recette-$SHA12.aab"
          mv build/symboles-aab build/livraison/aab/symboles
          cat > build/livraison/aab/LISEZ-MOI.txt <<FIN
          Carlys — bundle de RECETTE (Android App Bundle, toutes architectures)
          commit                      : $SHA12
          CARLYS_FLAVOR               : staging
          CARLYS_API_BASE_URL         : $API
          CARLYS_PUBLIC_WEB_BASE_URL  : $WEB

          Destiné aux MAGASINS uniquement (piste interne Play, Galaxy Store).
          Un .aab ne s'installe pas sur un téléphone : pour cela, prendre
          l'artefact .apk de la même exécution.

          Signé avec le keystore des secrets de dépôt. versionCode = $NUMERO
          (numéro d'exécution du workflow, jamais deux fois le même) : la Play
          Console refuse deux dépôts au même numéro.

          LANCEZ L'APPLICATION UNE FOIS avant de la déposer : le contrôle des
          adresses (assertUsable) a lieu au démarrage, pas à la compilation.

          symboles/ : à téléverser sur le magasin (ou à conserver) pour
          déchiffrer les traces d'exécution, le binaire étant obscurci.
          FIN
          ls -lh "build/livraison/aab/carlys-recette-$SHA12.aab"

      - name: Artefact — bundle de magasin
        if: steps.signature.outputs.actif == 'oui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlys-recette-aab-${{ steps.commit.outputs.sha12 }}
          path: apps/mobile/build/livraison/aab
          if-no-files-found: error

      # ── 3. La piste interne Play, sur la case « publier » seulement ────────
      #
      # UN SEUL secret, facultatif : PLAY_SERVICE_ACCOUNT_JSON — le JSON d'un
      # compte de service Google Cloud invité dans la Play Console avec le droit
      # « Publier sur les pistes de test ». Absent, le bundle reste un artefact
      # à déposer à la main, et le récapitulatif le dit. Présent, il ne SUFFIT
      # pas : le dépôt n'a lieu que sur une exécution manuelle avec la case
      # « publier » — un push ne publie jamais, voir l'en-tête du fichier.
      #
      # Une action tierce, et c'est assumé : l'API Google Play Developer exige
      # un jeton OAuth signé par la clé du compte de service, puis une session
      # d'édition en trois appels. L'écrire en curl et openssl tiendrait en une
      # centaine de lignes fragiles ; r0adkll/upload-google-play est l'action
      # de référence pour ce geste, épinglée par SHA de commit — elle reçoit
      # le JSON du compte de service en clair, un tag mutable ne suffit pas.
      - name: Compte de service Play
        id: play
        if: steps.signature.outputs.actif == 'oui'
        env:
          COMPTE: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier == true }}
        run: |
          if [ -n "$COMPTE" ]; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
            # L'identifiant d'application vient du projet engendré, jamais
            # d'une constante ici : android/ n'est pas versionné, c'est
            # mobile_platforms.sh qui fait foi.
            id="$(grep -oE 'applicationId *= *"[^"]+"' android/app/build.gradle.kts 2>/dev/null | head -1 | sed 's/.*"\([^"]*\)"/\1/')"
            [ -n "$id" ] || id="$(grep -oE "applicationId +['\"][^'\"]+['\"]" android/app/build.gradle 2>/dev/null | head -1 | sed "s/.*['\"]\([^'\"]*\)['\"]/\1/")"
            [ -n "$id" ] || { echo "::error title=applicationId introuvable::Impossible de lire l'identifiant d'application dans android/app/build.gradle(.kts) — le téléversement Play ne sait pas quelle fiche viser."; exit 1; }
            echo "package=$id" >> "$GITHUB_OUTPUT"
            if [ "$PUBLIER" = "true" ]; then
              echo "Piste interne Play : téléversement demandé (case publier) pour $id."
            else
              echo "Secrets Play en place pour $id — pas de téléversement : la case « publier » n'est pas cochée."
            fi
          else
            # Même principe que la signature : « publier » sans le compte de
            # service est un échec dit en rouge, pas un vert qui n'a rien fait.
            if [ "$PUBLIER" = "true" ]; then
              echo "::error title=Publication demandée, compte de service Play absent::La case « publier » demandait un dépôt sur la piste interne, mais PLAY_SERVICE_ACCOUNT_JSON n'existe pas. Poser ce secret (docs/deployment/builds-mobiles.md §4.6), ou déposer à la main l'artefact .aab de cette exécution."
              exit 1
            fi
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON absent : le bundle reste un artefact à déposer à la main."
          fi

      - name: Téléversement — piste interne Play
        if: >-
          steps.play.outputs.actif == 'oui' &&
          github.event_name == 'workflow_dispatch' && inputs.publier == true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.play.outputs.package }}
          releaseFiles: apps/mobile/build/livraison/aab/carlys-recette-${{ steps.commit.outputs.sha12 }}.aab
          track: internal
          status: completed

      - name: Récapitulatif
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          API: ${{ steps.adresses.outputs.api }}
          WEB: ${{ steps.adresses.outputs.web }}
          SIGNATURE: ${{ steps.signature.outputs.actif }}
          MANQUANTS: ${{ steps.signature.outputs.manquants }}
          NUMERO: ${{ github.run_number }}
          PLAY: ${{ steps.play.outputs.actif }}
          PAQUET: ${{ steps.play.outputs.package }}
          PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier == true }}
        run: |
          # La version marketing (versionName) vient du pubspec : la CI ne
          # passe jamais --build-name, ce que verront les magasins est cette
          # ligne-là — le récapitulatif doit la montrer.
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          {
            echo "## Application de recette — commit \`$SHA12\`"
            echo
            echo "| Variable de build | Valeur |"
            echo "| ----------------- | ------ |"
            echo "| \`CARLYS_FLAVOR\` | \`staging\` |"
            echo "| \`CARLYS_API_BASE_URL\` | \`$API\` |"
            echo "| \`CARLYS_PUBLIC_WEB_BASE_URL\` | \`$WEB\` |"
            echo "| version (pubspec) | \`$VERSION\` |"
            echo "| versionCode | \`$NUMERO\` |"
            echo
            echo "### Artefacts"
            echo
            echo "**\`carlys-recette-apk-$SHA12\`** — l'application, **installable tout de suite**."
            echo "Téléverser le \`.apk\` sur le téléphone et l'ouvrir (autoriser les sources"
            echo "inconnues). Compilé pour arm64 : tous les téléphones vendus depuis 2019."
            if [ "$SIGNATURE" = "oui" ]; then
              echo "Signé avec **la clé du dépôt** : il s'installe par-dessus la version"
              echo "précédente, les données locales sont conservées."
            else
              echo "Signé avec une **clé de debug régénérée à chaque exécution** : Android le"
              echo "voit comme une autre application et REFUSE de l'installer par-dessus la"
              echo "version précédente. Il faut désinstaller d'abord, en perdant les données"
              echo "locales de l'appareil. Poser les quatre secrets de signature y met fin."
            fi
            echo "Contient aussi \`symboles/\`, à garder pour déchiffrer les traces"
            echo "d'exécution."
            echo
            if [ "$SIGNATURE" = "oui" ]; then
              echo "**\`carlys-recette-aab-$SHA12\`** — le bundle pour les **magasins**"
              echo "(piste interne Play, Galaxy Store), signé avec le keystore des secrets de"
              echo "dépôt, toutes architectures, versionCode \`$NUMERO\`. Un \`.aab\` ne"
              echo "s'installe pas sur un téléphone."
              if [ "$PLAY" = "oui" ] && [ "$PUBLIER" = "true" ]; then
                echo
                echo "**Téléversé sur la piste interne Play** (\`$PAQUET\`) : les testeurs"
                echo "inscrits sur cette piste le reçoivent via le Play Store."
              elif [ "$PLAY" = "oui" ]; then
                echo
                echo "**Prêt pour la piste interne, non téléversé** : rien ne part vers un"
                echo "magasin sans la case **publier**. Pour déposer ce build : Actions →"
                echo "mobile-recette → Run workflow → cocher \`publier\`."
              else
                echo
                echo "Non téléversé sur Play : poser le secret \`PLAY_SERVICE_ACCOUNT_JSON\`"
                echo "(compte de service invité dans la Play Console), puis relancer avec la"
                echo "case \`publier\` — le dépôt sur la piste interne n'a jamais lieu sur"
                echo "une simple poussée."
              fi
            else
              echo "**Aucun bundle \`.aab\`** — et c'est délibéré."
              echo
              echo "Secret(s) de signature absent(s) :"
              for secret in $MANQUANTS; do echo "- \`$secret\`"; done
              echo
              echo "Un \`.aab\` signé avec la clé de debug est refusé par la Play Console, et"
              echo "on ne le découvrirait qu'au dépôt. Mieux vaut ne rien produire. Pour"
              echo "l'obtenir : créer un keystore (\`keytool -genkeypair -v -keystore"
              echo "carlys-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias carlys\`),"
              echo "le ranger **hors du dépôt** et le sauvegarder — le perdre interdit toute"
              echo "mise à jour de l'application publiée —, puis poser les quatre secrets dans"
              echo "Settings → Secrets and variables → Actions → Secrets :"
              echo "\`ANDROID_KEYSTORE_BASE64\` (\`base64 -w0 carlys-release.jks\`),"
              echo "\`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\`, \`ANDROID_KEY_PASSWORD\`."
              echo
              echo "L'APK ci-dessus, lui, n'a besoin d'aucun secret : il est là quoi qu'il arrive."
            fi
            echo
            echo "### Avant de déposer quoi que ce soit"
            echo
            echo "> **Lancez l'application une fois.** Le contrôle des adresses"
            echo "> (\`assertUsable()\`) a lieu **au démarrage, pas à la compilation** : un"
            echo "> artefact construit sur une mauvaise adresse se produit et se télécharge"
            echo "> sans que rien ne le signale. Ouvrez-le, vérifiez qu'il atteint"
            echo "> \`$API\`, et seulement ensuite distribuez-le."
            echo
            echo "Le serveur de recette correspondant se déploie avec le même commit :"
            echo
            echo '```bash'
            echo "sudo /srv/carlys/repo/scripts/server/deploy.sh staging $SHA12"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # LE KEYSTORE NE SURVIT PAS AU JOB, quoi qu'il arrive.
      #
      # `if: always()` et non un simple pas final : sans lui, le fichier reste
      # en place dès que le build échoue — c'est-à-dire précisément quand on
      # relance plusieurs fois de suite. Sur un runner HÉBERGÉ, la machine est
      # détruite avec le job et l'exposition serait de toute façon brève ; sur
      # un runner AUTO-HÉBERGÉ, elle ne l'est pas, et le fichier resterait sur
      # un disque partagé entre toutes les exécutions du dépôt. On ne veut pas
      # que la sûreté de la clé de signature dépende du type de runner choisi
      # un jour par quelqu'un d'autre.
      #
      # `shred` d'abord quand il existe (il écrase avant de délier), `rm -f`
      # ensuite dans tous les cas : l'étape ne doit jamais échouer elle-même,
      # sans quoi elle masquerait la vraie cause de l'échec du job.
      - name: Effacer le keystore
        if: always()
        run: |
          keystore="$RUNNER_TEMP/carlys-release.jks"
          if [ -f "$keystore" ]; then
            command -v shred >/dev/null 2>&1 && shred -u "$keystore" 2>/dev/null || true
            rm -f "$keystore"
            echo "Keystore effacé."
          else
            echo "Aucun keystore à effacer (signature inactive ou étape jamais atteinte)."
          fi

  # ── Le lien bêta permanent : la release « beta » suit le dernier APK ────────
  #
  # L'artefact d'exécution exige de naviguer jusqu'à la bonne exécution, en
  # étant connecté, puis de décompresser un zip : impraticable à envoyer à un
  # testeur. Ce job entretient donc une RELEASE au tag mouvant `beta` — même
  # geste que l'ancienne `demo-latest` — dont l'unique APK garde un nom
  # stable. Le lien ne change jamais :
  #
  #   https://github.com/<dépôt>/releases/download/beta/carlys-beta.apk
  #
  # LIMITE À CONNAÎTRE : sur un dépôt privé, ce lien n'est servi qu'aux
  # comptes GitHub ayant accès au dépôt. Pour un testeur extérieur : la piste
  # interne Play, ou transmettre le fichier soi-même (builds-mobiles.md §3.4).
  #
  # Seule la tête de `development` alimente le lien : la branche production a
  # ses propres artefacts, et un rattrapage `sha` d'un vieux commit sur
  # development écrase sciemment — le récapitulatif de l'exécution fait foi.
  #
  # C'est LE SEUL job du workflow avec un droit d'écriture, et il ne s'en
  # sert que pour la release et son tag. Il n'a même pas besoin de checkout.
  lien-beta:
    name: Lien bêta (release « beta »)
    needs: recette
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Téléchargement DANS la même exécution : aucun jeton supplémentaire,
      # l'artefact vient du job `recette` ci-dessus.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: carlys-recette-apk-${{ needs.recette.outputs.sha12 }}
          path: livraison

      - name: Mettre à jour la release beta
        env:
          GH_TOKEN: ${{ github.token }}
          SHA12: ${{ needs.recette.outputs.sha12 }}
          NUMERO: ${{ github.run_number }}
          DEPOT: ${{ github.repository }}
          SHA_COMPLET: ${{ needs.recette.outputs.sha40 }}
          SIGNATURE: ${{ needs.recette.outputs.signature }}
        run: |
          set -euo pipefail
          cp "livraison/carlys-recette-$SHA12.apk" carlys-beta.apk

          # Ce que les notes disent de la MISE À JOUR dépend de la clé qui a
          # signé cet APK. L'écrire ici évite que la question se pose sur le
          # téléphone, au moment où Android refuse l'installation sans
          # expliquer pourquoi.
          if [ "$SIGNATURE" = "oui" ]; then
            signature_notes="**Mise à jour** : installez par-dessus la version précédente, vos données
          locales sont conservées — tous les APK de ce lien portent la même clé de
          signature."
          else
            signature_notes="**Mise à jour impossible sans désinstaller.** Cet APK est signé avec une clé
          de debug que la CI régénère à chaque exécution : pour Android, chaque version
          est une application différente, et l'installation par-dessus la précédente
          échoue sur « package conflicts with an existing package ». Désinstallez
          Carlys, puis installez — les données locales de l'appareil sont perdues.
          Pour que cela cesse : poser les quatre secrets de signature du dépôt
          (docs/deployment/builds-mobiles.md §4)."
          fi

          notes="Dernière bêta Android (recette, \`staging\`) — commit \`$SHA12\`, versionCode \`$NUMERO\`.

          **Installer** : télécharger \`carlys-beta.apk\` ci-dessous, l'ouvrir sur le
          téléphone, autoriser les sources inconnues.

          $signature_notes

          **Lien stable** (comptes ayant accès à ce dépôt) :
          https://github.com/$DEPOT/releases/download/beta/carlys-beta.apk

          Lancez-la une fois avant de la faire circuler : le contrôle des adresses
          a lieu au démarrage, pas à la compilation. Les symboles de débogage sont
          dans l'artefact de l'exécution, pas ici."

          if gh release view beta --repo "$DEPOT" >/dev/null 2>&1; then
            # PAS de `upload --clobber` : il SUPPRIME l'ancien asset avant de
            # téléverser le nouveau — pendant tout le téléversement (et pour
            # toujours, s'il échoue ou si l'exécution est annulée), le lien
            # stable rendrait 404. Ordre inverse, fenêtre réduite à deux
            # appels d'API : téléverser sous un nom provisoire pendant que
            # l'ancien continue d'être servi, puis supprimer l'ancien, puis
            # renommer le nouveau. Un échec en plein milieu laisse au pire un
            # provisoire orphelin, que le début de ce bloc ramasse.
            ids() { gh api "repos/$DEPOT/releases/tags/beta" \
              --jq ".assets[] | select(.name==\"$1\") | .id"; }
            for reste in $(ids carlys-beta-nouveau.apk); do
              gh api -X DELETE "repos/$DEPOT/releases/assets/$reste"
            done
            cp carlys-beta.apk carlys-beta-nouveau.apk
            gh release upload beta carlys-beta-nouveau.apk --repo "$DEPOT"
            for ancien in $(ids carlys-beta.apk); do
              gh api -X DELETE "repos/$DEPOT/releases/assets/$ancien"
            done
            nouveau="$(ids carlys-beta-nouveau.apk)"
            gh api -X PATCH "repos/$DEPOT/releases/assets/$nouveau" \
              -f name=carlys-beta.apk > /dev/null
            gh release edit beta --title "Carlys bêta — $SHA12" --notes "$notes" \
              --prerelease --repo "$DEPOT"
          else
            # `--target` n'est honoré que si le tag n'existe pas encore ; s'il
            # traîne (release supprimée à la main, tag conservé), c'est le
            # PATCH ci-dessous qui le remet sur le bon commit.
            gh release create beta carlys-beta.apk --prerelease \
              --title "Carlys bêta — $SHA12" --notes "$notes" \
              --target "$SHA_COMPLET" --repo "$DEPOT"
          fi
          # Le tag suit TOUJOURS le commit réellement construit — après
          # `create` comme après une mise à jour, y compris quand le tag
          # préexistait à la release (cas où `--target` est ignoré).
          gh api -X PATCH "repos/$DEPOT/git/refs/tags/beta" \
            -f sha="$SHA_COMPLET" -F force=true > /dev/null
          echo "Release beta mise à jour : $SHA12 (versionCode $NUMERO)."

  # ── iOS : le même geste, sur le seul runner qui sache le faire ───────────────
  #
  # OPT-IN, jamais par défaut, et le coût est toute la raison : sur un dépôt
  # privé, une minute de runner macOS est facturée DIX fois une minute Linux.
  # Un build iOS à chaque poussée sous apps/mobile/ n'est pas neutre — il se
  # décide, de deux façons :
  #   - la variable de dépôt CARLYS_IOS_BUILDS=oui (Settings → Secrets and
  #     variables → Actions → Variables) : à chaque poussée, comme l'APK ;
  #   - la case « ios » de Run workflow : pour cette exécution seulement.
  #
  # Contrairement à l'APK, il n'existe PAS d'.ipa « signé en debug » qui
  # s'installerait quand même : sans certificat de distribution ni profil de
  # provisionnement, rien ne s'installe nulle part, ni sur un téléphone ni sur
  # TestFlight. Ce job EXIGE donc ses trois secrets et ÉCHOUE sans eux — un
  # job qu'on a demandé et qui ne livre rien doit le dire en rouge, pas en
  # gris. L'échec donne l'identifiant de bundle à enregistrer chez Apple :
  # c'est la première chose dont on a besoin, et l'exécution est le seul
  # endroit qui le sache de source sûre (`ios/` n'est pas versionné).
  #
  # Le téléversement vers TestFlight, lui, est facultatif — trois secrets de
  # plus. Sans eux, l'.ipa est un artefact à déposer avec Transporter.
  #
  # Les étapes communes (commit construit, adresses, SDK, dépendances,
  # garde-fou) sont recopiées du job Android MOT POUR MOT : GitHub Actions ne
  # partage rien entre deux jobs, et les commentaires qui les justifient sont
  # là-haut. Toute correction ici se reporte là-bas, et réciproquement.
  ios:
    name: Application de recette (iOS)
    # La case « publier » ne suffit PAS à lancer ce job : sans compte Apple,
    # une publication Android-seule doit pouvoir finir verte. Publier l'.ipa
    # se demande donc explicitement — variable ou case « ios » — EN PLUS de
    # la case « publier ».
    if: vars.CARLYS_IOS_BUILDS == 'oui' || inputs.ios == true
    runs-on: macos-latest
    # Le double de l'Android : l'archive Xcode d'une application Flutter avec
    # Firebase compile une trentaine de pods à froid.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Commit construit
        id: commit
        env:
          SHA_DEMANDE: ${{ inputs.sha }}
        run: |
          if [ -n "${SHA_DEMANDE:-}" ]; then
            if ! full="$(git rev-parse --verify --quiet "${SHA_DEMANDE}^{commit}")"; then
              echo "::error title=Commit inconnu::« ${SHA_DEMANDE} » n'est pas un commit de ce dépôt. Reprends le sha affiché par /srv/carlys/staging/DEPLOYED, ou celui de l'exécution d'images-publish qui a fabriqué les images de recette correspondantes."
              exit 1
            fi
            git checkout --detach "$full"
            echo "Rattrapage demandé sur $full"
          else
            full="${{ github.sha }}"
          fi
          echo "sha12=$(echo "$full" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "sha40=$full" >> "$GITHUB_OUTPUT"
          echo "Construction du commit $(echo "$full" | cut -c1-12) : $(git log -1 --format='%s')"

      # Copie mot pour mot de l'étape du job Android — voir son commentaire.
      - name: Adresses de recette dérivées de CARLYS_DOMAIN
        id: adresses
        env:
          CARLYS_DOMAIN: ${{ vars.CARLYS_DOMAIN }}
        run: |
          if [ -z "$CARLYS_DOMAIN" ]; then
            echo "::error title=Variable de dépôt CARLYS_DOMAIN absente::L'application mobile fige l'adresse du serveur dans le binaire (--dart-define, lu par app_environment.dart). Sans CARLYS_DOMAIN, il n'y a pas d'adresse de recette à viser et l'application refuserait de démarrer. Pose-la dans Settings → Secrets and variables → Actions → Variables, nom CARLYS_DOMAIN, valeur le domaine nu (exemple : carlys.app), puis relance ce workflow."
            exit 1
          fi

          domaine_bien_forme() {
            case "$1" in
              ''|*[!A-Za-z0-9.-]*) return 1 ;;
            esac
            [ "${#1}" -le 253 ] || return 1
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
          }

          if ! domaine_bien_forme "$CARLYS_DOMAIN"; then
            echo "::error title=CARLYS_DOMAIN mal formée::La valeur « $CARLYS_DOMAIN » n'est pas un nom de domaine nu. Attendu : uniquement le domaine, sans schéma, sans barre oblique, sans port, sans sous-domaine — par exemple « carlys.app ». Ce qui est refusé et pourquoi : « https://carlys.app » produirait l'adresse https://api-staging.https://carlys.app, figée dans le binaire de l'application ; « carlys.app/ » et « carlys.app:443 » produiraient des variantes tout aussi mortes. Corrige la variable dans Settings → Secrets and variables → Actions → Variables, puis relance ce workflow."
            exit 1
          fi

          case "$CARLYS_DOMAIN" in
            api.*|app.*|media.*|api-staging.*|app-staging.*|media-staging.*)
              echo "::warning title=CARLYS_DOMAIN commence par un sous-domaine réservé::« $CARLYS_DOMAIN » commence par un des six préfixes que ce dépôt ajoute lui-même. L'application visera https://api-staging.$CARLYS_DOMAIN. Si ce n'est pas ce que tu veux, mets le domaine nu."
              ;;
          esac

          echo "api=https://api-staging.$CARLYS_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "web=https://app-staging.$CARLYS_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "API visée   : https://api-staging.$CARLYS_DOMAIN"
          echo "Web visé    : https://app-staging.$CARLYS_DOMAIN"

      - name: Version Flutter épinglée
        id: pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Cache des paquets Dart
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Le cache de TÉLÉCHARGEMENT de CocoaPods, pas le dossier Pods/ : ce
      # dernier vit sous ios/, qui est régénéré à chaque exécution. Les SDK
      # Firebase pèsent plusieurs centaines de mégaoctets — c'est le premier
      # poste de durée d'un build iOS à froid, et chaque minute ici en vaut dix.
      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      # « android,ios » et non « ios » seul : android_branding.sh exige le
      # manifeste Android pour tourner, et c'est LUI qui porte aussi l'identité
      # iOS (nom affiché, motif d'usage de la caméra dans Info.plist). Le
      # dossier android/ engendré ici n'est jamais compilé.
      - name: Dossiers de plateformes
        run: |
          ../../scripts/mobile_platforms.sh android,ios
          ../../scripts/android_branding.sh

      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      - name: Génération de code (Drift)
        run: dart run build_runner build

      - name: Garde-fou — l'arbre versionné est intact
        run: |
          if ! git diff --exit-code; then
            echo "::error::une étape de ce job a modifié un fichier versionné :" \
              "l'application ne serait pas construite sur l'arbre de dépendances" \
              "éprouvé par mobile-ci. Voir le diff ci-dessus."
            exit 1
          fi

      # ── L'identifiant de bundle, LU dans le projet engendré ────────────────
      #
      # `flutter create --org com.carlys --project-name carlys_mobile` décide
      # de l'identifiant, et il n'est pas le même sur les deux plateformes :
      # Android reçoit le nom tel quel (com.carlys.carlys_mobile), iOS le
      # reçoit en camelCase (com.carlys.carlysMobile). On le LIT plutôt que de
      # le recopier ici, et on l'affiche AVANT tout contrôle de secret : c'est
      # l'App ID à enregistrer chez Apple, la toute première chose dont on a
      # besoin — et l'échec « secrets absents » plus bas le cite.
      - name: Identifiant de bundle
        id: bundle
        run: |
          ids="$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \([^;]*\);.*/\1/p' ios/Runner.xcodeproj/project.pbxproj \
                 | tr -d '"' | grep -v '\.RunnerTests$' | sort -u)"
          if [ "$(printf '%s\n' "$ids" | grep -c .)" -ne 1 ]; then
            echo "::error title=Identifiant de bundle introuvable::ios/Runner.xcodeproj/project.pbxproj ne porte pas exactement un PRODUCT_BUNDLE_IDENTIFIER hors tests (trouvé : ${ids:-rien}). Le gabarit de flutter create a changé ; adapte l'étape « Identifiant de bundle » de ce workflow."
            exit 1
          fi
          echo "id=$ids" >> "$GITHUB_OUTPUT"
          echo "Identifiant de bundle iOS : $ids"

      # ── Trois secrets, ENSEMBLE ou ÉCHEC ───────────────────────────────────
      #
      # À créer dans Settings → Secrets and variables → Actions → Secrets :
      #
      #   IOS_DISTRIBUTION_P12_BASE64       le certificat « Apple Distribution »
      #                                     ET sa clé privée, exportés de
      #                                     Trousseaux d'accès en .p12, en base64
      #                                     (`base64 -i carlys.p12 | tr -d '\n'`)
      #   IOS_DISTRIBUTION_P12_PASSWORD     le mot de passe donné à l'export
      #   IOS_PROVISIONING_PROFILE_BASE64   le profil App Store (.mobileprovision)
      #                                     du bundle ci-dessus, en base64
      #
      # Pas d'APPLE_TEAM_ID à saisir : le profil le porte, on l'y lit. Moins un
      # secret, moins une faute de frappe possible.
      #
      # ÉCHEC et non avertissement, à rebours du bundle Android : là-bas
      # l'APK est déjà livré et se suffit ; ici il n'y a rien d'autre. Aucune
      # valeur n'est affichée nulle part, seule leur PRÉSENCE est journalisée.
      - name: Secrets de signature iOS
        env:
          P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFIL_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
        run: |
          manquants=""
          [ -n "$P12_B64" ]      || manquants="$manquants IOS_DISTRIBUTION_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || manquants="$manquants IOS_DISTRIBUTION_P12_PASSWORD"
          [ -n "$PROFIL_B64" ]   || manquants="$manquants IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$manquants" ]; then
            echo "::error title=Signature iOS impossible — secret(s) absent(s) :$manquants::Un .ipa ne s'installe nulle part sans certificat de distribution ni profil : rien n'est produit. Marche à suivre (docs/deployment/builds-mobiles.md, section iOS) : (1) chez Apple, enregistrer l'App ID « $BUNDLE » et créer un certificat Apple Distribution puis un profil de provisionnement App Store pour cet App ID ; (2) exporter certificat + clé privée en .p12 depuis Trousseaux d'accès ; (3) poser les trois secrets IOS_DISTRIBUTION_P12_BASE64, IOS_DISTRIBUTION_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64. Pour ne plus lancer ce job d'ici là : retirer la variable CARLYS_IOS_BUILDS (ou la mettre à « non »)."
            exit 1
          fi
          echo "Les trois secrets de signature iOS sont présents."

      # ── Trousseau temporaire, certificat, chaîne de confiance ──────────────
      #
      # Le geste est celui de la documentation GitHub « Installing an Apple
      # certificate on macOS runners » : un trousseau CRÉÉ POUR CE JOB, hors du
      # trousseau de session, détruit par la dernière étape quoi qu'il arrive.
      # Son mot de passe est tiré au sort, il ne sert qu'ici.
      #
      # `find-identity -v` ne liste que les identités VALIDES : non expirées ET
      # dont la chaîne remonte à Apple. Si le .p12 a été exporté sans le
      # certificat intermédiaire WWDR, l'identité est là mais invalide, et
      # codesign échouerait vingt minutes plus tard avec « unable to build
      # chain ». On importe alors les intermédiaires publiés par Apple et on
      # revérifie — seulement dans ce cas, pour ne pas dépendre d'apple.com
      # quand le .p12 se suffit.
      - name: Trousseau temporaire et certificat de distribution
        id: trousseau
        env:
          P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          trousseau="$RUNNER_TEMP/carlys-signature.keychain-db"
          p12="$RUNNER_TEMP/carlys-distribution.p12"
          mdp="$(openssl rand -hex 24)"

          printf '%s' "$P12_B64" | base64 -d > "$p12" 2>/dev/null || {
            echo "::error title=IOS_DISTRIBUTION_P12_BASE64 illisible::La valeur n'est pas du base64 valide. Régénère-la avec « base64 -i carlys.p12 | tr -d '\n' » et recolle-la entière dans le secret."
            exit 1
          }

          security create-keychain -p "$mdp" "$trousseau"
          security set-keychain-settings -lut 21600 "$trousseau"
          security unlock-keychain -p "$mdp" "$trousseau"
          if ! security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$trousseau" >/dev/null 2>&1; then
            echo "::error title=Certificat illisible ou mot de passe invalide::Le .p12 déballé n'a pas pu être importé. Deux causes : (1) IOS_DISTRIBUTION_P12_BASE64 a été collé INCOMPLET — une base64 tronquée se décode sans erreur en un fichier inutilisable, régénère-la et recolle-la entière ; (2) IOS_DISTRIBUTION_P12_PASSWORD n'est pas le mot de passe donné à l'export. Vérifie sur ton Mac : « security import carlys.p12 -P '<mot de passe>' -k ~/Library/Keychains/login.keychain-db »."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$mdp" "$trousseau" >/dev/null
          security list-keychains -d user -s "$trousseau"

          # sed -E : le sed de macOS (BSD) ignore l'alternance « \| » en
          # expression basique. Rend « <empreinte SHA-1> <nom complet> » par
          # identité de distribution VALIDE.
          identites() {
            security find-identity -v -p codesigning "$trousseau" \
              | sed -En 's/^ *[0-9]+\) ([0-9A-F]+) "((Apple|iPhone) Distribution[^"]*)"$/\1 \2/p'
          }
          if [ -z "$(identites)" ]; then
            echo "Aucune identité de distribution valide ; import des intermédiaires WWDR d'Apple…"
            for g in G2 G3 G4 G5 G6 G7 G8; do
              if curl -fsSL "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer" -o "$RUNNER_TEMP/wwdr-$g.cer"; then
                security import "$RUNNER_TEMP/wwdr-$g.cer" -k "$trousseau" -t cert >/dev/null 2>&1 || true
              else
                echo "::warning title=Intermédiaire WWDR $g non téléchargé::apple.com n'a pas répondu ; si la chaîne du certificat reste incomplète, l'échec ci-dessous le dira."
              fi
            done
          fi
          if [ -z "$(identites)" ]; then
            # Sans -v, find-identity suffixe chaque identité INVALIDE de sa
            # raison — (CSSMERR_TP_CERT_EXPIRED), (CSSMERR_TP_NOT_TRUSTED) —
            # après la citation fermante : c'est exactement ce qu'il faut
            # montrer, donc pas d'ancre de fin. sort -u : la commande liste
            # deux fois les identités valides (« Matching » puis « Valid »).
            echo "::error title=Aucun certificat de DISTRIBUTION valide::Le .p12 importé ne contient aucune identité « Apple Distribution » (ou « iPhone Distribution ») valide. Trois causes : (1) c'est un certificat de DÉVELOPPEMENT (« Apple Development ») — il ne peut signer ni pour TestFlight ni pour l'App Store, crée un certificat Apple Distribution sur developer.apple.com ; (2) il est EXPIRÉ (un an de validité) — renouvelle-le, puis régénère le profil de provisionnement, qui l'embarque ; (3) le .p12 ne contient que le certificat sans sa clé privée — exporte depuis Trousseaux d'accès en sélectionnant la ligne qui se DÉPLIE sur une clé privée. Identités présentes : $(security find-identity -p codesigning "$trousseau" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\([^"]*\)"\(.*\)$/« \1 »\2/p' | sort -u | tr '\n' ' ')"
            exit 1
          fi
          # Laquelle signera se décide à l'étape suivante, contre le profil :
          # un .p12 peut porter deux certificats de distribution valides
          # (l'ancien et le renouvelé), et seul le profil sait lequel est bon.
          echo "Identité(s) de distribution valide(s) :"
          identites | sed 's/^/  /'

      # ── Le profil : App Store, ce bundle, ce certificat, pas expiré ─────────
      #
      # Quatre vérifications AVANT le build, chacune avec le message que
      # xcodebuild ne donnerait pas. Un profil Ad Hoc ou Development se
      # reconnaît à sa liste d'appareils (ProvisionedDevices), un profil
      # Enterprise à ProvisionsAllDevices ; un profil App Store n'a ni l'un ni
      # l'autre. L'un des certificats embarqués dans le profil doit être une
      # identité importée : un profil régénéré pour un nouveau certificat, ou
      # l'inverse, est l'erreur la plus fréquente de toute la signature iOS,
      # et xcodebuild la rapporte par « no profile matching ». L'identité
      # ainsi trouvée est CELLE qui signera, désignée par son empreinte SHA-1
      # — « Apple Distribution » seul serait ambigu s'il y en a deux.
      #
      # Le préfixe de l'App ID est ApplicationIdentifierPrefix, pas toujours
      # égal au Team ID sur les comptes Apple anciens ; on compare avec le
      # premier et on signe avec le second.
      #
      # Deux dossiers d'installation : Xcode 16 lit
      # ~/Library/Developer/Xcode/UserData/Provisioning Profiles, les versions
      # antérieures ~/Library/MobileDevice/Provisioning Profiles. Une copie
      # dans chacun coûte quatre kilooctets et ne dépend pas de l'image du
      # runner.
      - name: Profil de provisionnement
        id: profil
        env:
          PROFIL_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
        run: |
          profil="$RUNNER_TEMP/carlys.mobileprovision"
          plist="$RUNNER_TEMP/carlys-profil.plist"
          printf '%s' "$PROFIL_B64" | base64 -d > "$profil" 2>/dev/null || {
            echo "::error title=IOS_PROVISIONING_PROFILE_BASE64 illisible::La valeur n'est pas du base64 valide. Régénère-la avec « base64 -i Carlys.mobileprovision | tr -d '\n' » et recolle-la entière."
            exit 1
          }
          if ! security cms -D -i "$profil" > "$plist" 2>/dev/null; then
            echo "::error title=Profil de provisionnement illisible::Le fichier déballé n'est pas un .mobileprovision signé par Apple — base64 tronquée, ou mauvais fichier. Télécharge-le à nouveau depuis developer.apple.com → Profiles, puis « base64 -i <fichier> | tr -d '\n' »."
            exit 1
          fi
          lire() { plutil -extract "$1" raw -o - "$plist" 2>/dev/null || true; }
          uuid="$(lire UUID)"; nom="$(lire Name)"; equipe="$(lire TeamIdentifier.0)"
          appid="$(lire Entitlements.application-identifier)"; expire="$(lire ExpirationDate)"
          if [ -z "$uuid" ] || [ -z "$nom" ] || [ -z "$equipe" ] || [ -z "$appid" ]; then
            echo "::error title=Profil incomplet::Le profil ne porte pas UUID, Name, TeamIdentifier et application-identifier à la fois — ce n'est pas un profil iOS. Retélécharge-le depuis developer.apple.com → Profiles."
            exit 1
          fi

          if plutil -extract ProvisionedDevices raw -o - "$plist" >/dev/null 2>&1; then
            echo "::error title=Profil Ad Hoc ou Development — pas App Store::« $nom » porte une liste d'appareils : c'est un profil Ad Hoc ou Development, que TestFlight refuse et que l'export App Store Connect ne saurait produire. Crée sur developer.apple.com → Profiles un profil de type Distribution → App Store Connect pour l'App ID « $BUNDLE »."
            exit 1
          fi
          if [ "$(lire ProvisionsAllDevices)" = "true" ]; then
            echo "::error title=Profil Enterprise — pas App Store::« $nom » est un profil de distribution en entreprise (ProvisionsAllDevices). TestFlight le refuse. Crée un profil Distribution → App Store Connect."
            exit 1
          fi
          prefixe="$(lire ApplicationIdentifierPrefix.0)"; [ -n "$prefixe" ] || prefixe="$equipe"
          case "$appid" in
            "$prefixe.$BUNDLE"|"$prefixe.*") ;;
            *)
              echo "::error title=Le profil ne vise pas cette application::« $nom » est fait pour l'App ID « ${appid#"$prefixe".} » ; l'application engendrée par flutter create s'appelle « $BUNDLE ». Enregistre cet App ID exact chez Apple (Identifiers), crée-lui un profil App Store Connect, et remplace le secret IOS_PROVISIONING_PROFILE_BASE64."
              exit 1 ;;
          esac
          # plutil rend les dates en ISO 8601 UTC ; si la forme n'était pas
          # celle-là, mieux vaut le dire que comparer deux chaînes au hasard.
          case "$expire" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T*)
              maintenant="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if [[ "$expire" < "$maintenant" ]]; then
                echo "::error title=Profil expiré::« $nom » a expiré le $expire. Régénère-le sur developer.apple.com → Profiles (un profil vaut un an) et remplace le secret."
                exit 1
              fi ;;
            '') ;;
            *) echo "::warning title=Expiration du profil non vérifiée::plutil a rendu « $expire » pour ExpirationDate, qui n'est pas de la forme AAAA-MM-JJTHH:MM:SSZ attendue. Si l'archive échoue sur un profil expiré, c'est ici qu'il fallait le voir." ;;
          esac

          # Les empreintes SHA-1 des certificats embarqués (plutil raw rend
          # une donnée en base64), puis la première identité importée qui en
          # fait partie.
          empreintes_profil=""; i=0
          while cert="$(plutil -extract "DeveloperCertificates.$i" raw -o - "$plist" 2>/dev/null)" && [ -n "$cert" ]; do
            e="$(printf '%s' "$cert" | tr -d '\n' | base64 -d | openssl x509 -inform DER -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
            empreintes_profil="$empreintes_profil $e"
            i=$((i + 1))
          done
          identites() {
            security find-identity -v -p codesigning "$RUNNER_TEMP/carlys-signature.keychain-db" \
              | sed -En 's/^ *[0-9]+\) ([0-9A-F]+) "((Apple|iPhone) Distribution[^"]*)"$/\1 \2/p'
          }
          empreinte=""
          for e in $(identites | cut -d' ' -f1); do
            case " $empreintes_profil " in
              *" $e "*) empreinte="$e"; break ;;
            esac
          done
          if [ -z "$empreinte" ]; then
            echo "::error title=Le profil n'embarque aucun des certificats importés::« $nom » a été engendré pour un autre certificat que ceux du .p12 — empreintes du profil :$empreintes_profil ; identités importées : $(identites | cut -d' ' -f1 | tr '\n' ' '). C'est l'erreur la plus fréquente : un certificat renouvelé sans régénérer le profil, ou l'inverse. Sur developer.apple.com → Profiles, ouvre le profil, coche le certificat Apple Distribution en cours, régénère, télécharge, remplace IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi
          identite="$(identites | sed -n "s/^$empreinte //p")"

          for dossier in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                         "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dossier"
            cp "$profil" "$dossier/$uuid.mobileprovision"
          done
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "nom=$nom" >> "$GITHUB_OUTPUT"
          echo "equipe=$equipe" >> "$GITHUB_OUTPUT"
          echo "empreinte=$empreinte" >> "$GITHUB_OUTPUT"
          echo "identite=$identite" >> "$GITHUB_OUTPUT"
          echo "Profil « $nom » (équipe $equipe) : App Store, $BUNDLE${expire:+, expire le $expire}."
          echo "Signera : $identite (empreinte $empreinte)."

      # ── Brancher la signature sur Xcode, sans toucher au projet ────────────
      #
      # L'équivalent iOS du second bloc `android { }` : on n'édite PAS
      # project.pbxproj (une expression sur ce format opaque échouerait en
      # silence à la prochaine version du gabarit). On AJOUTE à
      # ios/Flutter/Release.xcconfig, que le gabarit fait lire à la
      # configuration Release de la cible Runner, et qui prime sur les réglages
      # du projet — dont le « iPhone Developer » qu'il y inscrit. Manuel, et
      # pas automatique : le runner n'a pas de session Apple ID, Xcode n'a
      # donc rien à « gérer ».
      #
      # Le certificat est désigné par son EMPREINTE SHA-1, que CODE_SIGN_IDENTITY
      # et `signingCertificate` acceptent l'un et l'autre : un nom (« Apple
      # Distribution ») est un sélecteur qui prend le plus récent, et le plus
      # récent n'est pas forcément celui que le profil embarque.
      #
      # ExportOptions.plist dit à l'export ce que le xcconfig a dit à
      # l'archive : même équipe, même certificat, même profil, méthode
      # App Store Connect. `manageAppVersionAndBuildNumber` à false : c'est
      # NOUS qui posons le numéro de build (--build-number), Xcode ne doit
      # pas le réécrire dans son coin.
      #
      # ITSAppUsesNonExemptEncryption = false est une DÉCLARATION, pas un
      # réglage : l'application ne chiffre rien elle-même, elle parle HTTPS,
      # ce qui est exempt. Sans cette ligne, chaque build téléversé attend
      # dans App Store Connect qu'un humain réponde « Missing Compliance ».
      - name: Signature manuelle (xcconfig, ExportOptions.plist, Info.plist)
        env:
          EQUIPE: ${{ steps.profil.outputs.equipe }}
          PROFIL_NOM: ${{ steps.profil.outputs.nom }}
          EMPREINTE: ${{ steps.profil.outputs.empreinte }}
          IDENTITE: ${{ steps.profil.outputs.identite }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
        run: |
          cat >> ios/Flutter/Release.xcconfig <<FIN

          // Ajouté par .github/workflows/mobile-recette.yml — signature de
          // distribution, manuelle. Le certificat est dans le trousseau
          // temporaire du job, le profil dans le dossier des profils.
          // Certificat : $IDENTITE
          DEVELOPMENT_TEAM = $EQUIPE
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = $EMPREINTE
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = $EMPREINTE
          PROVISIONING_PROFILE_SPECIFIER = $PROFIL_NOM
          FIN

          cat > ios/ExportOptions.plist <<FIN
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$EQUIPE</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$EMPREINTE</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE</key><string>$PROFIL_NOM</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          FIN
          plutil -lint ios/ExportOptions.plist

          plutil -replace ITSAppUsesNonExemptEncryption -bool false ios/Runner/Info.plist
          echo "Signature branchée : équipe $EQUIPE, « $IDENTITE » ($EMPREINTE), profil « $PROFIL_NOM »."

      # `flutter build ipa` archive (xcodebuild -archive) puis exporte
      # (xcodebuild -exportArchive) avec le plist ci-dessus. Mêmes
      # --dart-define, même --build-number et même --obfuscate que l'APK : les
      # trois artefacts d'une exécution racontent la même version. Pour
      # TestFlight le numéro de build (CFBundleVersion) doit croître d'un
      # téléversement à l'autre — le numéro d'exécution s'en charge.
      - name: Build IPA (recette, App Store Connect)
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          API: ${{ steps.adresses.outputs.api }}
          WEB: ${{ steps.adresses.outputs.web }}
          NUMERO: ${{ github.run_number }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
        run: |
          flutter build ipa --release \
            --no-pub \
            --build-number="$NUMERO" \
            --obfuscate \
            --split-debug-info=build/symboles-ipa \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=CARLYS_FLAVOR=staging \
            --dart-define=CARLYS_API_BASE_URL="$API" \
            --dart-define=CARLYS_PUBLIC_WEB_BASE_URL="$WEB"

          set -- build/ios/ipa/*.ipa
          if [ ! -f "$1" ]; then
            echo "::error title=Aucun .ipa exporté::flutter build ipa s'est terminé sans écrire build/ios/ipa/*.ipa. Lire le journal de xcodebuild ci-dessus — l'export (ExportOptions.plist) est l'étape la plus probable."
            exit 1
          fi
          mkdir -p build/livraison/ipa
          mv "$1" "build/livraison/ipa/carlys-recette-$SHA12.ipa"
          mv build/symboles-ipa build/livraison/ipa/symboles
          cat > build/livraison/ipa/LISEZ-MOI.txt <<FIN
          Carlys — application de RECETTE (iOS)
          commit                      : $SHA12
          bundle                      : $BUNDLE
          CFBundleVersion             : $NUMERO (numéro d'exécution du workflow)
          CARLYS_FLAVOR               : staging
          CARLYS_API_BASE_URL         : $API
          CARLYS_PUBLIC_WEB_BASE_URL  : $WEB

          Signé pour l'App Store Connect : ne s'installe PAS par câble sur un
          iPhone. Il passe par TestFlight — téléversé par l'exécution si la
          clé API App Store Connect est posée, sinon avec l'application
          Transporter (Mac App Store) ou « xcrun altool --upload-app ».

          LANCEZ-LE UNE FOIS depuis TestFlight avant de l'ouvrir aux testeurs :
          le contrôle des adresses (assertUsable) a lieu au démarrage, pas à la
          compilation.

          symboles/ : à conserver pour déchiffrer les traces d'exécution,
          le binaire étant obscurci (--obfuscate).
          FIN
          ls -lh "build/livraison/ipa/carlys-recette-$SHA12.ipa"

      - name: Artefact — IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carlys-recette-ipa-${{ steps.commit.outputs.sha12 }}
          path: apps/mobile/build/livraison/ipa
          if-no-files-found: error

      # ── TestFlight, sur la case « publier » et avec une clé API posée ──────
      #
      # Le dépôt n'a lieu que sur une exécution manuelle avec la case
      # « publier » — même règle que la piste interne Play, voir l'en-tête.
      #
      # Trois secrets, facultatifs mais ENSEMBLE — un jeu à moitié posé est
      # signalé, pas deviné. À créer sur App Store Connect → Users and Access
      # → Integrations → App Store Connect API → clé de rôle « App Manager » :
      #
      #   APP_STORE_CONNECT_KEY_ID          l'identifiant de la clé (10 caractères)
      #   APP_STORE_CONNECT_ISSUER_ID       l'Issuer ID de l'équipe (UUID)
      #   APP_STORE_CONNECT_API_KEY_BASE64  le fichier AuthKey_<KEY_ID>.p8, en
      #                                     base64 — il ne se retélécharge PAS,
      #                                     Apple ne le donne qu'une fois
      #
      # Sans eux, l'.ipa est livré en artefact, à déposer avec Transporter.
      - name: Clé API App Store Connect
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier == true }}
        run: |
          manquants=""
          [ -n "$KEY_ID" ]    || manquants="$manquants APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || manquants="$manquants APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$P8_B64" ]    || manquants="$manquants APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -z "$manquants" ]; then
            case "$KEY_ID" in
              *[!A-Z0-9]*|'')
                echo "::error title=APP_STORE_CONNECT_KEY_ID mal formé::L'identifiant d'une clé App Store Connect est fait de dix lettres majuscules et chiffres — c'est le KEY_ID du nom de fichier AuthKey_<KEY_ID>.p8, pas l'Issuer ID."
                exit 1 ;;
            esac
            mkdir -p "$HOME/private_keys"
            printf '%s' "$P8_B64" | base64 -d > "$HOME/private_keys/AuthKey_$KEY_ID.p8" 2>/dev/null || {
              echo "::error title=APP_STORE_CONNECT_API_KEY_BASE64 illisible::La valeur n'est pas du base64 valide. Régénère-la avec « base64 -i AuthKey_<KEY_ID>.p8 | tr -d '\n' »."
              exit 1
            }
            echo "actif=oui" >> "$GITHUB_OUTPUT"
            if [ "$PUBLIER" = "true" ]; then
              echo "Clé API App Store Connect présente : téléversement TestFlight demandé (case publier)."
            else
              echo "Clé API App Store Connect présente — pas de téléversement : la case « publier » n'est pas cochée."
            fi
          elif [ "$PUBLIER" = "true" ]; then
            # « publier » sans clé API : échec en rouge — sans Mac, la clé API
            # est le SEUL chemin vers TestFlight, un vert sans dépôt mentirait.
            echo "::error title=Publication demandée, clé API App Store Connect absente ou incomplète::La case « publier » demandait un dépôt TestFlight, mais il manque :$manquants. Les trois secrets vont ensemble (docs/deployment/builds-mobiles.md §10.4). Sans eux, rien ne peut partir — Transporter est une application macOS."
            exit 1
          elif set -- $manquants && [ "$#" -eq 3 ]; then
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "Aucune clé API App Store Connect : l'.ipa reste un artefact à déposer avec Transporter."
          else
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "::warning title=Clé API App Store Connect à moitié posée::Secret(s) absent(s) :$manquants. Les trois vont ensemble ; tant qu'il en manque un, rien n'est téléversé et l'.ipa reste un artefact."
          fi

      # La commande de la documentation Flutter (docs.flutter.dev/deployment/ios).
      # altool cherche la clé dans ~/private_keys/AuthKey_<KEY_ID>.p8 : c'est
      # là que l'étape précédente l'a écrite. Le téléversement réussi n'est
      # que le DÉBUT : Apple traite ensuite le build (dix à trente minutes),
      # puis il apparaît dans App Store Connect → TestFlight.
      - name: Téléversement — TestFlight
        if: >-
          steps.asc.outputs.actif == 'oui' &&
          github.event_name == 'workflow_dispatch' && inputs.publier == true
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "build/livraison/ipa/carlys-recette-$SHA12.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Récapitulatif
        env:
          SHA12: ${{ steps.commit.outputs.sha12 }}
          API: ${{ steps.adresses.outputs.api }}
          WEB: ${{ steps.adresses.outputs.web }}
          NUMERO: ${{ github.run_number }}
          BUNDLE: ${{ steps.bundle.outputs.id }}
          PROFIL_NOM: ${{ steps.profil.outputs.nom }}
          EQUIPE: ${{ steps.profil.outputs.equipe }}
          IDENTITE: ${{ steps.profil.outputs.identite }}
          TESTFLIGHT: ${{ steps.asc.outputs.actif }}
          PUBLIER: ${{ github.event_name == 'workflow_dispatch' && inputs.publier == true }}
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          {
            echo "## Application de recette iOS — commit \`$SHA12\`"
            echo
            echo "| Variable de build | Valeur |"
            echo "| ----------------- | ------ |"
            echo "| bundle | \`$BUNDLE\` |"
            echo "| version (pubspec) | \`$VERSION\` |"
            echo "| équipe Apple | \`$EQUIPE\` |"
            echo "| certificat | \`$IDENTITE\` |"
            echo "| profil | \`$PROFIL_NOM\` |"
            echo "| \`CFBundleVersion\` | \`$NUMERO\` |"
            echo "| \`CARLYS_FLAVOR\` | \`staging\` |"
            echo "| \`CARLYS_API_BASE_URL\` | \`$API\` |"
            echo "| \`CARLYS_PUBLIC_WEB_BASE_URL\` | \`$WEB\` |"
            echo
            echo "**\`carlys-recette-ipa-$SHA12\`** — l'application signée pour App Store"
            echo "Connect, avec \`symboles/\`. Un \`.ipa\` de distribution ne s'installe pas"
            echo "par câble : il passe par TestFlight."
            echo
            if [ "$TESTFLIGHT" = "oui" ] && [ "$PUBLIER" = "true" ]; then
              echo "**Téléversé sur App Store Connect.** Apple le traite (dix à trente"
              echo "minutes), puis il apparaît dans TestFlight ; les testeurs internes"
              echo "le reçoivent dès qu'il est ajouté à leur groupe."
            elif [ "$TESTFLIGHT" = "oui" ]; then
              echo "**Prêt pour TestFlight, non téléversé** : rien ne part vers un magasin"
              echo "sans la case **publier**. Pour déposer ce build : Actions →"
              echo "mobile-recette → Run workflow → cocher \`ios\` ET \`publier\`."
            else
              echo "Non téléversé : poser les trois secrets \`APP_STORE_CONNECT_KEY_ID\`,"
              echo "\`APP_STORE_CONNECT_ISSUER_ID\`, \`APP_STORE_CONNECT_API_KEY_BASE64\`,"
              echo "puis relancer avec les cases \`ios\` et \`publier\` — sans Mac, c'est le"
              echo "seul chemin vers TestFlight (Transporter est une application macOS)."
            fi
            echo
            echo "> **Lancez l'application une fois** depuis TestFlight avant de l'ouvrir"
            echo "> aux testeurs : le contrôle des adresses (\`assertUsable()\`) a lieu **au"
            echo "> démarrage, pas à la compilation**."
          } >> "$GITHUB_STEP_SUMMARY"

      # RIEN NE SURVIT AU JOB : trousseau, .p12, profil, clé API. Même raison
      # que le keystore Android — sur un runner auto-hébergé, le disque est
      # partagé entre toutes les exécutions. L'étape ne doit jamais échouer
      # elle-même, sans quoi elle masquerait la vraie cause d'un échec.
      - name: Effacer le trousseau, le profil et la clé API
        if: always()
        env:
          UUID: ${{ steps.profil.outputs.uuid }}
        run: |
          trousseau="$RUNNER_TEMP/carlys-signature.keychain-db"
          if [ -f "$trousseau" ]; then
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "$trousseau" || true
            echo "Trousseau temporaire supprimé."
          fi
          rm -f "$RUNNER_TEMP/carlys-distribution.p12" "$RUNNER_TEMP/carlys.mobileprovision" \
                "$RUNNER_TEMP/carlys-profil.plist" "$RUNNER_TEMP"/wwdr-*.cer
          if [ -n "$UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          fi
          rm -rf "$HOME/private_keys"
          echo "Secrets iOS effacés du runner."
