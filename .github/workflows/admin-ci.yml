name: admin-ci

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Build des packages partagés
        run: pnpm --filter "./packages/**" build

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @carlys/admin lint

      - name: Types
        run: pnpm --filter @carlys/admin typecheck

      - name: Tests
        run: pnpm --filter @carlys/admin test

      - name: Build
        run: pnpm --filter @carlys/admin build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
