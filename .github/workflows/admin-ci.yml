name: admin-ci

# Pourquoi `push:` nomme la branche de travail et pas seulement `main` : le
# dépôt n'avance PAS par pull request, il avance par poussées directes sur
# development. `git log --merges --oneline | wc -l`
# y rend ZÉRO fusion pour TOUTE la branche : une porte limitée à
# `pull_request` + `main` ne s'est donc JAMAIS ouverte pendant le
# développement, elle ne s'ouvrait qu'après coup. On s'aligne sur mobile-recette.yml
# et images-ci.yml, qui nomment déjà les deux branches.
#
# L'arbitrage est assumé : ce workflow va tourner à chaque poussée qui touche
# son périmètre, donc plus souvent et plus cher qu'avant. C'est le bon échange
# parce que le prix d'un échec n'est pas symétrique — un lint rouge ou un test
# cassé se voit dans la minute et se corrige dans le commit suivant, alors
# qu'une régression découverte après fusion se paie en bissection, en rollback
# et en travail déjà empilé par-dessus. Deux garde-fous bornent la facture :
# les filtres `paths` ci-dessous (rien ne tourne si aucune entrée du job n'a
# bougé) et le `concurrency` plus bas, dont le `cancel-in-progress` ne garde
# qu'une exécution par rafale de poussées.
on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      # Les pages /privacy et /terms rendent ces fichiers au build et les tests les lisent.
      - 'docs/legal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'
  push:
    branches: [development, production]
    # GitHub Actions ignore les ancres YAML : la liste ci-dessus est recopiée
    # telle quelle. Toute entrée ajoutée ici doit l'être aux deux endroits.
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'docs/legal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

# Le GITHUB_TOKEN par défaut hérite du réglage du dépôt (Settings → Actions →
# Workflow permissions), invisible depuis ce fichier. Lecture seule explicite :
# ce workflow ne fait que vérifier, il n'écrit rien — et une action tierce
# compromise n'y trouverait pas de jeton en écriture.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Build des packages partagés
        run: pnpm --filter "./packages/**" build

      # Le LINT et les TESTS des paquets partagés ne sont PAS ici, et c'est
      # une décision, pas un oubli : ils vivaient dans les DEUX workflows, et
      # chaque poussée touchant packages/** les exécutait deux fois. api-ci
      # les garde — avec la garde sur le script `test` de packages/ui — et
      # ses déclencheurs couvrent exactement les mêmes chemins (packages/**
      # en push comme en pull_request) : la porte est la même, payée une fois.
      # Le BUILD, lui, reste ci-dessus : la compilation de l'admin en dépend.

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @carlys/admin lint

      - name: Types
        run: pnpm --filter @carlys/admin typecheck

      - name: Tests
        run: pnpm --filter @carlys/admin test

      - name: Build
        run: pnpm --filter @carlys/admin build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

      # Textes légaux — VISIBLE ici, BLOQUANT en production.
      #
      # Choix RATIFIÉ, écrit noir sur blanc pour qu'on cesse de le rejuger :
      # CETTE ÉTAPE EST UN INVENTAIRE, PAS UNE PORTE. La porte est l'image de
      # production (apps/admin/Dockerfile, vérifiée par images-ci.yml). Ici, on
      # ne cherche pas à faire échouer le job : on cherche à ce que la dette
      # légale soit lisible dans le résumé du job, là où on relit la CI.
      #
      # docs/legal/*.md portent encore 16 marqueurs « [À COMPLÉTER : … ] »
      # distincts (10 dans privacy.md, 6 dans terms.md) que /privacy et /terms
      # servent en clair. L'étape « Build » ci-dessus ne les voit pas : sans
      # LEGAL_PLACEHOLDERS=forbid, la garde de src/lib/legal-documents.ts se
      # contente d'un avertissement noyé dans le journal, et le build rend 0.
      #
      # Pourquoi cette étape n'est PAS bloquante, alors qu'il serait tentant de
      # poser `forbid` directement sur le Build ci-dessus. Mesuré : avec
      # `LEGAL_PLACEHOLDERS=forbid`, `pnpm --filter @carlys/admin build` rend
      # code 1 AUJOURD'HUI. Cette porte naîtrait donc rouge, et le resterait à
      # chaque poussée touchant apps/admin, packages/** ou docs/legal, jusqu'à
      # ce que quelqu'un rédige seize paragraphes juridiques — une décision de
      # l'éditeur, pas un correctif de développement. Une CI rouge en
      # permanence n'est pas un filet : elle apprend à ne plus regarder
      # admin-ci, et masque au passage les cinq étapes utiles au-dessus (lint,
      # types, tests admin, lint et tests des paquets).
      #
      # Surtout, le blocage EXISTE DÉJÀ là où il compte : apps/admin/Dockerfile
      # pose `ARG LEGAL_PLACEHOLDERS=forbid`, donc l'image de production REFUSE
      # de se construire tant qu'un marqueur subsiste — et images-ci.yml, qui
      # tourne sur cette même branche, vérifie à chaque exécution que cette
      # garde mord encore (étape « La garde légale mord toujours » : un build
      # qui réussit y fait échouer le job). Rendre admin-ci rouge n'ajouterait
      # donc aucune protection, seulement du bruit.
      #
      # Ce qui manquait n'était pas le blocage, c'était la VISIBILITÉ : l'état
      # d'inachèvement remonte désormais dans le résumé du job et en annotation.
      # Le jour où docs/legal sera terminé, cette étape le dira d'elle-même
      # (annotation `::notice::`) ; il suffira alors de remplacer le
      # `::warning::` final par un `exit 1` pour la rendre bloquante, et de
      # déplacer `LEGAL_PLACEHOLDERS: forbid` sur l'étape « Build » elle-même.
      #
      # Ce que cette étape ne prétend PAS être, contre-mesure à l'appui : son
      # « exit 1 » n'est pas une porte de secours contre un build cassé pour
      # une autre raison. Un tel build fait DÉJÀ tomber l'étape « Build »
      # ci-dessus et le job s'arrête là (mesuré : une erreur de type posée dans
      # (public)/privacy/page.tsx fait rendre 1 à `pnpm --filter @carlys/admin
      # build` même sans LEGAL_PLACEHOLDERS — cette branche-là est donc
      # inatteignable en exécution réelle).
      #
      # Sa branche rouge n'est pas morte pour autant, elle sert autre chose :
      # elle mord quand le build échoue SOUS `forbid` sans que le journal porte
      # la phrase de la garde, c'est-à-dire quand le libellé de
      # src/lib/legal-documents.ts dérive du `grep` ci-dessous (mesuré : en
      # remplaçant « marqueur(s) à compléter » par une autre formule, le build
      # rend 1, le `grep -q` ne mord plus, et l'étape rend 1). C'est un
      # détecteur de découplage entre la garde et ce workflow — pas une porte
      # produit. Elle ne tolère que la dette qu'elle nomme.
      - name: Textes légaux — inventaire des marqueurs (non bloquant)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          LEGAL_PLACEHOLDERS: forbid
        run: |
          # Le build est ici relancé À CHAUD (quelques secondes, .next déjà
          # peuplé par l'étape précédente) : on réutilise la VRAIE garde plutôt
          # que de redire sa règle en shell, qui la dupliquerait et dériverait.
          pnpm --filter @carlys/admin build > legal.log 2>&1 && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Aucun marqueur : docs/legal est complet."
            echo "Aucun marqueur restant dans docs/legal." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::docs/legal est complet — cette étape peut devenir bloquante (voir son commentaire)."
            exit 0
          fi
          # Un build cassé pour une AUTRE raison que la garde légale n'a rien à
          # voir avec cette dette-là : on ne l'avale pas.
          if ! grep -q 'marqueur(s) à compléter' legal.log; then
            echo "::error::Le build a échoué, mais pas sur la garde légale :"
            tail -40 legal.log
            exit 1
          fi
          # `next build` s'arrête au PREMIER document fautif : l'inventaire
          # ci-dessous ne montre donc qu'un fichier à la fois, pas les deux.
          # L'ancre `^Error:` évite au passage de ramasser la ligne de code
          # source que Next réaffiche, qui contient les mêmes mots.
          {
            echo "### Textes légaux inachevés"
            echo
            echo "Les pages \`/privacy\` et \`/terms\` servent encore des marqueurs en clair."
            echo "L'image de production, elle, refuse de se construire (voir images-ci)."
            echo "Le build s'arrêtant au premier document fautif, l'autre peut en porter aussi."
            echo
            echo '```'
            # Le repli n'est pas décoratif : le shell d'une étape `run:` est
            # `bash -e {0}`, et un `grep` qui ne trouve rien rend 1. Sans lui,
            # l'étape mourait ICI — sans annotation, et avec un résumé tronqué
            # en plein bloc de code (éprouvé dans les deux sens).
            grep -E '^Error: docs/legal/.*marqueur\(s\) à compléter|^ *- \[À COMPLÉTER' legal.log \
              || echo '(message de la garde introuvable dans le journal : format de sortie changé ? voir le journal brut du build.)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::docs/legal porte encore des marqueurs [À COMPLÉTER] servis en clair sur /privacy et /terms."
