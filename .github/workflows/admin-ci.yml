name: admin-ci

# Pourquoi `push:` nomme la branche de travail et pas seulement `main` : le
# dépôt n'avance PAS par pull request, il avance par poussées directes sur
# claude/carlys-fitness-foundation-lqv2hl. `git log --merges` y compte ZÉRO
# fusion sur 186 commits : une porte limitée à `pull_request` + `main` ne s'est
# donc JAMAIS ouverte pendant le développement, elle ne s'ouvrait qu'après
# coup. On s'aligne sur demo-apk.yml et images-ci.yml, qui nomment déjà les
# deux branches.
#
# L'arbitrage est assumé : ce workflow va tourner à chaque poussée qui touche
# son périmètre, donc plus souvent et plus cher qu'avant. C'est le bon échange
# parce que le prix d'un échec n'est pas symétrique — un lint rouge ou un test
# cassé se voit dans la minute et se corrige dans le commit suivant, alors
# qu'une régression découverte après fusion se paie en bissection, en rollback
# et en travail déjà empilé par-dessus. Deux garde-fous bornent la facture :
# les filtres `paths` ci-dessous (rien ne tourne si aucune entrée du job n'a
# bougé) et le `concurrency` plus bas, dont le `cancel-in-progress` ne garde
# qu'une exécution par rafale de poussées.
on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      # Les pages /privacy et /terms rendent ces fichiers au build et les tests les lisent.
      - 'docs/legal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'
  push:
    branches: [claude/carlys-fitness-foundation-lqv2hl, main]
    # GitHub Actions ignore les ancres YAML : la liste ci-dessus est recopiée
    # telle quelle. Toute entrée ajoutée ici doit l'être aux deux endroits.
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'docs/legal/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/admin-ci.yml'

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Build des packages partagés
        run: pnpm --filter "./packages/**" build

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm --filter @carlys/admin lint

      - name: Types
        run: pnpm --filter @carlys/admin typecheck

      - name: Tests
        run: pnpm --filter @carlys/admin test

      - name: Build
        run: pnpm --filter @carlys/admin build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
