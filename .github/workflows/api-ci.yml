name: api-ci

# Pourquoi `push:` nomme la branche de travail et pas seulement `main` : le
# dépôt n'avance PAS par pull request, il avance par poussées directes sur
# development. La mesure est sans appel, et elle se
# rejoue en local : `git log --merges --oneline | wc -l` rend ZÉRO fusion pour
# TOUTE la branche, donc aucune poussée de développement n'a jamais ouvert
# cette porte — pas même les commits qui touchent le schéma Prisma, ceux-là
# mêmes que l'étape « Détection des migrations manquantes » plus bas existe
# pour surveiller. Leur nombre se recompte d'une commande plutôt que de se
# graver ici, où il périmerait au commit suivant :
# `git log --oneline -- apps/api/prisma/schema.prisma | wc -l` (7 le jour où
# ces lignes sont écrites ; ce chiffre monte, le zéro de fusions ne bouge pas).
# Le job le plus riche du dépôt — PostgreSQL, Redis, MinIO, migrations, e2e —
# ne regardait jamais le code au moment où il s'écrit, mais seulement après la
# fusion, quand le corriger coûte le plus cher. On s'aligne sur mobile-recette.yml et
# images-ci.yml, qui nomment déjà les deux branches.
#
# L'arbitrage est assumé : ce workflow va tourner à chaque poussée qui touche
# son périmètre, donc bien plus souvent et plus cher qu'avant (PostgreSQL,
# Redis et MinIO à démarrer, une installation pnpm complète, la suite unitaire
# et la suite e2e). Le prix d'un échec n'est pourtant pas symétrique : un test
# rouge se voit dans la minute et se corrige dans le commit suivant, tandis
# qu'une régression découverte après fusion se paie en bissection, en rollback
# et en travail déjà construit par-dessus. Deux garde-fous bornent la facture —
# les filtres `paths` ci-dessous (rien ne tourne si aucune entrée du job n'a
# bougé) et le `concurrency` plus bas, dont le `cancel-in-progress` ne garde
# qu'une exécution par rafale de poussées.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # La recette de MinIO (versions épinglées, construire.sh) : une montée de
      # version doit repasser les e2e qui parlent au vrai stockage objet.
      - 'infrastructure/minio/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [development, production]
    # GitHub Actions ignore les ancres YAML : la liste ci-dessus est recopiée
    # telle quelle. Toute entrée ajoutée ici doit l'être aux deux endroits.
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infrastructure/minio/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

# Le GITHUB_TOKEN par défaut hérite du réglage du dépôt (Settings → Actions →
# Workflow permissions), invisible depuis ce fichier. Lecture seule explicite :
# ce workflow ne fait que vérifier, il n'écrit rien — et une action tierce
# compromise n'y trouverait pas de jeton en écriture.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carlys
          POSTGRES_PASSWORD: carlys
          POSTGRES_DB: carlys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carlys -d carlys_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://carlys:carlys@localhost:5432/carlys_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: secret-ci-uniquement-32-caracteres-minimum-x
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: carlys-media
      # Bucket PRIVÉ (photos de repas) : distinct du précédent, jamais lisible
      # sans jeton. nutrition-photos-minio.e2e-spec.ts le vérifie.
      S3_PRIVATE_BUCKET: carlys-private
      S3_ACCESS_KEY_ID: carlys-ci
      S3_SECRET_ACCESS_KEY: carlys-ci-secret
      S3_PUBLIC_BASE_URL: http://localhost:9000/carlys-media

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── MinIO, construit depuis ses SOURCES ─────────────────────────────────
      #
      # POURQUOI PLUS AUCUNE IMAGE. Le 12 septembre 2026, ce job est tombé sur
      # « pull access denied for minio/minio » : les dépôts minio/minio et
      # minio/mc avaient DISPARU de Docker Hub (MinIO a cessé de distribuer son
      # édition communautaire ; dl.min.io rend 410 jusqu'aux binaires signés).
      # Repli sur quay.io, épinglé par empreinte. Le 24 septembre 2026, quay.io
      # a cessé de servir les MÊMES images : « unauthorized: access to the
      # requested resource is not authorized », échec en une seconde, sur des
      # commits qui ne touchaient même pas l'API. Deux registres tiers, deux
      # pannes. Les SOURCES, elles, restent publiques (github.com/minio/minio
      # et github.com/minio/mc, AGPLv3) : on construit les deux binaires
      # nous-mêmes, au tag ET au commit épinglés dans
      # infrastructure/minio/versions.env, par infrastructure/minio/construire.sh
      # — la recette même des images du serveur et du développement. On teste
      # ce qu'on exploite.
      #
      # Le cache rend l'étape quasi gratuite : la clé porte les deux tags, la
      # version de Go et l'empreinte de la recette (versions.env, donc les
      # commits, et construire.sh). Une construction à froid ne se paie qu'à
      # une montée de version — mesurée à 2 min 20 s pour les deux binaires sur
      # 4 cœurs, téléchargement des modules Go compris.
      - name: MinIO — versions épinglées
        id: minio-versions
        run: grep -E '^[A-Z0-9_]+=' infrastructure/minio/versions.env >> "$GITHUB_OUTPUT"

      - name: MinIO — binaires en cache
        id: minio-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.carlys-minio
          key: minio-${{ runner.os }}-${{ runner.arch }}-${{ steps.minio-versions.outputs.CARLYS_MINIO_RELEASE }}-mc-${{ steps.minio-versions.outputs.CARLYS_MC_RELEASE }}-go${{ steps.minio-versions.outputs.CARLYS_MINIO_GO_VERSION }}-${{ hashFiles('infrastructure/minio/versions.env', 'infrastructure/minio/construire.sh') }}

      # Go n'est installé QUE s'il faut construire. La version vient de
      # versions.env, et construire.sh refuse toute autre (GOTOOLCHAIN=local).
      # `cache: false` : il n'y a pas de go.sum dans ce dépôt à indexer, et les
      # binaires sont déjà mis en cache ci-dessus.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ steps.minio-versions.outputs.CARLYS_MINIO_GO_VERSION }}
          cache: false

      - name: MinIO — construction depuis les sources (absent du cache)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          sh infrastructure/minio/construire.sh minio "$HOME/.carlys-minio"
          sh infrastructure/minio/construire.sh mc "$HOME/.carlys-minio"

      # MinIO tourne en processus d'arrière-plan, pas en `services` : un
      # conteneur de service ne peut pas recevoir la commande `server`, et
      # l'image n'existerait de toute façon qu'après ce job. Les buckets
      # doivent exister avant les tests, comme en développement : celui des
      # médias lisible en anonyme, celui des données personnelles (photos de
      # repas) SANS aucune politique — `set none` le redit explicitement.
      - name: Stockage objet (MinIO + bucket public + bucket privé)
        env:
          MINIO_ROOT_USER: carlys-ci
          MINIO_ROOT_PASSWORD: carlys-ci-secret
          MC_CONFIG_DIR: ${{ runner.temp }}/mc
        run: |
          bin="$HOME/.carlys-minio"
          "$bin/minio" --version
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$bin/minio" server "$RUNNER_TEMP/minio-data" --address :9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          pret=0
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live; then pret=1; break; fi
            sleep 2
          done
          if [ "$pret" -ne 1 ]; then
            echo "::error::MinIO ne répond pas sur /minio/health/live après 60 s."
            cat "$RUNNER_TEMP/minio.log"
            exit 1
          fi
          "$bin/mc" alias set ci http://localhost:9000 carlys-ci carlys-ci-secret
          "$bin/mc" mb --ignore-existing ci/carlys-media
          "$bin/mc" anonymous set download ci/carlys-media
          "$bin/mc" mb --ignore-existing ci/carlys-private
          "$bin/mc" anonymous set none ci/carlys-private

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Build des packages partagés
        run: pnpm --filter "./packages/**" build

      # `build` compile, il ne juge pas : un fichier déposé dans
      # packages/api-contracts/src avec `any` ET un `catch {}` vide — deux
      # interdits explicites de CLAUDE.md — traversait l'étape ci-dessus en
      # code 0. Mesuré : ce même fichier fait rendre code 1 à l'étape ci-dessous
      # (« Unexpected any », « Empty block statement »). Les paquets partagés
      # sont pourtant le code le plus exposé du dépôt, importé par l'API comme
      # par l'admin, et aucune étape de la CI ne les lintait. `pnpm` saute sans
      # broncher les paquets dépourvus de script `lint` (eslint-config et
      # typescript-config n'en ont pas) : le filtre n'a pas à être restreint.
      - name: Lint des packages partagés
        run: pnpm --filter "./packages/**" lint

      # Corollaire du même angle mort : les tests vitest de packages/ui
      # n'étaient exécutés par AUCUN workflow. Seul packages/ui porte un script
      # `test` aujourd'hui, et pnpm ignore silencieusement les autres.
      #
      # D'où la garde ci-dessous. `test` est un nom de script BUILTIN pour
      # pnpm : mesuré, un `pnpm --filter "./packages/**" test` qui ne trouve
      # AUCUN script rend 0 sans un mot, là où un nom quelconque rend 1
      # (ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT) — et écrire `run test` n'y change
      # rien. Ce filet pourrait donc se vider en silence le jour où packages/ui
      # perdrait son script `test` ; on refuse de laisser cette étape rester
      # verte en ne testant plus rien.
      - name: Tests des packages partagés
        run: |
          node --eval '
            if (!require("./packages/ui/package.json").scripts?.test) {
              console.log("::error::packages/ui ne déclare plus de script test — les tests des paquets partagés ne testent plus rien.");
              process.exit(1);
            }
          '
          pnpm --filter "./packages/**" test

      - name: Formatage
        run: pnpm format:check

      - name: Client Prisma
        run: pnpm --filter @carlys/api prisma:generate

      - name: Validation du schéma Prisma
        run: pnpm --filter @carlys/api exec prisma validate

      - name: Détection des migrations manquantes
        working-directory: apps/api
        run: |
          if [ -d prisma/migrations ]; then
            pnpm exec prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema-datamodel prisma/schema.prisma \
              --shadow-database-url "$DATABASE_URL" \
              --exit-code
          else
            echo "Aucune migration pour le moment (schéma vide — Étape 1)."
          fi

      - name: Lint
        run: pnpm --filter @carlys/api lint

      - name: Types
        run: pnpm --filter @carlys/api typecheck

      - name: Tests unitaires
        run: pnpm --filter @carlys/api test

      - name: Tests end-to-end
        run: pnpm --filter @carlys/api test:e2e

      - name: Build
        run: pnpm --filter @carlys/api build

      # MinIO n'est plus un conteneur : sans cette étape, son journal
      # disparaîtrait avec le runner, et un e2e de stockage rouge n'aurait
      # que la moitié de son histoire.
      - name: Journal de MinIO en cas d'échec
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/minio.log" 2>/dev/null || echo "MinIO n'a pas été démarré."
