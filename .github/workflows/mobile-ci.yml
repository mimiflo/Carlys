name: mobile-ci

# Pourquoi `push:` nomme la branche de travail et pas seulement `main` : le
# dépôt n'avance PAS par pull request, il avance par poussées directes sur
# development. `git log --merges --oneline | wc -l`
# y rend ZÉRO fusion pour TOUTE la branche : une porte limitée à
# `pull_request` + `main` ne s'est donc JAMAIS ouverte pendant le
# développement. On s'aligne sur mobile-recette.yml, qui nomme déjà les deux
# branches — et qui construit l'APK depuis ce même `apps/mobile` sans que
# rien n'ait vérifié `flutter analyze` avant lui.
#
# L'arbitrage est assumé : ce workflow va tourner à chaque poussée qui touche
# son périmètre, et il est le plus lent du dépôt (installation du SDK Flutter
# épinglé, `build_runner` à froid — voir plus bas pourquoi son cache est
# proscrit). C'est malgré tout le bon échange : une analyse rouge se voit dans
# la minute, alors qu'une régression mobile découverte après fusion se paie en
# bissection sur une base où le code engendré n'est même pas versionné. Trois
# garde-fous bornent la facture : les filtres `paths` ci-dessous (rien ne
# tourne si aucune entrée du job n'a bougé), le `concurrency` plus bas dont le
# `cancel-in-progress` ne garde qu'une exécution par rafale de poussées, et le
# `timeout-minutes` qui coupe un runner gelé.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      # packages/design-tokens/src/tokens.json est la SOURCE DE VÉRITÉ du
      # design system (CLAUDE.md : « toute évolution s'y fait d'abord »), et
      # apps/mobile/test/design_system/design_tokens_test.dart vérifie que le
      # design system Dart lui reste fidèle, token par token. Sans cette
      # entrée, le geste même que la spécification prescrit — ne toucher que
      # tokens.json — ne réveillait AUCUN workflow capable d'exécuter ce test,
      # mobile-ci étant le seul du dépôt à faire tourner `flutter test`.
      # admin-ci et api-ci listent `packages/**` depuis toujours ; c'est ici
      # qu'il manquait.
      - 'packages/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [development, production]
    # GitHub Actions ignore les ancres YAML : la liste ci-dessus est recopiée
    # telle quelle. Toute entrée ajoutée ici doit l'être aux deux endroits.
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-ci.yml'
  # Relance MANUELLE : un runner qui gèle (build_runner suspendu, coupé par
  # timeout-minutes) ne doit pas exiger un commit pour rejouer le workflow.
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

# Le GITHUB_TOKEN par défaut hérite du réglage du dépôt (Settings → Actions →
# Workflow permissions), invisible depuis ce fichier. Lecture seule explicite :
# ce workflow ne fait que vérifier, il n'écrit rien — et une action tierce
# compromise n'y trouverait pas de jeton en écriture.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Aucune libsqlite3 système à installer : depuis sqlite3 3.x (drift
      # 2.32+), le hook de build de `package:sqlite3` télécharge sa propre
      # bibliothèque et la préfère à celle de l'OS — tests compris.

      # Version ÉPINGLÉE — jamais « stable » au fil de l'eau — et à SOURCE
      # UNIQUE : apps/mobile/.flutter-version, lu ici, par mobile-recette.yml,
      # mobile-production.yml et scripts/check_mobile.sh. La monter = changer ce seul fichier
      # (voir docs/development/poste-de-travail.md).
      #
      # Pas de `flutter-version-file` : en v2 de l'action, cette entrée ne
      # sait lire qu'un pubspec.yaml (champ environment.flutter, via yq) ou
      # une config FVM — pas un fichier texte nu comme .flutter-version.
      #
      # Historique de l'épinglage : la 3.47 (Dart 3.13) faisait crasher
      # l'analyzer de drift_dev sur « Missing implementation of
      # visitDotShorthandPropertyAccess », et build_runner gelait jusqu'au
      # timeout. La cause tenait à drift_dev 2.28, qui épinglait analyzer
      # 7.6 — un analyseur en langage 3.9, ignorant les raccourcis par
      # point introduits en 3.13.
      #
      # drift_dev 2.34 exige analyzer ^13 : le verrou est levé. Cette
      # version-ci reste épinglée parce qu'elle est celle sur laquelle la
      # montée a été éprouvée ; la faire passer à 3.47 demande le même
      # soin — un commit délibéré, après vérification sur un poste qui
      # tourne vraiment en 3.47.
      - name: Version Flutter épinglée
        id: pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true

      - name: Cache des paquets Dart
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # --enforce-lockfile : le pubspec.lock versionné est contraignant en
      # CI, pas consultatif — toute dérive fait échouer le job au lieu de
      # résoudre en silence autre chose que ce qui a été éprouvé en local.
      - name: Dépendances
        run: flutter pub get --enforce-lockfile

      # Le cache de build_runner évite de tout régénérer à chaque exécution.
      # PAS de cache de .dart_tool/build : restauré, il mettait build_runner
      # dans un état où le processus ne se TERMINAIT jamais (drift_dev
      # concluait « no-op » puis le job gelait jusqu'au timeout — processus
      # dart:build_runner orphelin tué au nettoyage). La génération à froid
      # coûte ~1 min ; le cache en a coûté 40. Le cache pub, lui, reste.

      - name: Génération de code (Drift)
        run: dart run build_runner build

      - name: Formatage
        run: |
          dart format --output=none --set-exit-if-changed \
            $(find lib test -name '*.dart' ! -name '*.g.dart')

      - name: Analyse statique
        run: flutter analyze

      # L'analyseur Dart n'a AUCUNE règle de longueur de fichier — mesuré,
      # `max_lines_per_file` rend « isn't a recognized lint rule ». Les
      # seuils du tableau de CLAUDE.md ne peuvent donc tenir que par ce
      # script. Il vivait jusqu'ici dans check_mobile.sh seul, c'est-à-dire
      # nulle part dès qu'un développeur ne le lançait pas à la main : une
      # règle écrite que rien ne relit finit toujours par être franchie.
      # Placé APRÈS l'analyse, parce qu'un fichier qui ne compile pas rend
      # sa longueur sans intérêt.
      - name: Tailles de fichiers
        working-directory: .
        run: ./scripts/check_mobile_file_sizes.sh

      - name: Tests
        run: flutter test
