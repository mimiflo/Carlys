name: mobile-ci

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # SQLite natif requis par les tests Drift (NativeDatabase).
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache des paquets Dart
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Dépendances
        run: flutter pub get

      # Le cache de build_runner évite de tout régénérer à chaque exécution.
      - name: Cache de génération de code
        uses: actions/cache@v4
        with:
          path: apps/mobile/.dart_tool/build
          key: buildrunner-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}-${{ hashFiles('apps/mobile/lib/**/*.dart') }}
          restore-keys: |
            buildrunner-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}-
            buildrunner-${{ runner.os }}-

      - name: Génération de code (Drift, …)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatage
        run: |
          dart format --output=none --set-exit-if-changed \
            $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart')

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test
