# Ménage des artefacts — à lancer à la main (Actions → menage-artefacts →
# Run workflow).
#
# Les artefacts d'un dépôt PRIVÉ comptent dans le stockage inclus du compte,
# et GitHub ne supprime chacun qu'au terme de la rétention fixée À SA
# CRÉATION. Raccourcir un `retention-days` ne vaut donc que pour les
# artefacts à venir : le 28/09, ceux d'avant le 27/09 (APK, bundle et
# symboles, ~100 Mo par poussée mobile, 90 jours par défaut) attendaient
# encore décembre, et le stockage du compte débordait.
#
# Ce workflow les supprime : tout artefact `carlys-recette-*` créé avant
# 512e4a6, qui a posé les rétentions explicites. Les suivants expirent
# d'eux-mêmes. RATTRAPAGE UNIQUE, retiré du dépôt une fois lancé : il ne
# recopie aucune rétention, rien ne peut donc dériver.
name: menage-artefacts
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  menage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supprimer les artefacts de recette d'avant les rétentions explicites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # La liste entière D'ABORD : supprimer pendant la pagination
          # décalerait les pages et en sauterait.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '
            .artifacts[]
            | select((.expired | not) and (.name | startswith("carlys-recette-"))
                and (.created_at | fromdateiso8601) < ("2026-09-27T17:00:00Z" | fromdateiso8601))
            | "\(.id)\t\(.size_in_bytes)\t\(.name)"' > a-supprimer.tsv

          octets=0
          while IFS=$'\t' read -r id taille nom; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            octets=$((octets + taille))
            echo "supprimé : $nom"
          done < a-supprimer.tsv
          echo "$(wc -l < a-supprimer.tsv) artefact(s) supprimé(s), $((octets / 1048576)) Mo libérés." \
            | tee -a "$GITHUB_STEP_SUMMARY"
