# Tient à jour les ÉPINGLES par SHA des actions GitHub.
#
# Chaque `uses:` des workflows est fixé à un COMMIT précis (suffixé du numéro
# de version en commentaire) : un tag `@v4` est mutable — un mainteneur
# compromis peut le déplacer et faire exécuter son code à la prochaine
# exécution, avec les secrets que l'action reçoit (l'incident
# tj-actions/changed-files de 2025 est exactement cela). Un SHA, non.
#
# Le revers d'une épingle est qu'elle gèle : sans ce fichier, les actions ne
# recevraient plus jamais ni correctif ni mise à jour de sécurité. Dependabot
# ouvre donc une pull request par montée de version — le nouveau SHA s'y
# relit avant fusion, et la CI passe dessus comme sur tout commit.
#
# Les actions, et les IMAGES DE BASE Node de l'API et de l'admin (même
# raisonnement : `FROM node:…@sha256:…` est épinglé, donc gelé — Dependabot
# propose la nouvelle version ET sa nouvelle empreinte d'index). Les
# dépendances JS ont `pnpm audit` (security-ci.yml) et un lockfile, Dart a son
# pubspec.lock contraignant et osv-scanner (security-ci.yml) — on ne double
# pas ces canaux ici.
#
# PAS infrastructure/minio : sa version de golang DOIT égaler
# CARLYS_MINIO_GO_VERSION (versions.env), que construire.sh vérifie ; une PR
# Dependabot qui ne monterait que le FROM casserait la construction. Ses
# épingles se montent à la main, avec versions.env.
#
# UNE SEULE PULL REQUEST PAR SEMAINE, groupée. Le dépôt avance par poussées
# directes, pas par fusions : les PR séparées s'accumulaient sans suite (six
# ouvertes le 11/09, encore ouvertes le 25/09, pendant que checkout, cache et
# upload-artifact tournaient sur un Node 20 déprécié). Une PR groupée se relit
# d'un coup, et ses SHA se recopient en poussée directe s'il le faut.
#
# CE QUE DEPENDABOT NE VOIT PAS : les entrées d'une action qui désignent un
# autre artefact. L'image TruffleHog (`version:` dans security-ci.yml) en est
# une — elle se monte à la main, SECURITY.md le rappelle.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-github:
        patterns:
          - '*'

  # Les deux Dockerfile portent la même image Node : qu'elle monte dans les
  # deux à la fois, ou pas du tout. Les correctifs et mineures de Node 22
  # seulement : une majeure se décide avec la CI (`node-version: 22` d'api-ci,
  # admin-ci, security-ci), pas par une PR d'image.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/admin
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      images-node:
        patterns:
          - '*'
