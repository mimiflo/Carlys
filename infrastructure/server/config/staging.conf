# Carlys — configuration de la RECETTE (staging) : ce qui la distingue de la
# production. Le reste est dans commun.conf ; les secrets, dans
# /srv/carlys/staging/.env. Ordre de lecture et règles : en tête de
# commun.conf (ADR 0017).

# ═══════════════════════════════════════════════════════════════════════════
#  1. Pile compose
# ═══════════════════════════════════════════════════════════════════════════

# Isole conteneurs, réseau et volumes de ceux de production sur le même hôte.
COMPOSE_PROJECT_NAME=carlys_staging
# Le profil qui démarre Mailpit. Ne joue que pour un `docker compose` tapé à
# la main : `dc` (carlysctl) passe lui-même `--profile staging`.
COMPOSE_PROFILES=staging
CARLYS_ENV=staging
# Chemin ABSOLU du .env (les secrets) : compose le passe au conteneur de
# l'API depuis n'importe quel répertoire courant.
CARLYS_ENV_FILE=/srv/carlys/staging/.env

# Vide : l'image admin de recette est celle dont la garde légale est
# desserrée. La production réclame le suffixe -prod.
CARLYS_ADMIN_TAG_SUFFIX=

# ── Ports publiés, sur la boucle locale UNIQUEMENT ─────────────────────────
# Ceux de la production décalés d'une centaine. L'API réserve une PLAGE
# (3100-3119) : elle tourne en plusieurs exemplaires et Docker attribue à
# chacun un port libre ; l'admin est donc à 3150. Même mécanique qu'en
# production : la mise à l'échelle s'essaie ici avant d'y croire là-bas.
CARLYS_API_HOST_PORT=3100
CARLYS_API_HOST_PORT_LAST=3119
CARLYS_ADMIN_HOST_PORT=3150
CARLYS_MINIO_HOST_PORT=9200
CARLYS_MAILPIT_UI_HOST_PORT=8025

# ── Mise à jour automatique ────────────────────────────────────────────────
# `oui` fait suivre à la recette la tête de la branche ci-dessous, dès que
# ses trois images existent dans le registre (un commit dont la construction
# a échoué ne déclenche rien).
CARLYS_AUTO_UPDATE=oui
# La branche suivie. DOIT être celle du clone du serveur (/srv/carlys/repo) :
# sinon il exécute les SCRIPTS d'une branche contre les IMAGES d'une autre,
# et une branche en retard fait RECULER la pile (vécu le 10 septembre 2026 :
# 14 commits en arrière en deux minutes). `carlysctl doctor` signale la
# divergence ; `git -C /srv/carlys/repo rev-parse --abbrev-ref HEAD` donne la
# valeur.
CARLYS_UPDATE_BRANCH=development

# ── PostgreSQL ─────────────────────────────────────────────────────────────
POSTGRES_DB=carlys_staging

# ── Redis ──────────────────────────────────────────────────────────────────
# Cache jetable, aucune persistance sur disque…
CARLYS_REDIS_ARGS=--save "" --appendonly no
# … et BORNÉ sous le plafond du conteneur (CARLYS_REDIS_MEM_LIMIT).
# `volatile-ttl` et non `allkeys-lru` : Redis n'évince que des clés qui
# expirent de toute façon, les plus proches de l'échéance d'abord (les
# compteurs de débit avant un verrouillage de compte), et jamais une clé sans
# échéance.
CARLYS_REDIS_MEMOIRE_ARGS=--maxmemory 128mb --maxmemory-policy volatile-ttl

# ── Mémoire : les plafonds de la RECETTE ───────────────────────────────────
# Recette et production partagent l'hôte ; c'est la recette, qui suit chaque
# poussée, qu'on borne (raisonnement en tête de infrastructure/server/
# compose.yml). Une marge nette au-dessus de ce qui a été mesuré :
#   API     512m PAR EXEMPLAIRE — mesuré 188 Mo au repos, 190 Mo après 300
#           requêtes (25/09). Tas de V8 borné à 384 Mo : il s'arrête net
#           AVANT que le noyau ne tue le conteneur.
#   admin   384m — serveur Next.js autonome, sans état.
#   postgres 1g — shared_buffers 128 Mo + 100 connexions au plus, à 4 Mo de
#           work_mem chacune dans le pire des cas.
#   redis   256m — le double de son `--maxmemory`, pour la fragmentation.
#   minio   512m — mesuré 150 Mo au repos (serveur mono-disque).
#   ollama  6g — Qwen3-4B quantifié ≈ 2,5 Go, plus ≈ 1,2 Go de cache pour
#           8 192 jetons de contexte et ses tampons de calcul. Avec le modèle
#           de vision, un seul des deux tient à la fois : un scan décharge le
#           coach, rechargé à la question suivante.
CARLYS_API_MEM_LIMIT=512m
CARLYS_API_NODE_OPTIONS=--max-old-space-size=384
CARLYS_ADMIN_MEM_LIMIT=384m
CARLYS_POSTGRES_MEM_LIMIT=1g
CARLYS_REDIS_MEM_LIMIT=256m
CARLYS_MINIO_MEM_LIMIT=512m
CARLYS_OLLAMA_MEM_LIMIT=6g

# ═══════════════════════════════════════════════════════════════════════════
#  2. API
# ═══════════════════════════════════════════════════════════════════════════

# Origine du navigateur qui appelle l'API : l'application web, jamais l'API.
CORS_ORIGINS=https://app-staging.${DOMAIN}
LOG_LEVEL=debug

# ── Abonnements : le catalogue Stripe de TEST ──────────────────────────────
# Sans les identifiants de tarif, un paiement aboutit chez Stripe mais
# n'accorde RIEN (le webhook tombe sur « produit inconnu »). Le déploiement
# (étape 6/8) refuse de basculer si STRIPE_SECRET_KEY (.env) est posée sans
# eux. Stripe → Produits → Tarification (price_…). Changer de tarif :
# remplacer l'identifiant ; l'ancien reste lié en base.
# STRIPE_PRICE_MONTHLY=
# STRIPE_PRICE_YEARLY=
# Identifiants produits RevenueCat (achats dans les magasins). Après tout
# changement : « carlysctl subscription-catalog staging ».
# REVENUECAT_PRODUCT_MONTHLY=
# REVENUECAT_PRODUCT_YEARLY=

# ── Coach IA sur le serveur ────────────────────────────────────────────────
# Qwen3-4B servi par Ollama (service `ollama` de compose.yml), gratuit et sans
# quota : les messages du coach ne quittent pas le serveur. Pas à pas :
# docs/deployment/mise-en-route-serveur.md, « Coach IA sur le serveur ».
# L'étiquette du modèle est EXACTE (la variante sans « réflexion ») ; ni clé
# ni https, l'adresse est interne au réseau compose.
CARLYS_OLLAMA_REPLICAS=1
COACH_API_BASE_URL=http://ollama:11434/v1
COACH_MODEL=qwen3:4b-instruct-2507-q4_K_M
# Le scan d'assiette (ADR 0015) : le modèle de VISION des mêmes workers.
# `ollama` le télécharge au déploiement qui le pose (≈ 3,3 Go, une fois).
COACH_VISION_MODEL=qwen3-vl:4b-instruct
# `2` garde coach et vision en mémoire, mais demande plus que les 6 Go de
# CARLYS_OLLAMA_MEM_LIMIT : à relever ensemble, si la machine le permet.
# CARLYS_OLLAMA_MAX_LOADED_MODELS=2

# ── Stockage objet ─────────────────────────────────────────────────────────
# Adresse PUBLIQUE : celle que le téléphone et le navigateur téléchargent,
# servie par nginx devant MinIO. En https://, jamais localhost
# (env.production.ts refuse les deux).
S3_PUBLIC_BASE_URL=https://media-staging.${DOMAIN}/carlys-media

# ── E-mails ────────────────────────────────────────────────────────────────
# Mailpit, sur le réseau compose : rien ne part vers de vraies boîtes, et
# l'interface se lit sur 127.0.0.1:8025 (tunnel SSH). SMTP_USER et
# SMTP_PASSWORD restent VIDES dans le .env : Mailpit n'authentifie rien.
SMTP_HOST=mailpit
SMTP_PORT=1025
SMTP_SECURE=false
EMAIL_FROM=Carlys (recette) <no-reply@staging.${DOMAIN}>

# Base des liens envoyés par e-mail et des retours Stripe : l'APPLICATION
# WEB, jamais l'API — elle sert /verify-email, /reset-password, /privacy,
# /terms et /abonnement (infrastructure/deployment/README.md).
PUBLIC_APP_URL=https://app-staging.${DOMAIN}
