# Carlys — configuration de la PRODUCTION : ce qui la distingue de la
# recette. Le reste est dans commun.conf ; les secrets, dans
# /srv/carlys/production/.env. Ordre de lecture et règles : en tête de
# commun.conf (ADR 0017).

# ═══════════════════════════════════════════════════════════════════════════
#  1. Pile compose
# ═══════════════════════════════════════════════════════════════════════════

# Isole conteneurs, réseau et volumes de ceux de la recette sur le même hôte.
COMPOSE_PROJECT_NAME=carlys_production
# AUCUN profil : Mailpit ne démarre pas ici, les e-mails partent par un vrai
# relais SMTP (plus bas).
COMPOSE_PROFILES=
CARLYS_ENV=production
# Chemin ABSOLU du .env (les secrets).
CARLYS_ENV_FILE=/srv/carlys/production/.env

# -prod : l'image admin de production est construite garde légale ARMÉE
# (LEGAL_PLACEHOLDERS=forbid). Tant qu'un marqueur [À COMPLÉTER : …] subsiste
# dans docs/legal/, cette image N'EXISTE PAS et le déploiement s'arrête.
# C'est le but ; ne desserrez jamais ce suffixe.
CARLYS_ADMIN_TAG_SUFFIX=-prod

# ── Ports publiés, sur la boucle locale UNIQUEMENT ─────────────────────────
# L'API en réserve une PLAGE, pas un port : elle tourne en plusieurs
# exemplaires et Docker attribue à chacun un port libre. 3000-3019 = vingt
# exemplaires possibles ; réserver large ne coûte rien. L'admin est donc à
# 3050. Élargir la plage n'autorise pas plus d'exemplaires : c'est
# CARLYS_API_REPLICAS (etat.env) qui décide, et carlysctl refuse un nombre
# que la plage ne contient pas.
CARLYS_API_HOST_PORT=3000
CARLYS_API_HOST_PORT_LAST=3019
CARLYS_ADMIN_HOST_PORT=3050
CARLYS_MINIO_HOST_PORT=9000

# ── Mise à jour automatique ────────────────────────────────────────────────
# `non` : RIEN ne part en production sans un geste humain. À `oui`, la
# production ne suit aucune branche : elle promeut le sha qui tourne DÉJÀ en
# recette, après qu'il y a passé la durée de maturation en restant sain. Les
# vérifications de promote.sh (image -prod, garde légale, santé, retour
# arrière) ne sont jamais court-circuitées.
CARLYS_AUTO_UPDATE=non
# CARLYS_PROMOTE_SOAK_MINUTES=60

# ── PostgreSQL ─────────────────────────────────────────────────────────────
POSTGRES_DB=carlys_production

# ── Redis ──────────────────────────────────────────────────────────────────
# Journal des écritures (AOF) sur le volume, pour survivre à un redémarrage.
CARLYS_REDIS_ARGS=--appendonly yes

# ── Mémoire ────────────────────────────────────────────────────────────────
# La production n'est PAS plafonnée par défaut : un plafond mal calibré la
# tuerait elle-même, et il se choisit en connaissant la RAM de l'hôte.
#
# Ce qui est posé : si la machine manque de mémoire malgré tout, -500 met la
# BASE de production hors de portée du noyau tant qu'un autre processus peut
# être sacrifié à sa place.
CARLYS_POSTGRES_OOM_SCORE_ADJ=-500
# Plafonds possibles, une fois la RAM de l'hôte connue (mesures : la recette).
# CARLYS_API_MEM_LIMIT=768m
# CARLYS_API_NODE_OPTIONS=--max-old-space-size=576
# CARLYS_MINIO_MEM_LIMIT=1g
# CARLYS_OLLAMA_MEM_LIMIT=6g

# ── PostgreSQL : la mémoire que le planificateur suppose ───────────────────
# Défauts de PostgreSQL tant que la RAM de l'hôte n'est pas connue (compose,
# service postgres). Une fois connue :
#   shared_buffers        ≈ 25 % de la RAM laissée à CETTE base
#   effective_cache_size  ≈ 50 à 75 % — jamais sous 4GB, le défaut
# CARLYS_POSTGRES_SHARED_BUFFERS=1GB
# CARLYS_POSTGRES_EFFECTIVE_CACHE_SIZE=6GB
# Disque ROTATIF (rare sur un serveur dédié actuel) : remettre le défaut 4.
# CARLYS_POSTGRES_RANDOM_PAGE_COST=4

# ═══════════════════════════════════════════════════════════════════════════
#  2. API
# ═══════════════════════════════════════════════════════════════════════════

# Origine du navigateur qui appelle l'API : l'application web, jamais l'API.
CORS_ORIGINS=https://app.${DOMAIN}
LOG_LEVEL=info

# ── Abonnements : le catalogue Stripe LIVE ─────────────────────────────────
# Sans les identifiants de tarif, un paiement aboutit chez Stripe mais
# n'accorde RIEN. Le déploiement (étape 6/8) refuse de basculer si
# STRIPE_SECRET_KEY (.env) est posée sans eux. Stripe (mode LIVE) → Produits
# → Tarification (price_…).
# STRIPE_PRICE_MONTHLY=
# STRIPE_PRICE_YEARLY=
# Identifiants produits RevenueCat, le jour où les magasins s'ouvrent ; après
# tout changement : « carlysctl subscription-catalog production ».
# REVENUECAT_PRODUCT_MONTHLY=
# REVENUECAT_PRODUCT_YEARLY=

# ── Coach IA sur le serveur ────────────────────────────────────────────────
# Éteint en production tant qu'il n'y a pas été essayé : les trois lignes se
# décommentent ENSEMBLE (même pas à pas qu'en recette,
# docs/deployment/mise-en-route-serveur.md, « Coach IA sur le serveur »).
# CARLYS_OLLAMA_REPLICAS=1
# COACH_API_BASE_URL=http://ollama:11434/v1
# COACH_MODEL=qwen3:4b-instruct-2507-q4_K_M
# Le scan d'assiette (ADR 0015), le modèle de vision des mêmes workers.
# COACH_VISION_MODEL=qwen3-vl:4b-instruct
# CARLYS_OLLAMA_MAX_LOADED_MODELS=2

# ── Stockage objet ─────────────────────────────────────────────────────────
# Adresse PUBLIQUE : celle que le téléphone et le navigateur téléchargent.
S3_PUBLIC_BASE_URL=https://media.${DOMAIN}/carlys-media

# ── E-mails ────────────────────────────────────────────────────────────────
# Un relais SMTP réel, authentifié (identifiant et mot de passe : .env). Son
# hôte, SMTP_HOST, reste dans le .env tant que le relais n'est pas choisi ;
# il viendra ici avec lui.
# `false` sur le 587 : c'est STARTTLS, négocié tout seul, PAS un envoi en
# clair. `true` seulement sur le 465, en TLS dès la connexion.
SMTP_PORT=587
SMTP_SECURE=false
# L'adresse doit appartenir au domaine, avec SPF/DKIM en place, sinon les
# messages de vérification d'adresse partent en indésirables.
EMAIL_FROM=Carlys <no-reply@${DOMAIN}>

# Base des liens envoyés par e-mail et des retours Stripe : l'APPLICATION
# WEB, jamais l'API. Les magasins d'applications exigent ${PUBLIC_APP_URL}/privacy.
PUBLIC_APP_URL=https://app.${DOMAIN}
