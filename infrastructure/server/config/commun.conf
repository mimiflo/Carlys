# Carlys — configuration du serveur, COMMUNE à la recette et à la production.
#
# Versionnée (ADR 0017) : AUCUN secret ici, jamais. Les mots de passe, clés et
# jetons vivent dans /srv/carlys/<env>/.env, sur le serveur seul.
#
# Lu dans cet ordre, la dernière valeur l'emportant :
#   1. commun.conf        ce fichier
#   2. <env>.conf         staging.conf ou production.conf : ce qui DIFFÈRE
#   3. etat.env           écrit par carlysctl (version déployée, exemplaires)
#   4. .env               les secrets
# Un réglage vit ICI ou dans un fichier d'environnement, jamais les deux (la
# CI le vérifie). Changer un réglage : un commit, puis un déploiement.
#
# Format `CLE=valeur`, celui que docker compose lit nativement :
#   • une variable FACULTATIVE se laisse COMMENTÉE, jamais vide : `CLE=`
#     arrive comme chaîne vide, que le schéma de l'API rejette ;
#   • `${AUTRE}` ne doit citer que ce qui est déjà chargé (plus haut, ou une
#     couche précédente) : Compose ne résout pas vers une couche suivante en
#     lisant compose.yml (l'API, elle, verrait tout — deux lectures qui
#     divergeraient). D'où les adresses qui portent un secret, au .env ;
#   • un `$` littéral s'écrit `$$`.
#
# Les variables de l'API sont celles de apps/api/src/config/env.schema.ts.

# ═══════════════════════════════════════════════════════════════════════════
#  1. Pile compose
# ═══════════════════════════════════════════════════════════════════════════

# ── Domaine ────────────────────────────────────────────────────────────────
# Le même pour les deux environnements : seuls les sous-domaines changent
# (api-staging. / app-staging. / media-staging. en recette, api. / app. /
# media. en production), et ils ne se paramètrent pas. Les URL publiques des
# fichiers d'environnement en dérivent. Le build de l'admin a son double
# dans GitHub (`vars.CARLYS_DOMAIN`) : les changer ensemble.
DOMAIN=carlys.app

# ── Images ─────────────────────────────────────────────────────────────────
CARLYS_REGISTRY=ghcr.io/mimiflo

# ── Orchestration : ce que « carlysctl » a le droit de faire ───────────────
# Sans effet tant que la minuterie de supervision n'est pas installée
# (docs/deployment/orchestration.md).
#
# MISE À L'ÉCHELLE. La cible est le PLUS GRAND des deux besoins — jamais leur
# somme : utilisateurs en ligne et débit mesurent la même charge de deux
# façons. Des points de départ, à régler sous charge réelle
# (« carlysctl status »).
# Plancher et plafond (CARLYS_SCALE_MIN, défaut 1 ; CARLYS_SCALE_MAX, défaut
# le nombre de cœurs borné par la plage de ports) : fixés PAR environnement,
# dans production.conf et staging.conf.
# CARLYS_SCALE_USERS_PER_REPLICA=250
# CARLYS_SCALE_RPS_PER_REPLICA=40
# La latence ne fixe pas la cible : elle ajoute UN cran.
# CARLYS_SCALE_LATENCY_HIGH_MS=750
# Délai de garde après tout changement, dans les deux sens.
# CARLYS_SCALE_COOLDOWN_SECONDS=300
# Passages d'accord exigés AVANT de retirer un exemplaire (un seul suffit pour
# en ajouter : se tromper en retirant coûte des erreurs servies).
# CARLYS_SCALE_DOWN_PATIENCE=3
# Avant d'être arrêté, un exemplaire en trop est retiré de l'amont Nginx et
# finit son travail (requêtes, réponses du coach, analyses de photo). Au-delà
# de ce délai, en secondes, la réduction est remise au passage suivant.
# CARLYS_SCALE_DRAIN_SECONDS=300
#
# DÉPLOIEMENT. Une fois l'amont passé sur les exemplaires neufs, les anciens
# finissent tout ce qu'on leur a confié — requêtes, réponses du coach,
# analyses de photo — au plus ce délai en secondes, puis sont arrêtés quand
# même. Même borne pour la bascule d'avant (relais impossible).
# Le relever use le budget de 20 min d'une passe de supervision (systemd).
# CARLYS_DEPLOY_DRAIN_SECONDS=120
#
# AUTO-RÉPARATION. Au-delà du plafond horaire, carlysctl ne répare plus et le
# DIT : une panne qui revient à chaque redémarrage ne se masque pas.
# CARLYS_HEAL_MAX_PER_HOUR=5
# CARLYS_HEAL_UNHEALTHY_PASSES=2
#
# DISQUE. Les images Carlys qu'aucune règle ne protège sont élaguées à chaque
# passe (jamais le sha déployé, jamais le précédent) ; au-delà de ce seuil
# APRÈS élagage, l'alerte part : ce ne sont plus les images.
# CARLYS_DISK_HIGH_PERCENT=80
#
# COMPLÉTION DU .env. `carlysctl env-sync` y ajoute les SECRETS introduits
# après sa création (jamais une ligne existante écrasée, aucun secret
# engendré sans --tout, sauf ceux marqués engendrer-auto). `non` pour
# reprendre la main.
# CARLYS_ENV_SYNC=oui

# ── Purge des comptes supprimés ────────────────────────────────────────────
# Un compte supprimé est effacé pour de bon, photos privées comprises, après
# ce nombre de jours (_purge_comptes.sh, une fois par jour). Commentée : 30,
# le délai qu'écrivent la politique de confidentialité (§6), les CGU (§9) et
# l'écran de suppression. La changer, c'est changer ces textes dans le même
# commit (liste dans SECURITY.md, « Suppression du compte à la demande »).
# CARLYS_ACCOUNT_PURGE_DAYS=30

# ── PostgreSQL ─────────────────────────────────────────────────────────────
# Le mot de passe, et l'URL de connexion qui le contient, sont dans le .env.
POSTGRES_USER=carlys

# ═══════════════════════════════════════════════════════════════════════════
#  2. API — apps/api/src/config/env.schema.ts
# ═══════════════════════════════════════════════════════════════════════════

# ── Exécution ──────────────────────────────────────────────────────────────
# `production` en recette AUSSI : c'est le mode d'exécution de Nest, pas le
# nom de l'environnement. Il arme les refus de env.production.ts (une valeur
# de développement restée en place fait refuser le démarrage) : la recette
# doit échouer comme la production, sinon elle ne prouve rien.
NODE_ENV=production
# Port INTERNE au conteneur. Celui de l'hôte est CARLYS_API_HOST_PORT.
PORT=3000
REDIS_URL=redis://redis:6379

# DEUX proxys devant l'API, donc 2 :
#   client ──HTTPS 443──> gra6.luuc.fr ──HTTP──> nginx de l'hôte ──> API
# MESURÉ sur la chaîne réelle : à 1, req.ip vaut l'adresse de gra6 pour TOUT
# le trafic (limitation de débit et audit aveugles) ; à 2, celle du client.
# Le compteur ne retire des entrées que par la DROITE : c'est gra6 qui doit
# ÉCRASER l'en-tête X-Forwarded-For (docs/security/reverse-proxy.md).
TRUST_PROXY_HOPS=2

# La limite GÉNÉRALE se compte par adresse IP. Or une salle de sport en
# wifi, ou un opérateur mobile derrière un CGNAT, met des dizaines de
# personnes derrière UNE adresse : à 100/min, une synchronisation hors ligne
# rattrapée en rafale suffisait à faire tomber des 429 sur tout le groupe.
# Les routes sensibles gardent leurs propres plafonds stricts (@Throttle).
RATE_LIMIT_TTL_SECONDS=60
RATE_LIMIT_MAX_REQUESTS=600

# Le pool de fils de libuv (4 par défaut) porte Argon2 (19 Mio, t=2), mais
# aussi le DNS de `fetch` et du client S3 : une rafale de connexions le
# saturait et faisait attendre le reste. Environ 19 Mio par hachage
# simultané.
UV_THREADPOOL_SIZE=8

# Sans effet sur un serveur : avec NODE_ENV=production, /api/docs n'est
# JAMAIS servi. Le consulter : `pnpm dev:api` sur un poste.
SWAGGER_ENABLED=false

# Fenêtre du compte « utilisateurs en ligne », en secondes : c'est l'ENTRÉE
# de la mise à l'échelle. Trop courte, la pile oscille ; trop longue, elle
# compte des gens partis. Laisser le défaut (300) sauf raison mesurée.
# PRESENCE_WINDOW_SECONDS=300

# ── Authentification ───────────────────────────────────────────────────────
# Les secrets (JWT_ACCESS_SECRET, LOG_FINGERPRINT_SECRET) sont dans le .env.
JWT_ACCESS_TTL_SECONDS=900
JWT_ISSUER=carlys-api
JWT_AUDIENCE=carlys-mobile
REFRESH_TOKEN_TTL_DAYS=30

AUTH_MAX_LOGIN_ATTEMPTS=5
AUTH_LOCKOUT_MINUTES=15

ARGON2_MEMORY_KIB=19456
ARGON2_TIME_COST=2
ARGON2_PARALLELISM=1

EMAIL_VERIFICATION_TTL_HOURS=24
PASSWORD_RESET_TTL_MINUTES=60

# Connexion sociale (Apple, Google) — FACULTATIVES, et PAS des secrets : des
# identifiants publics de clients OAuth. Sans elles, POST /api/v1/auth/social
# répond 503 (aucun jeton tiers vérifié contre une audience vide).
#   Google : console Google Cloud → Identifiants → ID clients OAuth (Android,
#            iOS, Web), séparés par des virgules.
#   Apple  : Service ID ou Bundle ID, selon la plateforme.
# Détail : docs/deployment/connexion-sociale.md. Un jeu propre à la recette
# se pose dans staging.conf (et la ligne d'ici se retire).
# Le client « Web » : celui de `vars.CARLYS_GOOGLE_SERVER_CLIENT_ID`, que les
# builds de recette ET de production embarquent — d'où commun.conf.
GOOGLE_OAUTH_CLIENT_IDS=322014092169-u00da544cjjngdida6m9o2un9sg0qmu0.apps.googleusercontent.com
# APPLE_OAUTH_AUDIENCES=

# ── Abonnements ────────────────────────────────────────────────────────────
# Affichage seul : c'est Stripe qui encaisse. Ces prix doivent refléter ceux
# du catalogue Stripe, sous peine d'afficher un tarif faux. Les clés et les
# secrets de webhook sont dans le .env ; les identifiants de tarif, propres à
# chaque catalogue, dans le fichier d'environnement.
SUBSCRIPTION_CURRENCY=EUR
SUBSCRIPTION_MONTHLY_CENTS=999
SUBSCRIPTION_YEARLY_CENTS=7990
SUBSCRIPTION_TRIAL_DAYS=7

# ── Coach IA ───────────────────────────────────────────────────────────────
# NOTRE modèle seul, par une API compatible OpenAI (ADR 0011, 0013) : le
# modèle et son adresse sont dans le fichier d'environnement, qui l'allume ou
# non. Sans fournisseur complet, le module répond 503 au lieu d'empêcher le
# démarrage.
COACH_DAILY_MESSAGE_LIMIT=30
COACH_ENABLED=true
# Passerelle du coach (ADR 0013) — défauts sûrs pour UNE machine sans carte
# graphique ; ne les décommenter que pour les changer. Capacité réelle :
# `carlysctl coach-bench <env>` la mesure.
# COACH_MAX_CONCURRENT_REQUESTS=1     # = somme des OLLAMA_NUM_PARALLEL des workers
# COACH_QUEUE_MAX_SIZE=20             # au-delà : « très sollicité », tout de suite
# COACH_QUEUE_TIMEOUT_MS=120000
# COACH_REQUEST_TIMEOUT_MS=600000
# COACH_STREAM_IDLE_TIMEOUT_MS=60000
# COACH_MAX_OUTPUT_TOKENS=2048
# COACH_MAX_CONTINUATIONS=2
# COACH_CONTEXT_TOKENS=8192
# COACH_MAX_CONCURRENT_PER_USER=1
# COACH_MESSAGES_PER_MINUTE=6
# COACH_MAX_MESSAGE_CHARS=2000
# COACH_HISTORY_MESSAGES=20
# Plusieurs workers (autres cartes, autres serveurs), séparés par des
# virgules ; absente, le seul worker est COACH_API_BASE_URL. Un worker HORS du
# réseau compose demande https:// et COACH_API_KEY (dans le .env).
# COACH_WORKER_URLS=http://ollama:11434/v1,https://gpu-2.carlys.example/v1
# COACH_WORKER_COOLDOWN_MS=30000
# Scan d'assiette (ADR 0015) : scans par personne et par jour.
# COACH_MEAL_SCANS_PER_DAY=10

# ── Stockage objet ─────────────────────────────────────────────────────────
# Adresse INTERNE : l'API dépose les fichiers par le réseau compose. Les
# identifiants (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY) sont dans le .env.
S3_ENDPOINT=http://minio:9000
S3_REGION=us-east-1
S3_BUCKET=carlys-media
# Bucket PRIVÉ : les photos jointes aux repas (données personnelles).
# minio-init le crée SANS politique d'accès et retire toute politique posée à
# la main ; nginx ne le sert pas. Jamais le même nom que S3_BUCKET (l'API
# refuse de démarrer), et PAS sauvegardé par backup.sh : une photo effacée
# l'est partout.
S3_PRIVATE_BUCKET=carlys-private
S3_FORCE_PATH_STYLE=true
MEDIA_MAX_UPLOAD_BYTES=20971520
