# Carlys — pile serveur (staging ET production).
#
# UN SEUL fichier pour les deux environnements : ce qui les distingue tient
# entièrement dans leur fichier `.env` (nom de projet, ports d'écoute sur la
# boucle locale, domaines, secrets, tag d'image). Deux fichiers jumeaux
# divergent au troisième correctif ; un seul ne le peut pas.
#
#   docker compose --env-file /srv/carlys/staging/.env \
#                  -f infrastructure/server/compose.yml up -d
#
# Ce fichier n'est PAS docker-compose.yml à la racine du dépôt : celui-là est
# l'environnement de DÉVELOPPEMENT local (ports ouverts sur l'hôte, secrets
# factices, images construites sur place). Ici les images viennent du registre
# — celles de l'application taguées par SHA, celles de MinIO par recette — et
# rien n'écoute ailleurs que sur 127.0.0.1.
#
# Les migrations ne tournent JAMAIS au démarrage d'un conteneur : le service
# `migrate` vit derrière un profil dédié et se lance en tâche ponctuelle AVANT
# la bascule du trafic (infrastructure/deployment/README.md).

# Isolation staging / production : COMPOSE_PROJECT_NAME (posé par le .env)
# préfixe conteneurs, réseau et volumes. La variable d'environnement l'emporte
# sur ce `name:` ; l'écrire ici sert de garde — sans elle, compose s'arrête au
# lieu de retomber sur le nom du répertoire et de mélanger les deux piles.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME est obligatoire - carlys_staging ou carlys_production}

# ── Réglages communs à tous les services ─────────────────────────────────────
# Les journaux json non bornés sont le mode de panne le plus banal d'un serveur
# dédié : ils remplissent le disque en silence, puis PostgreSQL ne peut plus
# écrire. 10 Mo × 5 par conteneur plafonnent la casse à ~50 Mo chacun.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-labels: &labels
  com.carlys.environment: ${CARLYS_ENV:?CARLYS_ENV est obligatoire - staging ou production}

# Services de longue durée : ils reviennent après un reboot de l'hôte, mais
# jamais après un `docker compose stop` volontaire.
x-service: &service
  restart: unless-stopped
  logging: *logging
  labels: *labels

# ── Mémoire : des PLAFONDS, réglés par environnement ─────────────────────────
#
# Recette et production partagent CET hôte, et la recette suit chaque poussée
# — sa maturation d'une heure existe précisément pour révéler une fuite de
# mémoire (_update.sh). Sans plafond, une fuite de recette, ou un Redis de
# recette qui grossit sans `maxmemory`, prenait la mémoire de la machine
# entière : la production se dégradait pour un commit qu'elle n'avait jamais
# reçu (audit du 25/09). Chaque service porte donc un `mem_limit` lu dans le
# .env de SON environnement :
#
#   - la RECETTE est plafonnée (valeurs de staging.env.example, justifiées
#     là-bas) : c'est elle qui essuie les plâtres, c'est elle qu'on borne ;
#   - la PRODUCTION n'a pas de plafond par défaut (`0` : aucun), mais son
#     PostgreSQL porte `oom_score_adj` négatif (production.env.example) : si
#     la machine manque de mémoire malgré tout, le noyau choisit un autre
#     processus que la base. Un plafond de production mal calibré tuerait la
#     production elle-même — il se pose en connaissance de la RAM de l'hôte.
#
# Un conteneur qui dépasse son plafond est tué et relancé par `restart:` — ce
# qui se voit (`carlysctl status`), là où une machine qui swappe dégrade tout
# sans rien dire.

# Tâches ponctuelles : elles se terminent, on ne les relance pas.
x-task: &task
  restart: 'no'
  logging: *logging
  labels: *labels

# Le fichier .env de l'environnement, désigné par CHEMIN ABSOLU depuis
# lui-même. `env_file` se résout sinon relativement au répertoire du projet
# compose, donc au dépôt — alors que le .env vit dans /srv/carlys/<env>/.
# Cette indirection rend l'appel indépendant du répertoire courant.
x-env-file: &env-file
  - ${CARLYS_ENV_FILE:?CARLYS_ENV_FILE doit contenir le chemin absolu du .env de cet environnement}

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    <<: *service
    image: ${CARLYS_POSTGRES_IMAGE:-postgres:17-alpine}
    mem_limit: ${CARLYS_POSTGRES_MEM_LIMIT:-0}
    oom_score_adj: ${CARLYS_POSTGRES_OOM_SCORE_ADJ:-0}
    # ── Réglages du planificateur, et pourquoi CES valeurs ─────────────────
    #
    # Le service tournait aux défauts de PostgreSQL, pensés pour un disque
    # ROTATIF. Mesuré par l'audit du 25/09 sur un jeu à l'échelle visée
    # (10 000 comptes, ~200 000 séances) : avec random_page_cost=4, les
    # jointures séance-séries d'UN utilisateur prenaient un Gather + Parallel
    # Seq Scan sur WorkoutSession (3 processus, ~3,5 fois plus de pages lues)
    # alors que WorkoutSession_userId_startedAt_idx convient exactement.
    # Avec 1.1 : Bitmap Index Scan, totaux annuels 15,5-19,2 ms → 4,3-4,5 ms,
    # recalcul des records à la clôture 17,5 → 7,2 ms, et plus aucun worker
    # parallèle occupé. Sans effet sur les requêtes déjà indexées.
    #
    #   random_page_cost = 1.1   — lecture aléatoire à peine plus chère que
    #     séquentielle : c'est un SSD/NVMe, le disque de tout serveur dédié
    #     actuel. La documentation de PostgreSQL le conseille pour le SSD. Sur
    #     un disque rotatif, remettre 4 dans le .env.
    #   effective_io_concurrency = 200 — lectures anticipées en parallèle des
    #     Bitmap Heap Scan, justement le plan que la valeur précédente fait
    #     choisir ; 200 est la valeur d'usage pour un SSD (le défaut, 1,
    #     suppose une seule tête de lecture).
    #   shared_buffers, effective_cache_size — LAISSÉS aux défauts de
    #     PostgreSQL (128MB, 4GB) tant que la RAM de l'hôte n'est pas connue :
    #     deux instances (recette, production) se la partagent, et un
    #     effective_cache_size SOUS 4GB pousserait au contraire le
    #     planificateur vers les balayages. À poser dans le .env de
    #     production une fois l'hôte connu : shared_buffers ≈ 25 % de la RAM
    #     laissée à cette base, effective_cache_size ≈ 50 à 75 %.
    #
    # max_connections reste à 100 : les pools Prisma sont bornés en
    # conséquence (DATABASE_URL, connection_limit=10 — voir les .env).
    command:
      - postgres
      - -c
      - random_page_cost=${CARLYS_POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${CARLYS_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - shared_buffers=${CARLYS_POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${CARLYS_POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est obligatoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est obligatoire}
      # TZ ET PGTZ, les deux, et ce n'est pas décoratif : un audit du schéma a
      # relevé que les 99 colonnes DateTime sont des TIMESTAMP(3) SANS fuseau.
      # « Les dates sont stockées en UTC » (CLAUDE.md) ne tient donc qu'au
      # fuseau du serveur et de la session : une image démarrée sur un hôte en
      # Europe/Paris décalerait NOW() et les valeurs par défaut de deux heures,
      # sans qu'aucune requête ne s'en plaigne. TZ règle l'horloge du
      # conteneur, PGTZ le fuseau des sessions clientes ouvertes par le serveur.
      TZ: UTC
      PGTZ: UTC
    # Aucun port publié : PostgreSQL n'est joignable que depuis le réseau
    # compose de SON environnement. Une sauvegarde passe par
    # `docker compose exec postgres pg_dump`, jamais par un port hôte.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    <<: *service
    image: ${CARLYS_REDIS_IMAGE:-redis:7-alpine}
    # Plafond du CONTENEUR ; celui de Redis lui-même est `--maxmemory`, dans
    # CARLYS_REDIS_MEMOIRE_ARGS, et doit rester en dessous (staging.env.example).
    # Une clé à part de CARLYS_REDIS_ARGS, et c'est ce qui la fait ARRIVER :
    # `carlysctl env-sync` ajoute une clé nouvelle au .env d'un serveur en
    # service, il ne réécrit jamais une clé existante.
    mem_limit: ${CARLYS_REDIS_MEM_LIMIT:-0}
    # La persistance est un choix d'environnement, pas de fichier : staging est
    # un cache jetable (`--save "" --appendonly no`), production journalise
    # (`--appendonly yes`). CARLYS_REDIS_ARGS est découpé par compose comme une
    # ligne de commande, guillemets compris.
    command: redis-server ${CARLYS_REDIS_ARGS:?CARLYS_REDIS_ARGS est obligatoire - voir le .env} ${CARLYS_REDIS_MEMOIRE_ARGS:-}
    environment:
      TZ: UTC
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Stockage objet ─────────────────────────────────────────────────────────
  # Publié sur la boucle locale parce que nginx sert media.DOMAIN devant lui :
  # les applications chargent les photos directement, sans traverser l'API.
  #
  # POURQUOI NOS PROPRES IMAGES. Les images officielles ont DISPARU de Docker
  # Hub (MinIO a cessé de distribuer son édition communautaire), puis quay.io,
  # où l'on s'était replié, a cessé de les servir à son tour (24 septembre
  # 2026) : un serveur neuf n'avait plus rien à tirer. MinIO et mc sont
  # désormais construits depuis leurs sources (infrastructure/minio/, mêmes
  # versions qu'avant) et publiés par images-publish dans le registre de
  # l'application — tirés avec le même jeton que l'API et l'admin.
  #
  # L'étiquette n'est PAS `sha-…` : `<version>-<empreinte de la recette>`,
  # immuable, indépendante du sha déployé — un retour arrière ne touche donc
  # jamais à MinIO. `sh infrastructure/minio/construire.sh etiquettes` la
  # calcule, et images-ci refuse un commit où ces deux valeurs par défaut ne
  # suivent pas la recette. CARLYS_MINIO_IMAGE et CARLYS_MC_IMAGE (.env)
  # restent là pour pointer ailleurs sans toucher à ce fichier.
  minio:
    <<: *service
    mem_limit: ${CARLYS_MINIO_MEM_LIMIT:-0}
    image: ${CARLYS_MINIO_IMAGE:-${CARLYS_REGISTRY}/carlys-minio:RELEASE.2025-09-07T16-13-09Z-c93713c5770d}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER est obligatoire}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD est obligatoire}
      TZ: UTC
    ports:
      # La console d'administration (9001) n'est PAS publiée : elle n'a rien à
      # faire face à internet, et un tunnel SSH suffit pour l'atteindre.
      - '127.0.0.1:${CARLYS_MINIO_HOST_PORT:?CARLYS_MINIO_HOST_PORT est obligatoire}:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Crée le bucket au premier démarrage et le rend lisible en anonyme : les
  # applications chargent les médias sans jeton, seul le DÉPÔT est protégé.
  # Idempotent (`mb --ignore-existing`), donc rejouable à chaque déploiement.
  #
  # Crée AUSSI le bucket PRIVÉ (S3_PRIVATE_BUCKET) : les photos que les
  # personnes joignent à leurs repas, données personnelles. Aucune lecture
  # anonyme — et `mc anonymous set none` à CHAQUE déploiement retire toute
  # politique qu'une commande tapée à la main y aurait posée. Un préfixe dans
  # le bucket public n'aurait pas suffi : sa politique vaut pour tout le
  # bucket, une clé devinée ou divulguée aurait suffi à lire une photo. nginx,
  # de son côté, ne sert que le préfixe du bucket public (media.DOMAIN).
  # L'API, au démarrage, journalise en ERREUR toute politique trouvée sur ce
  # bucket (PrivateBucketCheck).
  minio-init:
    <<: *task
    image: ${CARLYS_MC_IMAGE:-${CARLYS_REGISTRY}/carlys-mc:RELEASE.2025-08-13T08-35-41Z-c93713c5770d}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: UTC
    # `$$` échappe le `$` pour compose : la substitution est faite par le shell
    # DU CONTENEUR, à partir de son environnement — les identifiants ne sont
    # donc pas figés dans la ligne de commande du service.
    #
    # POURQUOI UNE POLITIQUE ÉCRITE À LA MAIN, ET PAS `mc anonymous set download`.
    # Le raccourci `download` n'accorde PAS que la lecture d'objet : mesuré, il
    # pose aussi `s3:ListBucket` sur le bucket lui-même. Un tiers sans aucun
    # jeton obtient alors 200 et l'inventaire complet des clés sur
    #   GET https://media.<domaine>/<bucket>/?list-type=2
    # — chaque média déposé par l'administration, y compris ceux préparés pour
    # une fonctionnalité non encore publiée. Rien n'a besoin de cette
    # permission : l'API parle à MinIO avec ses identifiants, et les clients
    # ne chargent que des URL exactes. La politique ci-dessous n'accorde donc
    # que `s3:GetObject` sur le CONTENU du bucket. Vérifié après changement :
    # la liste rend 403 AccessDenied, un objet précis rend toujours 200.
    entrypoint: >
      /bin/sh -c "
      set -e &&
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/${S3_BUCKET:?S3_BUCKET est obligatoire} &&
      printf '%s'
      '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::${S3_BUCKET}/*\"]}]}'
      > /tmp/politique.json &&
      mc anonymous set-json /tmp/politique.json local/${S3_BUCKET} &&
      mc mb --ignore-existing local/${S3_PRIVATE_BUCKET:?S3_PRIVATE_BUCKET est obligatoire - carlysctl env-sync <env> --appliquer} &&
      mc anonymous set none local/${S3_PRIVATE_BUCKET}
      "

  # ── Mailpit (staging UNIQUEMENT) ───────────────────────────────────────────
  # Profil « staging » : la production envoie ses e-mails par un vrai relais
  # SMTP, et un `docker compose up -d` en production ne démarre pas ce service.
  # Le port SMTP (1025) n'est pas publié — seule l'API le joint, par le réseau
  # compose. Seule l'interface web l'est, sur la boucle locale.
  mailpit:
    <<: *service
    profiles: ['staging']
    image: ${CARLYS_MAILPIT_IMAGE:-axllent/mailpit:v1.31.1}
    environment:
      TZ: UTC
    ports:
      - '127.0.0.1:${CARLYS_MAILPIT_UI_HOST_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/livez']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Coach IA sur le serveur (facultatif) ───────────────────────────────────
  # Qwen3-4B servi par Ollama (décision du 29/09/2026, ADR 0011) : les
  # messages du coach ne quittent plus le serveur, et aucun fournisseur ne
  # rationne plus les réponses.
  #
  # ÉTEINT par défaut, et PAS SEULEMENT « à zéro exemplaire » : sous le profil
  # `ollama`, que `dc` (scripts/server/_common.sh) n'active que si le .env
  # porte CARLYS_OLLAMA_REPLICAS=1. Un service hors profil n'existe pas pour
  # Compose ; à zéro exemplaire, il existait assez pour que `up -d` tire son
  # image (≈ 3,75 Go compressés) sur chaque serveur.
  #
  # Aucun port publié : seule l'API lui parle, par le réseau compose
  # (http://ollama:11434/v1). Le modèle (COACH_MODEL, étiquette EXACTE, ≈ 2,5
  # Go) n'est téléchargé que s'il manque au volume `ollama-data` : une
  # étiquette qui bougerait en amont ne change pas le modèle en service dans
  # notre dos. Un téléchargement raté arrête le conteneur (sortie 1) : Docker
  # le relance, la supervision le voit et le compte, au lieu d'une boucle
  # silencieuse.
  #
  # Le modèle est PRÉCHARGÉ dès le démarrage (`ollama run <modèle> ""`, la
  # méthode de la FAQ d'Ollama), en arrière-plan : sans cela, la première
  # question après un redémarrage attendait en plus le chargement des 2,5 Go
  # en mémoire, dans l'échéance du tour. OLLAMA_KEEP_ALIVE=-1 l'y garde ensuite.
  ollama:
    <<: *service
    profiles: ['ollama']
    image: ${CARLYS_OLLAMA_IMAGE:-ollama/ollama:0.34.4}
    deploy:
      replicas: ${CARLYS_OLLAMA_REPLICAS:-0}
    mem_limit: ${CARLYS_OLLAMA_MEM_LIMIT:-0}
    # Priorité RELATIVE (1024 par défaut pour les autres) : sur un processeur,
    # une réponse occupe tous les cœurs jusqu'à 3 min ; l'API et PostgreSQL,
    # de recette comme de production, passent devant quand ils en ont besoin,
    # et Ollama prend le reste. Pas de `cpus` fixe : il échouerait sur une
    # machine qui a moins de cœurs que la valeur écrite.
    cpu_shares: 256
    environment:
      TZ: UTC
      CARLYS_OLLAMA_MODEL: ${COACH_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      # Gardé en mémoire : sans cela Ollama décharge le modèle après cinq
      # minutes, et la réponse suivante paie des secondes de rechargement.
      OLLAMA_KEEP_ALIVE: '-1'
      # Consignes et outils (≈ 3 000 jetons), historique, résultats d'outils :
      # un contexte trop court les tronquerait EN SILENCE.
      OLLAMA_CONTEXT_LENGTH: ${CARLYS_OLLAMA_CONTEXT_LENGTH:-8192}
      # Une réponse à la fois : sur un processeur, deux en parallèle vont
      # chacune deux fois moins vite, et le préfixe commun des consignes
      # n'est gardé en cache que pour une seule file.
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        ollama serve & pid=$$!;
        trap 'kill $$pid; wait $$pid; exit 143' TERM INT;
        until ollama list >/dev/null 2>&1; do kill -0 $$pid || exit 1; sleep 1; done;
        ollama show "$$CARLYS_OLLAMA_MODEL" >/dev/null 2>&1
        || ollama pull "$$CARLYS_OLLAMA_MODEL"
        || { echo "Modèle $$CARLYS_OLLAMA_MODEL introuvable ou non téléchargé"; kill $$pid; exit 1; };
        { ollama run "$$CARLYS_OLLAMA_MODEL" "" </dev/null >/dev/null 2>&1
        || echo "Préchargement manqué : le modèle se chargera à la première question"; } &
        wait $$pid
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # Le serveur répond. Le modèle, lui, est garanti par la commande : sans
      # lui, le conteneur ne reste pas debout.
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 3
      # Le serveur répond en quelques secondes, et la sonde passe pendant le
      # téléchargement : celui-ci ne dépend que de la commande.
      start_period: 60s

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    <<: *service
    image: ${CARLYS_REGISTRY:?CARLYS_REGISTRY est obligatoire}/carlys-api:${CARLYS_TAG:?CARLYS_TAG est obligatoire - sha-xxxxxxxxxxxx}
    # Le .env EST la configuration de l'API : toutes les variables du schéma
    # Zod y figurent (le nombre ne s'écrit pas ici : il écrivait 49 quand le
    # schéma en comptait déjà 57). Les passer en bloc plutôt qu'une à une évite la dérive silencieuse
    # du jour où le schéma Zod en gagne une de plus. Corollaire à connaître :
    # une variable FACULTATIVE laissée VIDE dans le .env arrive comme chaîne
    # vide et fait échouer la validation — elle doit rester COMMENTÉE.
    env_file: *env-file
    environment:
      # Le processus Node date ses journaux et ses jetons : même exigence UTC
      # que PostgreSQL.
      TZ: UTC
      # Le tas de V8 borné SOUS le plafond du conteneur : une fuite finit en
      # « heap out of memory » — un arrêt net, journalisé, relancé — plutôt
      # qu'en processus tué par le noyau sans un mot. Vide : défaut de Node.
      NODE_OPTIONS: ${CARLYS_API_NODE_OPTIONS:-}
    # PAR EXEMPLAIRE : N exemplaires, N plafonds.
    mem_limit: ${CARLYS_API_MEM_LIMIT:-0}
    # ── Plusieurs exemplaires de l'API ────────────────────────────────────
    #
    # `deploy.replicas` — et NON `docker compose up --scale` : le nombre doit
    # survivre à un `up -d` ordinaire. Avec --scale, tout déploiement, tout
    # redémarrage, toute commande tapée sans y penser ramènerait la pile à un
    # seul exemplaire, sans rien dire. Ici le nombre vit dans le .env de
    # l'environnement : c'est un état, pas un argument de ligne de commande.
    #
    # (Ce champ est bien lu par Compose v2 et suivants hors Swarm : mesuré,
    # `up -d` crée, ajoute et retire les exemplaires en conséquence.)
    deploy:
      replicas: ${CARLYS_API_REPLICAS:-1}
    ports:
      # UNE PLAGE, pas un port. Docker ne peut pas publier N exemplaires sur
      # le même port de l'hôte ; il attribue à chacun un port LIBRE de la
      # plage, et rien ne garantit qu'ils soient contigus ni dans l'ordre
      # (mesuré : à quatre exemplaires sur 3400-3409, l'attribution était
      # 3403, 3404, 3406, 3407). Personne ne peut donc DEVINER où écoute un
      # exemplaire : nginx apprend la liste de `carlysctl`, qui la lit chez
      # Docker et régénère l'amont.
      #
      # Demander plus d'exemplaires que la plage n'a de ports échoue en cours
      # de route — « all ports are allocated » — et laisse la pile à moitié
      # mise à l'échelle. `carlysctl` refuse donc AVANT d'appeler Compose.
      #
      # 127.0.0.1 uniquement : nginx, sur l'hôte, est le seul à parler à
      # l'API. Sans ce préfixe, Docker ouvrirait les ports sur TOUTES les
      # interfaces en écrivant directement dans netfilter — ufw ne les verrait
      # même pas.
      - '127.0.0.1:${CARLYS_API_HOST_PORT:?CARLYS_API_HOST_PORT est obligatoire}-${CARLYS_API_HOST_PORT_LAST:?CARLYS_API_HOST_PORT_LAST est obligatoire - dernier port de la plage reservee a lAPI (ex 3019 pour un premier port a 3000). Ajouter la ligne au .env de lenvironnement}:${PORT:?PORT est obligatoire}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # `service_completed_successfully`, et c'est ce qui rend l'échec de
      # `minio-init` VISIBLE. Sans personne pour en dépendre, la tâche pouvait
      # sortir en erreur — bucket au nom invalide, identifiants MinIO faux —
      # sans que `up -d` rende autre chose que 0 : le déploiement se déclarait
      # réussi, et l'API partait déposer ses médias dans un bucket qui
      # n'existe pas. Ici l'API attend que les deux buckets soient créés, la
      # lecture anonyme posée sur celui des médias et RETIRÉE de celui des
      # données privées ; si la tâche échoue, `up -d` échoue avec elle.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready, pas /health/live : l'image embarque le second (le
      # processus répond), on veut ici le premier (PostgreSQL et Redis sont
      # réellement joignables). C'est ce que nginx et deploy.sh interrogent.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:${PORT:?PORT est obligatoire}/health/ready || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Application web (back-office + pages publiques) ───────────────────────
  admin:
    <<: *service
    # Deux images pour un même SHA : `sha-…` en recette, `sha-…-prod` en
    # production, cette dernière construite garde légale ARMÉE
    # (LEGAL_PLACEHOLDERS=forbid). Le suffixe est porté par le .env.
    #
    # `?` et non `-`, et la nuance décide de ce que voit un utilisateur de
    # production. `${…-}` signifie « si la variable est absente, chaîne
    # vide » : le jour où cette ligne disparaît du .env de production —
    # édition à la main, copie partielle, faute de frappe sur le nom — compose
    # résoudrait SANS BRUIT l'image de recette, celle dont la garde légale est
    # desserrée, et la production servirait ses mentions légales à trous sans
    # qu'aucune alarme ne sonne. `?` exige que la variable soit DÉCLARÉE tout
    # en acceptant qu'elle soit VIDE : la recette garde sa ligne vide, la
    # production son `-prod`, et une ligne manquante arrête le déploiement au
    # lieu de le laisser réussir de travers.
    image: ${CARLYS_REGISTRY}/carlys-admin:${CARLYS_TAG:?CARLYS_TAG est obligatoire - sha-xxxxxxxxxxxx}${CARLYS_ADMIN_TAG_SUFFIX?CARLYS_ADMIN_TAG_SUFFIX doit etre DECLAREE (vide en recette, -prod en production) - absente, la production perdrait sa garde legale en silence}
    # PAS d'env_file ici : le .env fixe PORT=3000 pour l'API, alors que l'image
    # admin écoute sur 3001. Et elle n'a rien à lire au démarrage —
    # NEXT_PUBLIC_API_BASE_URL est figé À LA CONSTRUCTION de l'image.
    environment:
      TZ: UTC
    mem_limit: ${CARLYS_ADMIN_MEM_LIMIT:-0}
    ports:
      - '127.0.0.1:${CARLYS_ADMIN_HOST_PORT:?CARLYS_ADMIN_HOST_PORT est obligatoire}:3001'
    # Aucun depends_on : ni PostgreSQL ni Redis (elle n'y touche pas), ni même
    # l'API — les pages publiques l'appellent depuis le NAVIGATEUR. La faire
    # attendre n'avancerait rien et retarderait /privacy et /terms, qui sont
    # statiques.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Migrations : tâche ponctuelle, JAMAIS un service démarré ───────────────
  # Sous profil `migrate`, donc absent de tout `docker compose up -d` : un
  # redémarrage ou une montée en charge ne doit pas toucher au schéma.
  # deploy.sh la lance AVANT la bascule, et un code de sortie non nul arrête
  # le déploiement :
  #
  #   docker compose --env-file <.env> -f compose.yml \
  #     run --rm migrate                 # (`run` active le profil tout seul)
  #
  # Sans --no-deps : le depends_on ci-dessous fait attendre que PostgreSQL soit
  # SAIN avant d'appliquer quoi que ce soit, y compris sur une pile encore
  # éteinte.
  #
  # La déclarer ici plutôt que de laisser deploy.sh bricoler un `docker run`
  # lui évite de recopier réseau, DATABASE_URL et attente de PostgreSQL — donc
  # d'inventer une seconde vérité sur la façon de joindre la base.
  migrate:
    <<: *task
    profiles: ['migrate']
    image: ${CARLYS_REGISTRY}/carlys-api-migrate:${CARLYS_TAG:?CARLYS_TAG est obligatoire - sha-xxxxxxxxxxxx}
    env_file: *env-file
    environment:
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

# Compose préfixe chaque volume par COMPOSE_PROJECT_NAME : les deux
# environnements cohabitent sur le serveur sans jamais se voir
# (carlys_staging_postgres-data et carlys_production_postgres-data).
volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
