# Carlys — le format du journal d'accès, SANS les jetons des liens d'e-mail.
#
# Installé en /etc/nginx/conf.d/carlys-journal.conf — par setup.sh, et à
# recopier après toute modification de ce fichier (un `git pull` ne le
# réinstalle pas) :
#   sudo cp infrastructure/nginx/conf.d/carlys-journal.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le nginx.conf de Debian et d'Ubuntu inclut conf.d/*.conf DANS le bloc `http`,
# AVANT sites-enabled : c'est le seul endroit possible, `map` et `log_format`
# n'existent qu'au niveau `http`. Les poser dans les vhosts ne marcherait pas :
# recette et production sont deux fichiers inclus dans le MÊME bloc `http`, et
# nginx refuse deux `log_format` du même nom. Sans ce fichier, `nginx -t`
# échoue franchement sur « unknown log format "carlys_sans_jeton" » — jamais un
# journal qui repartirait en douce au format complet.
#
# ── Le défaut que ceci répare ────────────────────────────────────────────────
#
# Les liens de vérification d'adresse et de réinitialisation de mot de passe
# portent leur jeton dans la chaîne de requête :
#   https://app.<domaine>/reset-password?token=<jeton>
#   (apps/api/src/infrastructure/email/email.service.ts)
# Le format `combined` par défaut journalise la requête ENTIÈRE, et l'en-tête
# Referer des requêtes que la page déclenche ensuite (feuilles de style,
# images, requêtes RSC de Next.js vers le même hôte). Chaque ouverture d'un
# lien écrivait donc un jeton de réinitialisation VALABLE — 60 minutes — dans
# /var/log/nginx/access.log, lisible par quiconque consulte ce journal (le
# guide connexion-sociale.md y envoie l'exploitant). La politique de
# confidentialité affirme au contraire qu'aucun jeton n'y figure.
#
# ── Ce que fait ce format ────────────────────────────────────────────────────
#
# Identique à `combined`, à deux champs près : la requête et le Referer, où la
# VALEUR de tout paramètre `…token=` est remplacée par « *** » (ASCII : nginx
# échappe en \xNN tout octet non ASCII d'une variable journalisée). Le reste
# de la ligne — chemin, autres paramètres, statut, taille — reste lisible pour
# le diagnostic. Seul le JOURNAL est touché : la requête transmise à
# l'application, elle, garde son jeton, et les liens marchent.
#
# Toute la famille `…token=` (token, access_token, reset_token…), sur tout
# chemin : un jeton n'a sa place dans aucun journal, et une règle limitée aux
# deux pages actuelles serait muette le jour où un troisième lien en porterait
# un. Le premier paramètre de ce nom seulement : aucune URL de Carlys n'en
# porte deux.
#
# ── Et le journal d'ERREURS ──────────────────────────────────────────────────
#
# Il n'a pas de format : nginx y recopie la ligne de requête brute à chaque
# erreur de l'amont (502, 504). Ce fichier n'y peut rien ; ce sont les vhosts
# `app` qui en retirent les deux pages à jeton (location
# `^/(verify-email|reset-password)`, `error_log … emerg`), et
# tests/nginx_test.sh qui le vérifie, amont tombé.

map $request_uri $carlys_requete_journal {
    default $request_uri;
    "~^(.*[?&][A-Za-z_]*token=)[^&]*(.*)$" "$1***$2";
}

map $http_referer $carlys_referent_journal {
    default $http_referer;
    "~^(.*[?&][A-Za-z_]*token=)[^&]*(.*)$" "$1***$2";
}

log_format carlys_sans_jeton '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $carlys_requete_journal $server_protocol" '
                             '$status $body_bytes_sent '
                             '"$carlys_referent_journal" "$http_user_agent"';
