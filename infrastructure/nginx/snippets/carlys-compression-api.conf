# Compression des réponses JSON de l'API — inclus dans les deux vhosts `api`.
#
# Installé en /etc/nginx/snippets/carlys-compression-api.conf, à côté de
# carlys-proxy.conf :
#   sudo cp infrastructure/nginx/snippets/*.conf /etc/nginx/snippets/
#
# ── Le défaut que ceci répare ────────────────────────────────────────────────
#
# L'API n'a aucun middleware de compression, et le nginx.conf d'Ubuntu n'a
# que `gzip on;` avec `gzip_types` commenté : seul text/html était compressé.
# Chaque écran chargeait donc son JSON BRUT sur le réseau cellulaire, alors
# que le client Dart annonce `Accept-Encoding: gzip` et décompresse seul.
# Mesuré par l'audit du 25/09 sur les réponses du compte principal : 11
# routes chaudes, 173 016 → 24 826 octets (×7) ; friend-challenges ×13,8,
# exercises?limit=50 ×6,9, records ×4,6. Compresser ICI plutôt que dans
# l'API : un seul endroit pour tous les exemplaires, et le processus Node
# garde son temps processeur pour les requêtes.
#
# ── Chaque valeur, et pourquoi ───────────────────────────────────────────────
#
# gzip_types application/json — le type de TOUTES les réponses de l'API
#   (enveloppes { data, meta, requestId } et { error }). text/html, lui, est
#   toujours compressé dès que `gzip on` : inutile de le nommer.
# gzip_min_length 1024 — sous ~1 Ko, l'en-tête gzip et le temps de
#   compression coûtent plus que ce qu'ils font gagner ; les petites
#   enveloppes (santé, 204, erreurs) partent telles quelles.
# gzip_comp_level 5 — le coude de la courbe. Mesuré le 25/09 sur une page de
#   50 exercices du vrai catalogue (catalog-data.ts), 31 906 octets bruts,
#   zlib, moyenne de 200 compressions :
#     niveau 1 : 8 610 octets (×3,7)   359 µs
#     niveau 5 : 6 947 octets (×4,6)   692 µs
#     niveau 6 : 6 806 octets (×4,7)   804 µs
#     niveau 9 : 6 780 octets (×4,7) 1 086 µs
#   Le niveau 5 est à 2,5 % de la taille du niveau 9 pour 64 % de son temps ;
#   le défaut de nginx, 1, laisse 24 % d'octets de plus sur le réseau.
# gzip_proxied any — TOUTES les requêtes arrivent par le proxy réseau (gra6) ;
#   s'il pose un en-tête `Via`, la valeur par défaut `off` couperait la
#   compression de tout ce qui passe par lui, c'est-à-dire de tout.
# gzip_vary on — `Vary: Accept-Encoding` : un cache intermédiaire garde une
#   variante compressée et une brute, sans servir l'une à qui attend l'autre.
# gzip_http_version 1.0 — un nginx en amont (gra6) relaie par défaut en
#   HTTP/1.0 (`proxy_http_version` vaut 1.0) ; avec le défaut 1.1, CE nginx
#   ne compresserait RIEN de ce qu'il reçoit par lui. Vérifier après
#   installation, À TRAVERS gra6 et pas en local :
#     curl -sI -H 'Accept-Encoding: gzip' https://api.<domaine>/api/v1/exercises?limit=50
#   doit rendre `Content-Encoding: gzip`. (Si gra6 compresse déjà, rien ne
#   change : nginx ne recompresse pas une réponse déjà encodée.)
#
# BREACH : les réponses d'authentification — jetons d'accès et de
# renouvellement, à côté d'une adresse e-mail saisie par le client — ne sont
# PAS compressées (`gzip off` dans leurs `location` des vhosts). L'attaque
# suppose de faire émettre des requêtes à la victime et d'en mesurer la
# taille chiffrée ; peu praticable contre une API à jeton porteur, mais ces
# réponses sont petites : n'y rien gagner coûte moins que d'y parier.
gzip on;
gzip_types application/json;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;
gzip_http_version 1.0;
