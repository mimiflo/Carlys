# En-têtes de proxy communs aux vhosts Carlys qui parlent à l'API ou à l'admin.
#
# Installé en /etc/nginx/snippets/carlys-proxy.conf, il s'inclut par
#   include snippets/carlys-proxy.conf;
# (les chemins d'`include` sont relatifs au préfixe de Nginx, /etc/nginx).
#
# Pourquoi un fichier partagé plutôt que six recopies : il y a SIX vhosts
# (api, app, media × production, recette) et ces en-têtes doivent rester
# identiques partout. Une recopie qui dérive, et c'est l'adresse du client que
# l'API perd — silencieusement, jusqu'au jour où la limitation de débit
# compte tout le monde comme une seule personne.
#
# ── La chaîne réelle : DEUX proxys, donc TRUST_PROXY_HOPS=2 ──────────────────
#
#   client ──HTTPS 443──> gra6.luuc.fr ──HTTP──> ce Nginx ──> Express (API)
#                          ^ termine le TLS      ^ 172.16.0.158:80
#
# `$proxy_add_x_forwarded_for` ajoute `$remote_addr` À LA FIN de l'en-tête
# reçu : ce Nginx écrit donc l'adresse de gra6 à la suite de ce que gra6 a
# écrit. Express, réglé par `app.set('trust proxy', n)`
# (apps/api/src/app/configure-app.ts), remonte cette liste par la DROITE et
# saute `n` entrées.
#
# MESURÉ, pas déduit — chaîne montée pour de vrai en trois conteneurs
# (client → nginx « gra6 » → nginx « carlys » → Express 5.2.1), client honnête,
# gra6 posant X-Forwarded-For :
#
#   TRUST_PROXY_HOPS=1 → req.ip = adresse de GRA6   ✗ tout le monde partage une IP
#   TRUST_PROXY_HOPS=2 → req.ip = adresse du CLIENT ✓
#   TRUST_PROXY_HOPS=3 → identique à 2 (la liste est saturée)
#
# D'où **2** dans les deux fichiers d'environnement (production et recette).
# La valeur 1 était juste tant qu'il n'y avait qu'un seul proxy ; elle ferait
# maintenant compter tout Internet comme une seule adresse.
#
# ── PRÉREQUIS SUR GRA6 : ÉCRASER X-Forwarded-For, jamais l'ajouter ───────────
#
# Ce n'est PAS une hypothèse de travail dont on suppose qu'elle est remplie :
# c'est une exigence à vérifier dans la configuration de gra6. Mesuré sur la
# même chaîne, avec un client qui FORGE lui-même « X-Forwarded-For: 1.2.3.4 » :
#
#   gra6 pose $proxy_add_x_forwarded_for
#     → l'API voit « 1.2.3.4, <client>, <gra6> » et retient 1.2.3.4   ✗ FORGÉ
#   gra6 pose $http_x_forwarded_for
#     → l'API voit « 1.2.3.4, <gra6> »           et retient 1.2.3.4   ✗ FORGÉ
#   gra6 pose $remote_addr
#     → l'API voit « <client>, <gra6> »          et retient <client>  ✓ SÛR
#       (revérifié avec « 9.9.9.9, 8.8.8.8 » : ignoré de la même façon)
#
# RAISON : un compteur de sauts NUMÉRIQUE ne retire des entrées QUE PAR LA
# DROITE. Tout ce qu'un client PRÉFIXE survit, quel que soit le nombre de
# sauts — augmenter TRUST_PROXY_HOPS n'y change rien, cela ne fait que sauter
# des entrées supplémentaires par la droite. La protection ne vient donc pas
# de l'API, elle vient de gra6. Ce que gra6 doit poser, dans le vhost qui sert
# les six noms Carlys :
#
#   proxy_set_header Host              $host;         # conserver le Host original
#   proxy_set_header X-Forwarded-For   $remote_addr;  # ÉCRASER, jamais ajouter
#   proxy_set_header X-Forwarded-Proto https;
#
# Si gra6 ajoute au lieu d'écraser, N'IMPORTE QUEL client se fait passer pour
# n'importe quelle adresse : limitation de débit contournée et journal
# d'audit empoisonné. Et le risque est réel, pas
# théorique : `request.ip` est lu à SIX endroits de apps/api/src — l'audit des
# actions d'administration (admin-users, admin-community, catalog-actor,
# media) et `authenticated-request.ts` — et par le ThrottlerGuard.
#
# Voir docs/security/reverse-proxy.md.

proxy_http_version 1.1;

proxy_set_header Host            $host;
proxy_set_header X-Real-IP       $remote_addr;

# Ce Nginx AJOUTE (`$proxy_add_x_forwarded_for`), volontairement : il colle
# l'adresse de gra6 derrière ce que gra6 a écrit, et c'est cet ajout qui fait
# le second saut compté par TRUST_PROXY_HOPS=2. L'écrasement, lui, est le
# travail de gra6 — voir le grand commentaire ci-dessus.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# `https` EN DUR. Ni `$scheme`, qui vaudrait « http » puisque gra6 nous parle
# en clair ; ni `$http_x_forwarded_proto`, dont on ne suppose rien — c'est du
# texte fourni par la requête entrante. Le client, lui, a bien parlé HTTPS à
# gra6 : c'est cela que l'en-tête doit décrire.
#
# MESURÉ sur la chaîne à trois conteneurs : avec cette ligne, l'API voit
# req.protocol = 'https' et req.secure = true alors que tout le trajet interne
# est en clair. C'est ce qui garantit le point « les URL publiques restent en
# https:// » (PUBLIC_APP_URL, CORS_ORIGINS, S3_PUBLIC_BASE_URL…) : le HTTP
# interne ne doit JAMAIS ressortir en http:// côté client.
#
# COROLLAIRE DE SÉCURITÉ, à traiter comme un prérequis de pare-feu : le port 80
# de cette machine ne doit être joignable QUE depuis gra6. Sinon n'importe qui
# obtient de l'API un req.secure = true mensonger — et surtout s'adresse à elle
# sans être passé par l'écrasement de X-Forwarded-For décrit plus haut.
#
# Pour situer le risque : aujourd'hui, AUCUN fichier de apps/api/src ne lit
# req.protocol ni req.secure (vérifié par recherche). Cet en-tête est une
# garantie d'avenir ; c'est X-Forwarded-For qui porte le risque du jour.
proxy_set_header X-Forwarded-Proto https;

proxy_set_header X-Forwarded-Host $host;

# 443, et non `$server_port` qui vaudrait 80 : c'est le port PUBLIC, celui que
# le client a contacté sur gra6. Un « X-Forwarded-Port: 80 » à côté d'un
# « X-Forwarded-Proto: https » se contredit, et le premier cadre qui
# reconstruirait une URL à partir des deux produirait une absurdité. Rien ne
# lit cet en-tête dans le dépôt aujourd'hui (vérifié par recherche) — raison de
# plus pour qu'il ne mente pas le jour où quelque chose le lira.
proxy_set_header X-Forwarded-Port 443;

# Ni WebSocket ni SSE dans Carlys aujourd'hui : aucune route de l'API ne
# produit `text/event-stream` et l'admin Next.js tourne en `standalone`, donc
# sans rechargement à chaud. On n'ajoute donc PAS le couple
# `Upgrade`/`Connection`, qui obligerait à déclarer une directive `map` dans le
# bloc `http` et ferait de ce fichier autre chose qu'un simple `include`.
# Le jour où un flux apparaît, c'est ici et dans le bloc `http` que ça se pose.

# Le délai par défaut (60 s) suffit à toutes les routes actuelles. Il est
# rappelé explicitement pour que sa modification soit un geste conscient.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
