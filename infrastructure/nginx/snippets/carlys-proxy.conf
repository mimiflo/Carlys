# En-têtes de proxy communs aux vhosts Carlys qui parlent à l'API ou à l'admin.
#
# Installé en /etc/nginx/snippets/carlys-proxy.conf, il s'inclut par
#   include snippets/carlys-proxy.conf;
# (les chemins d'`include` sont relatifs au préfixe de Nginx, /etc/nginx).
#
# Pourquoi un fichier partagé plutôt que six recopies : il y a SIX vhosts
# (api, app, media × production, recette) et ces en-têtes doivent rester
# identiques partout. Une recopie qui dérive, et c'est l'adresse du client que
# l'API perd — silencieusement, jusqu'au jour où la limitation de débit
# compte tout le monde comme une seule personne.
#
# ── La chaîne réelle : DEUX proxys, donc TRUST_PROXY_HOPS=2 ──────────────────
#
#   client ──HTTPS 443──> rtr1.briancon.luuc.fr ──HTTP──> ce Nginx ──> Express (API)
#                          ^ termine le TLS      ^ 172.16.0.158:80
#
# `$proxy_add_x_forwarded_for` ajoute `$remote_addr` À LA FIN de l'en-tête
# reçu : ce Nginx écrit donc l'adresse de rtr1 à la suite de ce que rtr1 a
# écrit. Express, réglé par `app.set('trust proxy', n)`
# (apps/api/src/app/configure-app.ts), remonte cette liste par la DROITE et
# saute `n` entrées.
#
# MESURÉ, pas déduit — chaîne montée pour de vrai en trois conteneurs
# (client → nginx « rtr1 » → nginx « carlys » → Express 5.2.1), client honnête,
# rtr1 posant X-Forwarded-For :
#
#   TRUST_PROXY_HOPS=1 → req.ip = adresse de RTR1   ✗ tout le monde partage une IP
#   TRUST_PROXY_HOPS=2 → req.ip = adresse du CLIENT ✓
#   TRUST_PROXY_HOPS=3 → identique à 2 si rtr1 écrase ; si rtr1 AJOUTE, l'adresse
#                        forgée par le client ✗ — jamais plus de sauts que de proxys
#
# D'où **2** dans les deux fichiers d'environnement (production et recette).
# La valeur 1 était juste tant qu'il n'y avait qu'un seul proxy ; elle ferait
# maintenant compter tout Internet comme une seule adresse.
#
# ── PRÉREQUIS SUR RTR1 : poser EN DERNIER l'adresse qu'il voit ─────────────
#
# Ce n'est PAS une hypothèse de travail dont on suppose qu'elle est remplie :
# c'est une exigence à vérifier dans la configuration de rtr1. Avec un client
# qui FORGE lui-même « X-Forwarded-For: 1.2.3.4 » :
#
#   rtr1 pose $remote_addr (il écrase)
#     → l'API voit « <client>, <rtr1> »          et retient <client>  ✓ SÛR
#   rtr1 pose $proxy_add_x_forwarded_for (il ajoute)
#     → l'API voit « 1.2.3.4, <client>, <rtr1> » et retient <client>  ✓ SÛR
#   rtr1 pose $http_x_forwarded_for (il relaie tel quel)
#     → l'API voit « 1.2.3.4, <rtr1> »           et retient 1.2.3.4   ✗ FORGÉ
#
# RAISON : Express lit la liste par la DROITE et saute deux entrées, celles
# des deux proxys ; il retient donc l'entrée écrite par rtr1. Ce qu'un client
# PRÉFIXE reste dans l'en-tête sans jamais être retenu — pourvu que rtr1 y
# mette ce qu'il voit. MESURÉ sur la chaîne réelle le 12 octobre 2026 : rtr1
# AJOUTE, l'API reçoit « 1.2.3.4, <client>, 172.16.0.124 » et retient le
# client (épinglé par apps/api/test/trust-proxy.e2e-spec.ts). Ce commentaire
# classait l'ajout parmi les échecs : c'était faux — mais l'ajout n'est sûr
# qu'avec un compteur EXACT, d'où $remote_addr, conseillé.
#
# Ce que rtr1 doit poser, dans le vhost qui sert les six noms Carlys :
#
#   proxy_set_header Host              $host;         # conserver le Host original
#   proxy_set_header X-Forwarded-For   $remote_addr;  # conseillé ; ou $proxy_add_x_forwarded_for
#   proxy_set_header X-Forwarded-Proto https;
#
# Si rtr1 relayait l'en-tête du client tel quel, N'IMPORTE QUEL client se
# ferait passer pour n'importe quelle adresse : limitation de débit contournée
# et journal d'audit empoisonné. Et le risque est réel, pas
# théorique : `request.ip` est lu à DEUX endroits de apps/api/src — l'acteur
# de tout geste d'administration (admin-actor.ts) et
# `authenticated-request.ts` — et par le ThrottlerGuard.
#
# Voir docs/security/reverse-proxy.md.

proxy_http_version 1.1;

# `Connection` VIDÉ, et c'est ce qui rend le pool de connexions utile.
#
# L'amont de l'API déclare `keepalive 32` (carlys-api-upstream.conf.example) :
# Nginx garde des connexions ouvertes vers les exemplaires de l'API au lieu
# d'en rouvrir une par requête. Mais par défaut, Nginx transmet à l'amont un
# `Connection: close` — construit à partir de l'en-tête du client — qui fait
# refermer la connexion juste après la réponse. Le pool existerait alors sans
# jamais servir, et personne ne le verrait : tout continue de fonctionner,
# simplement avec une poignée de main TCP de plus par requête, sur chaque
# requête de chaque utilisateur.
#
# Sans danger ici : Carlys n'a ni WebSocket ni flux `text/event-stream` (voir
# plus bas), donc aucun `Connection: Upgrade` légitime à relayer.
proxy_set_header Connection      "";

proxy_set_header Host            $host;
proxy_set_header X-Real-IP       $remote_addr;

# Ce Nginx AJOUTE (`$proxy_add_x_forwarded_for`), volontairement : il colle
# l'adresse de rtr1 derrière ce que rtr1 a écrit, et c'est cet ajout qui fait
# le second saut compté par TRUST_PROXY_HOPS=2. Poser l'adresse du client,
# lui, est le travail de rtr1 — voir le grand commentaire ci-dessus.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# `https` EN DUR. Ni `$scheme`, qui vaudrait « http » puisque rtr1 nous parle
# en clair ; ni `$http_x_forwarded_proto`, dont on ne suppose rien — c'est du
# texte fourni par la requête entrante. Le client, lui, a bien parlé HTTPS à
# rtr1 : c'est cela que l'en-tête doit décrire.
#
# MESURÉ sur la chaîne à trois conteneurs : avec cette ligne, l'API voit
# req.protocol = 'https' et req.secure = true alors que tout le trajet interne
# est en clair. C'est ce qui garantit le point « les URL publiques restent en
# https:// » (PUBLIC_APP_URL, CORS_ORIGINS, S3_PUBLIC_BASE_URL…) : le HTTP
# interne ne doit JAMAIS ressortir en http:// côté client.
#
# COROLLAIRE DE SÉCURITÉ, à traiter comme un prérequis de pare-feu : le port 80
# de cette machine ne doit être joignable QUE depuis rtr1. Sinon n'importe qui
# obtient de l'API un req.secure = true mensonger — et surtout s'adresse à elle
# sans être passé par rtr1, qui écrit l'entrée de X-Forwarded-For retenue.
#
# Pour situer le risque : aujourd'hui, AUCUN fichier de apps/api/src ne lit
# req.protocol ni req.secure (vérifié par recherche). Cet en-tête est une
# garantie d'avenir ; c'est X-Forwarded-For qui porte le risque du jour.
proxy_set_header X-Forwarded-Proto https;

proxy_set_header X-Forwarded-Host $host;

# 443, et non `$server_port` qui vaudrait 80 : c'est le port PUBLIC, celui que
# le client a contacté sur rtr1. Un « X-Forwarded-Port: 80 » à côté d'un
# « X-Forwarded-Proto: https » se contredit, et le premier cadre qui
# reconstruirait une URL à partir des deux produirait une absurdité. Rien ne
# lit cet en-tête dans le dépôt aujourd'hui (vérifié par recherche) — raison de
# plus pour qu'il ne mente pas le jour où quelque chose le lira.
proxy_set_header X-Forwarded-Port 443;

# Pas de WebSocket dans Carlys : l'admin Next.js tourne en `standalone`, donc
# sans rechargement à chaud. On n'ajoute donc PAS le couple
# `Upgrade`/`Connection`, qui obligerait à déclarer une directive `map` dans le
# bloc `http` et ferait de ce fichier autre chose qu'un simple `include`. Le
# flux SSE du coach, lui, est du HTTP ordinaire (voir plus bas).

# Le délai par défaut (60 s) suffit à toutes les routes. `proxy_read_timeout`
# se compte entre DEUX lectures, pas pour la réponse entière : le flux du
# coach, qui peut durer trois minutes, ne se tait jamais plus de 15 s (le
# texte, ou un battement `: ping` de l'API). Il est rappelé explicitement pour
# que sa modification soit un geste conscient.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# ── Réponses EN FLUX (le coach qui écrit en direct) ──────────────────────────
#
# L'API pose `X-Accel-Buffering: no` sur ses flux SSE : ce Nginx relaie alors
# chaque évènement sans l'accumuler. Mais il MASQUE cet en-tête par défaut ;
# on le laisse passer pour que rtr1, s'il est lui aussi un Nginx, ne retienne
# pas le flux à son tour. Sans effet sur les autres réponses, qui ne le
# portent pas.
proxy_pass_header X-Accel-Buffering;
