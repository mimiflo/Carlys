# Environnement de développement Carlys.
#
#   docker compose up -d              → infrastructure seule (PostgreSQL, Redis, Mailpit, MinIO)
#   docker compose --profile app up   → infrastructure + API + Admin conteneurisées
#
# En développement quotidien, l'API et l'admin se lancent plutôt en local
# (`pnpm dev`) pour bénéficier du rechargement à chaud.

name: carlys

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carlys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carlys_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-carlys_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Interface web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/livez']
      interval: 10s
      timeout: 3s
      retries: 5

  # POURQUOI quay.io, ÉPINGLÉ PAR EMPREINTE : minio/minio et minio/mc ont
  # DISPARU de Docker Hub (MinIO a cessé de distribuer ses images en octobre
  # 2025, archivé son dépôt en février 2026 — dl.min.io rend 410 jusqu'aux
  # binaires signés) ; un poste neuf n'aurait plus rien à tirer. quay.io, le
  # registre historique de MinIO, sert encore tous les tags. Le projet est
  # gelé : « latest » ne voudra plus jamais rien dire, le digest fige ce qui
  # tourne et fait échouer franchement toute disparition future. Mêmes
  # versions que la CI (api-ci.yml) et que le serveur
  # (infrastructure/server/compose.yml) : un seul MinIO, partout.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carlys-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carlys-dev-secret}
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Crée le bucket de médias au premier démarrage, et le rend lisible en
  # anonyme : les applications chargent les photos directement depuis son URL,
  # sans passer par l'API ni présenter de jeton. Seul le DÉPÔT est protégé.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    # `mc anonymous set download` n'accorde PAS que la lecture d'objet : mesuré,
    # il pose aussi `s3:ListBucket`, et `GET /carlys-media/?list-type=2` rend
    # alors 200 avec l'inventaire complet des clés, sans aucun jeton. Le
    # développement tourne sur la boucle locale, mais il sert de modèle au
    # serveur — et un modèle qui enseigne le mauvais geste finit recopié. La
    # politique ci-dessous n'accorde que `s3:GetObject` sur le contenu.
    entrypoint: >
      /bin/sh -c "
      set -e &&
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-carlys-dev} $${MINIO_ROOT_PASSWORD:-carlys-dev-secret} &&
      mc mb --ignore-existing local/carlys-media &&
      printf '%s'
      '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::carlys-media/*\"]}]}'
      > /tmp/politique.json &&
      mc anonymous set-json /tmp/politique.json local/carlys-media
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carlys-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carlys-dev-secret}

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-carlys}:${POSTGRES_PASSWORD:-carlys_dev_password}@postgres:5432/${POSTGRES_DB:-carlys_dev}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3001
      LOG_LEVEL: debug
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret-jwt-de-developpement-a-remplacer-absolument}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Médias : le conteneur parle à MinIO par le réseau Compose, mais l'URL
      # publique doit rester joignable depuis le téléphone ou le navigateur.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: carlys-media
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-carlys-dev}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-carlys-dev-secret}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/carlys-media}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
        # Image locale : les textes légaux peuvent encore porter des [À COMPLÉTER : …].
        LEGAL_PLACEHOLDERS: allow
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
