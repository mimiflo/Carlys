name: carlys_mobile
description: Carlys — application mobile fitness (iOS & Android, desktop à venir).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État & injection de dépendances
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Réseau
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Base locale (offline-first)
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Modèles immuables & sérialisation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Sécurité locale
  flutter_secure_storage: ^9.2.2

  # Préférences UI non sensibles (thème…) — solution standard de persistance
  shared_preferences: ^2.3.2

  # Visualisation
  fl_chart: ^0.69.0

  # Utilitaires
  uuid: ^4.5.1
  # Version imposée par flutter_localizations.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Génération de code (Riverpod, Freezed, JSON, Drift)
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true

  assets:
    # Images de MARQUE (sceau détouré, photographie) : servies par la page de
    # bienvenue, la première que voit un nouvel arrivant.
    - assets/brand/
    # Vignettes des groupes musculaires (bibliothèque d'exercices). Embarquées
    # et non servies : elles sont douze, fixes, et doivent s'afficher hors
    # ligne. Les images PAR EXERCICE, elles, viendront du serveur — il y en
    # aura des centaines et elles seront modifiables depuis l'admin.
    - assets/muscles/

  # Polices de la refonte (licences OFL dans assets/fonts/) :
  # Inter pour le texte, JetBrains Mono pour TOUS les chiffres (tabulaires).
  fonts:
    - family: Inter
      fonts:
        # 300 : le mot CARLYS de la page de marque, et lui seul.
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  # Les autres dossiers d'assets (animations, images…) seront déclarés ici
  # dès qu'ils contiendront de vrais fichiers.

  # Firebase Cloud Messaging et Sentry seront ajoutés avec la configuration
  # de projet correspondante (google-services.json, DSN) — pas de dépendance
  # morte tant que la configuration n'existe pas.
