name: carlys_mobile
description: Carlys — application mobile fitness (iOS & Android, desktop à venir).
publish_to: 'none'
version: 0.1.0+1

environment:
  # Le Dart du Flutter épinglé par .flutter-version (3.44.9 → Dart 3.12) :
  # borne fixe la version de LANGAGE de tout le code (et le style de
  # `dart format`). Elle suit la CI, jamais l'inverse — voir
  # docs/development/poste-de-travail.md.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État & injection de dépendances
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Réseau
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Base locale (offline-first).
  #
  # Pas de `sqlite3_flutter_libs` : depuis drift 2.32 (paquet `sqlite3` 3.x),
  # la bibliothèque SQLite native est fournie par le hook de build de
  # `package:sqlite3` lui-même, sur Android, iOS et en tests (bibliothèque
  # précompilée, téléchargée et vérifiée par empreinte). Le paquet
  # `sqlite3_flutter_libs` est en fin de vie (sa dernière version, 0.6.0+eol,
  # est vide) et, gardé, il livrait une SECONDE copie de SQLite dans l'APK.
  # `drift_flutter` n'est pas adopté non plus : il dépend encore de ce paquet
  # vide et n'apporte que `driftDatabase()`, ce que `app_database.dart` fait
  # déjà avec `path_provider` et `NativeDatabase.createInBackground`.
  drift: ^2.34.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # Sécurité locale
  flutter_secure_storage: ^9.2.2

  # Préférences UI non sensibles (thème…) — solution standard de persistance
  shared_preferences: ^2.3.2

  # Visualisation
  fl_chart: ^0.69.0

  # Code ami : rendu du QR de profil (pur Dart, aucun natif)…
  qr_flutter: ^4.1.0
  # …et lecture du QR d'un ami par la caméra (le natif est ici, isolé
  # dans l'écran de scan — tout le reste de la fonctionnalité vit sans lui).
  mobile_scanner: ^6.0.10

  # Notifications push (projet Firebase carlys — options injectées au
  # lancement via --dart-define-from-file, jamais commitées ; sans elles,
  # le push est simplement inactif). Voir config/firebase.example.json.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Ouverture de la page de paiement dans le navigateur — greffon officiel
  # Flutter, et seule façon de sortir vers une URL externe. L'achat se fait
  # chez le prestataire de paiement, jamais dans l'application : c'est lui
  # qui encaisse, et le droit revient par webhook signé.
  url_launcher: ^6.3.1

  # Utilitaires
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Génération de code — DRIFT UNIQUEMENT.
  #
  # Les générateurs Riverpod, Freezed et json_serializable ont été retirés :
  # aucune source ne portait leurs annotations, ils ne produisaient donc rien
  # tout en tournant à chaque `build_runner` et à chaque exécution de la CI.
  # Le seul fichier engendré du projet est `app_database.g.dart`.
  build_runner: ^2.4.13
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true

  assets:
    # Images de MARQUE (sceau détouré, photographie) : servies par la page de
    # bienvenue, la première que voit un nouvel arrivant.
    - assets/brand/
    # Vignettes des groupes musculaires (bibliothèque d'exercices). Embarquées
    # et non servies : elles sont douze, fixes, et doivent s'afficher hors
    # ligne. Les images PAR EXERCICE, elles, viendront du serveur — il y en
    # aura des centaines et elles seront modifiables depuis l'admin.
    - assets/muscles/
    # Catalogue et vignettes de la DÉMONSTRATION uniquement, engendrés depuis
    # le seed (`pnpm --filter @carlys/api demo:catalog`). La démo tourne sans
    # serveur : sans ces fichiers elle n'aurait ni exercices ni images. Les
    # applications reliées à l'API, elles, ne les lisent JAMAIS.
    - assets/demo/catalog.json
    - assets/demo/exercises/
    # Pack d'apprentissage de l'Academy : contenu ÉDITORIAL embarqué (leçons
    # et questions), pas une donnée serveur — l'Academy fonctionne hors ligne.
    - assets/academy/
    # Illustrations des 4 profils Carlys (voir le README du dossier). Tant
    # qu'un fichier manque, la carte pose un repli de marque — jamais un trou.
    - assets/profiles/

  # Polices de la refonte (licences OFL dans assets/fonts/) :
  # Inter pour le texte, JetBrains Mono pour TOUS les chiffres (tabulaires).
  fonts:
    - family: Inter
      fonts:
        # 300 : le mot CARLYS de la page de marque, et lui seul.
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  # Les autres dossiers d'assets (animations, images…) seront déclarés ici
  # dès qu'ils contiendront de vrais fichiers.

  # Sentry sera ajouté avec la configuration de projet correspondante (DSN) —
  # pas de dépendance morte tant que la configuration n'existe pas.
