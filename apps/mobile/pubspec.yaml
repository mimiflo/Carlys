name: carlys_mobile
description: Carlys — application mobile fitness (iOS & Android, desktop à venir).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État & injection de dépendances
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Réseau
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Base locale (offline-first)
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Modèles immuables & sérialisation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Sécurité locale
  flutter_secure_storage: ^9.2.2

  # Visualisation & animations
  fl_chart: ^0.69.0
  rive: ^0.13.15

  # Utilitaires
  uuid: ^4.5.1
  # Version imposée par flutter_localizations.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Génération de code (Riverpod, Freezed, JSON, Drift)
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true

  # Les dossiers d'assets (assets/animations, assets/rive, assets/images…)
  # seront déclarés ici dès qu'ils contiendront de vrais fichiers.

  # Firebase Cloud Messaging et Sentry seront ajoutés avec la configuration
  # de projet correspondante (google-services.json, DSN) — pas de dépendance
  # morte tant que la configuration n'existe pas.
